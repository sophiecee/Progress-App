    box.innerText = 'JS Error:\n' + msg + '\n\nAt: ' + url + ':' + line + ':' + col + '\n\n' + (error && error.stack ? error.stack : '');
    document.body ? document.body.appendChild(box) : document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(box); });
    return false;
  };
</script>

const SUPABASE_KEY = "sb_publishable_2XUXLVI8kqqK4nH62VWwRw_x79F5gNo";

/* ---------- Sign in screen ---------- */
function SignIn({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr(null);
    setBusy(true);
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (error) {
      setErr(error.message);
      return;
    }
    onSignedIn(data.session);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-xs">
        <h1 className="font-display text-2xl text-[#3A3226] mb-1 text-center">Developmental Journal</h1>
        <p className="text-sm text-[#8A7E64] mb-6 text-center">Sign in to continue</p>

        <label className="block text-xs text-[#5B4A2E] mb-1">Email</label>
        <input
          type="email"
          autoCapitalize="none"
          autoCorrect="off"
          value={email}
          onChange={e => setEmail(e.target.value)}
          className="w-full text-sm rounded-lg border border-[#E3DCC9] p-2.5 bg-white text-[#3A3226] mb-3"
        />

        <label className="block text-xs text-[#5B4A2E] mb-1">Password</label>
        <input
          type="password"
          value={password}
          onChange={e => setPassword(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") submit(); }}
          className="w-full text-sm rounded-lg border border-[#E3DCC9] p-2.5 bg-white text-[#3A3226] mb-4"
        />

        {err && <p className="text-xs text-[#B7452F] mb-3">{err}</p>}

        <button
          onClick={submit}
          disabled={busy || !email || !password}
          className="w-full rounded-lg py-2.5 text-sm font-medium text-[#FAF6EE] disabled:opacity-50"
          style={{ background: "#8B6F47" }}
        >
          {busy ? "Signing in…" : "Sign in"}
        </button>
      </div>
    </div>
  );
}

/* ---------- Local queue for offline-safe writes ---------- */
const QUEUE_KEY = "dj_write_queue_v1";
function queueGet() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch { return []; } }
function queueSet(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
function queuePush(op) { const q = queueGet(); q.push(op); queueSet(q); }

async function drainQueue(onDrain) {
  let q = queueGet();
  if (!q.length) { if (onDrain) onDrain(0); return; }
  const remaining = [];
  for (const op of q) {
    try {
      await runOp(op);
    } catch (e) {
      remaining.push(op);
    }
  }
  queueSet(remaining);
  if (onDrain) onDrain(remaining.length);
}

async function runOp(op) {
  if (op.table === "mark") {
    if (op.action === "upsert") {
      const { error } = await sb.from("mark").upsert(op.row, { onConflict: "child_id,item_id,track,level" });
      if (error) throw error;
    } else if (op.action === "delete") {
      const { error } = await sb.from("mark").delete().match(op.match);
      if (error) throw error;
    } else if (op.action === "unsetCurrent") {
      // Marks whichever row was active for this item/track as no longer
      // current, WITHOUT deleting it - the dated row stays in the table
      // forever so History and the export can still show it happened.
      const { error } = await sb.from("mark").update({ is_current: false })
        .match({ child_id: op.childId, item_id: op.itemId, track: op.track, is_current: true });
      if (error) throw error;
    }
  } else if (op.table === "item_note") {
    const { error } = await sb.from("item_note").upsert(op.row, { onConflict: "child_id,item_id,track" });
    if (error) throw error;
  } else if (op.table === "step_concern") {
    const { error } = await sb.from("step_concern").upsert(op.row, { onConflict: "child_id,step" });
    if (error) throw error;
  }
}

/* ---------- Small helpers ---------- */
function todayISO() { return new Date().toISOString().slice(0, 10); }

function levelColor(level) {
  switch (level) {
    case "not_started": return { bg: "#F0E4DD", border: "#CFA98F", text: "#8A5A3C" };
    case "emerging": return { bg: "#F4E9D8", border: "#D9BE8F", text: "#7A5C25" };
    case "developing": return { bg: "#E4EEE0", border: "#A8C79A", text: "#4B6B3C" };
    case "achieved": return { bg: "#DCEBEA", border: "#8FC0BC", text: "#2E6A65" };
    case "achieved_before": return { bg: "#E8E4EF", border: "#B7A7D6", text: "#5B4A82" };
    default: return { bg: "#F1EDE3", border: "#E0D7C3", text: "#8A7E64" };
  }
}

/* ---------- Data hooks ---------- */
function useChild() {
  const [child, setChild] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await sb.from("child").select("*").limit(1).maybeSingle();
        if (error) throw error;
        setChild(data);
      } catch (e) {
        setErr(e.message || String(e));
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  return { child, loading, err };
}

function useMarks(childId, refreshToken) {
  const [marks, setMarks] = useState({});
  const [notes, setNotes] = useState({});
  const [concerns, setConcerns] = useState({});
  const [loading, setLoading] = useState(true);
  const loadedOnce = useRef(false);

  useEffect(() => {
    if (!childId) return;
    (async () => {
      // Only show the loading placeholder on the very first fetch.
      // Later refreshes (after every tap) happen silently, so the page
      // content never disappears and briefly collapses - that collapse
      // was what made the page jump back to the top after each tap.
      if (!loadedOnce.current) setLoading(true);
      const [mRes, nRes, cRes] = await Promise.all([
        sb.from("mark").select("*").eq("child_id", childId),
        sb.from("item_note").select("*").eq("child_id", childId),
        sb.from("step_concern").select("*").eq("child_id", childId)
      ]);
      const mk = {};
      (mRes.data || []).forEach(r => {
        const k = `${r.item_id}|${r.track}`;
        (mk[k] = mk[k] || []).push(r);
      });
      const nt = {};
      (nRes.data || []).forEach(r => { nt[`${r.item_id}|${r.track}`] = r.body; });
      const cc = {};
      (cRes.data || []).forEach(r => { cc[r.step] = r.body; });
      setMarks(mk); setNotes(nt); setConcerns(cc); setLoading(false);
      loadedOnce.current = true;
    })();
  }, [childId, refreshToken]);

  return { marks, notes, concerns, loading };
}

/* ---------- Level control for one item/track ---------- */
function LevelButtons({ childId, itemId, track, current, onChanged, LEVELS, BACKFILL }) {
  const [saving, setSaving] = useState(null);

  const allLevels = [...LEVELS, BACKFILL];

  // Only the row(s) still flagged is_current count as "active" for the
  // pills. Older rows stay in the database (for History/export) but are
  // never shown as ticked here.
  const currentRows = (current || []).filter(r => r.is_current);
  const activeLevel = currentRows[0]?.level || null;

  const unsetCurrent = async () => {
    const op = { table: "mark", action: "unsetCurrent", childId, itemId, track };
    queuePush(op);
    try { await runOp(op); queueSet(queueGet().filter(o => o !== op)); } catch (e) {}
  };

  const setLevel = async (level) => {
    setSaving(level.id);

    if (activeLevel === level.id) {
      // tapping the already-active pill unticks it - the dated row stays
      // in the table, just no longer marked current
      await unsetCurrent();
      setSaving(null);
      onChanged();
      return;
    }

    // clear whatever was active (without deleting it), then mark the new
    // level current - this is what keeps "achieved before" mutually
    // exclusive with everything else, and stops two levels ever being
    // ticked at once, while preserving every date this item was ever set
    await unsetCurrent();
    const row = {
      child_id: childId,
      item_id: itemId,
      track,
      level: level.id,
      observed_on: todayISO(),
      approximate: level.id === "achieved_before",
      is_current: true
    };
    const op = { table: "mark", action: "upsert", row };
    queuePush(op);
    try {
      await runOp(op);
      queueSet(queueGet().filter(o => o !== op));
    } catch (e) {}
    setSaving(null);
    onChanged();
  };

  return (
    <div className="flex flex-wrap gap-1.5">
      {allLevels.map(level => {
        const active = activeLevel === level.id;
        const c = levelColor(level.id);
        return (
          <button
            key={level.id}
            onClick={() => setLevel(level)}
            title={active ? "Tap again to remove" : level.hint}
            className="text-xs font-medium px-2.5 py-1.5 rounded-full border transition-colors"
            style={{
              background: active ? c.bg : "#fff",
              borderColor: active ? c.border : "#E3DCC9",
              color: active ? c.text : "#8A7E64"
            }}
          >
            {saving === level.id ? "…" : level.label}
          </button>
        );
      })}
    </div>
  );
}

/* ---------- One journal item row ---------- */
function ItemRow({ item, childId, marks, notes, bump, LEVELS, BACKFILL }) {
  const [noteOpen, setNoteOpen] = useState(false);
  const [noteText, setNoteText] = useState("");
  const [savingNote, setSavingNote] = useState(false);

  const tracks = item.split ? ["sign", "spoken"] : ["both"];

  useEffect(() => {
    const key = `${item.id}|${tracks[0]}`;
    setNoteText(notes[key] || "");
  }, [notes, item.id]);

  const saveNote = async (track) => {
    setSavingNote(true);
    const row = { child_id: childId, item_id: item.id, track, body: noteText, updated_at: new Date().toISOString() };
    const op = { table: "item_note", row };
    queuePush(op);
    try {
      await runOp(op);
      queueSet(queueGet().filter(o => o !== op));
    } catch (e) {}
    setSavingNote(false);
    bump();
  };

  return (
    <div className="py-4 border-b border-[#EAE2CD] last:border-b-0">
      <p className="text-[15px] leading-snug text-[#3A3226] mb-2.5">{item.text}</p>
      {tracks.map(track => (
        <div key={track} className={tracks.length > 1 ? "mb-2" : ""}>
          {tracks.length > 1 && (
            <div className="text-[11px] uppercase tracking-wide text-[#8A7E64] mb-1">
              {track === "sign" ? "Sign" : "Spoken"}
            </div>
          )}
          <LevelButtons
            childId={childId}
            itemId={item.id}
            track={track}
            current={marks[`${item.id}|${track}`]}
            onChanged={bump}
            LEVELS={LEVELS}
            BACKFILL={BACKFILL}
          />
        </div>
      ))}
      <button
        onClick={() => setNoteOpen(o => !o)}
        className="mt-2 text-xs text-[#8B6F47] underline underline-offset-2"
      >
        {noteOpen ? "Hide note" : (noteText ? "Edit note" : "Add note")}
      </button>
      {!noteOpen && noteText && (
        <p className="text-xs italic text-[#8A7E64] mt-1.5">
          📝 {noteText.length > 90 ? noteText.slice(0, 90) + "…" : noteText}
        </p>
      )}
      {noteOpen && (
        <div className="mt-2">
          <textarea
            value={noteText}
            onChange={e => setNoteText(e.target.value)}
            onBlur={() => saveNote(tracks[0])}
            placeholder="Any notes or queries on how your child does this"
            className="w-full text-sm rounded-lg border border-[#E3DCC9] p-2 bg-white text-[#3A3226]"
            rows={2}
          />
          {savingNote && <span className="text-xs text-[#8A7E64]">Saving…</span>}
        </div>
      )}
    </div>
  );
}

/* ---------- Subdomain section within a step ---------- */
function SubdomainSection({ step, sub, childId, marks, notes, bump, ITEMS, LEVELS, BACKFILL }) {
  const items = useMemo(() => ITEMS.filter(i => i.step === step && i.sub === sub.id), [step, sub, ITEMS]);
  if (!items.length) return null;
  return (
    <div className="mb-8 scroll-mt-32" id={`sub-${step}-${sub.id}`}>
      <h3 className="font-display text-lg text-[#5B4A2E] mb-1">{sub.name}</h3>
      <div>
        {items.map(item => (
          <ItemRow key={item.id} item={item} childId={childId} marks={marks} notes={notes} bump={bump} LEVELS={LEVELS} BACKFILL={BACKFILL} />
        ))}
      </div>
    </div>
  );
}

/* ---------- Step concern note ---------- */
function StepConcern({ step, childId, concerns, bump }) {
  const [text, setText] = useState(concerns[step] || "");
  const [saving, setSaving] = useState(false);
  useEffect(() => { setText(concerns[step] || ""); }, [concerns, step]);

  const save = async () => {
    setSaving(true);
    const row = { child_id: childId, step, body: text, updated_at: new Date().toISOString() };
    const op = { table: "step_concern", row };
    queuePush(op);
    try { await runOp(op); queueSet(queueGet().filter(o => o !== op)); } catch (e) {}
    setSaving(false);
    bump();
  };

  return (
    <div className="mt-4 bg-[#F1EDE3] rounded-xl p-4">
      <p className="text-sm text-[#5B4A2E] mb-2">
        Thinking about this Step as a whole — anything you're concerned about or want to ask?
      </p>
      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        onBlur={save}
        rows={3}
        className="w-full text-sm rounded-lg border border-[#E3DCC9] p-2 bg-white text-[#3A3226]"
      />
      {saving && <span className="text-xs text-[#8A7E64]">Saving…</span>}
    </div>
  );
}

/* ---------- Step view ---------- */
function StepView({ step, childId, marks, notes, concerns, bump, DJ_CONTENT }) {
  const { ITEMS, AREAS, LEVELS, BACKFILL } = DJ_CONTENT;

  const subdomains = useMemo(() => {
    const present = new Set(ITEMS.filter(i => i.step === step).map(i => i.sub));
    return AREAS.flatMap(a =>
      a.subdomains.filter(s => present.has(s.id)).map(s => ({ ...s, areaName: a.name }))
    );
  }, [step, ITEMS, AREAS]);

  const jumpTo = (subId) => {
    const el = document.getElementById(`sub-${step}-${subId}`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  let lastArea = null;
  return (
    <div>
      {subdomains.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-2 mb-4 -mx-4 px-4 border-b border-[#EAE2CD]">
          {subdomains.map(sub => (
            <button
              key={sub.id}
              onClick={() => jumpTo(sub.id)}
              className="flex-shrink-0 text-xs px-2.5 py-1 rounded-full bg-white border border-[#E3DCC9] text-[#5B4A2E]"
            >
              {sub.name}
            </button>
          ))}
        </div>
      )}
      {subdomains.map(sub => {
        const showAreaHeader = sub.areaName !== lastArea;
        lastArea = sub.areaName;
        return (
          <div key={sub.id}>
            {showAreaHeader && (
              <div className="text-[11px] uppercase tracking-widest text-[#B7A87F] mt-6 mb-2 first:mt-0">
                {sub.areaName}
              </div>
            )}
            <SubdomainSection step={step} sub={sub} childId={childId} marks={marks} notes={notes} bump={bump} ITEMS={ITEMS} LEVELS={LEVELS} BACKFILL={BACKFILL} />
          </div>
        );
      })}
      <StepConcern step={step} childId={childId} concerns={concerns} bump={bump} />
    </div>
  );
}

/* ---------- Profile grid ---------- */
function ProfileGrid({ marks, DJ_CONTENT }) {
  const { AREAS, STEPS_AVAILABLE, ITEMS } = DJ_CONTENT;
  const rows = useMemo(() => AREAS.flatMap(a => a.subdomains.map(s => ({ ...s, area: a.name }))), [AREAS]);

  /* Returns { met, date } where date is the earliest date any of the
     items that pushed this cell over the line was marked achieved -
     i.e. the date the milestone was first reached, matching the paper
     journal's single dated cell rather than a running log of visits. */
  const metFor = (step, sub) => {
    const items = ITEMS.filter(i => i.step === step && i.sub === sub);
    if (!items.length) return { met: null, date: null };
    let done = 0, total = 0, dates = [];
    items.forEach(item => {
      const tracks = item.split ? ["sign", "spoken"] : ["both"];
      tracks.forEach(track => {
        total++;
        const recs = marks[`${item.id}|${track}`] || [];
        const hit = recs.find(r => r.is_current && (r.level === "achieved" || r.level === "achieved_before"));
        if (hit) { done++; if (hit.observed_on) dates.push(hit.observed_on); }
      });
    });
    const met = total ? done > total / 2 : null;
    // date shown is the latest of the dates that were needed to cross the
    // threshold - i.e. the date the *last* of the required items landed
    const date = met && dates.length ? dates.sort().slice(0, done).slice(-1)[0] : null;
    return { met, date };
  };

  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "2-digit" });
  };

  return (
    <div className="overflow-x-auto -mx-4 px-4">
      <table className="text-xs border-collapse min-w-[720px]">
        <thead>
          <tr>
            <th className="text-left p-1.5 sticky left-0 bg-[#FAF6EE] font-medium text-[#5B4A2E] w-24 max-w-[6rem]">Sub-domain</th>
            {STEPS_AVAILABLE.map(s => (
              <th key={s} className="p-1.5 font-medium text-[#8A7E64]">S{s}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.id} className="border-t border-[#EAE2CD]">
              <td className="p-1.5 sticky left-0 bg-[#FAF6EE] text-[#3A3226] w-24 max-w-[6rem] leading-tight">{r.name}</td>
              {STEPS_AVAILABLE.map(s => {
                const { met, date } = metFor(s, r.id);
                return (
                  <td key={s} className="p-1.5 text-center align-top">
                    {met === null ? "" : met ? (
                      <div className="flex flex-col items-center">
                        <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#8FC0BC]" />
                        {date && <span className="text-[9px] text-[#8A7E64] mt-0.5 whitespace-nowrap">{fmtDate(date)}</span>}
                      </div>
                    ) : (
                      <span className="inline-block w-2.5 h-2.5 rounded-full bg-[#EAE2CD]" />
                    )}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
      <p className="text-xs text-[#8A7E64] mt-3">
        A filled dot means more than half the items in that sub-domain are marked Achieved for that Step, dated
        when that milestone was first reached — the same rule the printed journal uses. It's a summary, not a
        gate: every item stays open regardless.
      </p>
    </div>
  );
}

/* ---------- Review sessions: start/finish, and a diff since last session ---------- */
function useReviewSessions(childId, refreshToken) {
  const [sessions, setSessions] = useState([]);
  useEffect(() => {
    if (!childId) return;
    sb.from("review_session").select("*").eq("child_id", childId).order("started_at", { ascending: false })
      .then(({ data }) => setSessions(data || []));
  }, [childId, refreshToken]);
  return sessions;
}

function ReviewSessionBar({ childId, sessions, bump }) {
  const open = sessions.find(s => !s.finished_at);

  const start = async () => {
    await sb.from("review_session").insert({ child_id: childId });
    bump();
  };
  const finish = async () => {
    await sb.from("review_session").update({ finished_at: new Date().toISOString() }).eq("id", open.id);
    bump();
  };

  return (
    <div className="flex items-center justify-between bg-[#F1EDE3] rounded-xl px-3 py-2 mb-4 text-sm">
      {open ? (
        <>
          <span className="text-[#5B4A2E]">Review in progress since {new Date(open.started_at).toLocaleDateString()}</span>
          <button onClick={finish} className="text-[#8B6F47] font-medium underline underline-offset-2">Finish review</button>
        </>
      ) : (
        <>
          <span className="text-[#8A7E64]">Not currently reviewing</span>
          <button onClick={start} className="text-[#8B6F47] font-medium underline underline-offset-2">Start a review</button>
        </>
      )}
    </div>
  );
}

/* Shows what changed between the two most recent finished sessions - the
   thing to hand to a professional, rather than a frozen screenshot. */
function ReviewDiff({ marks, sessions, DJ_CONTENT }) {
  const finished = sessions.filter(s => s.finished_at).sort((a, b) => new Date(b.finished_at) - new Date(a.finished_at));
  if (finished.length < 1) {
    return <p className="text-sm text-[#8A7E64] mb-6">Finish a review to start seeing progress between visits here.</p>;
  }
  const since = finished[1] ? finished[1].finished_at : null;
  const cutoff = since ? new Date(since) : null;

  const changed = [];
  Object.entries(marks).forEach(([key, recs]) => {
    recs.forEach(r => {
      if (!r.observed_on) return;
      const d = new Date(r.observed_on + "T00:00:00");
      if (!cutoff || d > cutoff) {
        const [itemId] = key.split("|");
        const item = DJ_CONTENT.ITEMS.find(i => i.id === itemId);
        if (item) changed.push({ item, level: r.level, date: r.observed_on });
      }
    });
  });
  changed.sort((a, b) => a.date < b.date ? 1 : -1);

  return (
    <div className="mb-6">
      <h3 className="font-display text-lg text-[#5B4A2E] mb-2">
        {cutoff ? `Since ${cutoff.toLocaleDateString()}` : "All marks so far"}
      </h3>
      {changed.length === 0 ? (
        <p className="text-sm text-[#8A7E64]">Nothing new marked since the last review.</p>
      ) : (
        <ul className="text-sm space-y-1.5">
          {changed.map((c, i) => (
            <li key={i} className="flex justify-between gap-2 text-[#3A3226]">
              <span>{c.item.text}</span>
              <span className="text-[#8A7E64] whitespace-nowrap text-xs pt-0.5">{c.level.replace("_", " ")}</span>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* ---------- Age helper, for History and export ---------- */
function ageAt(dobISO, dateISO) {
  if (!dobISO || !dateISO) return "";
  const dob = new Date(dobISO + "T00:00:00");
  const d = new Date(dateISO + "T00:00:00");
  let months = (d.getFullYear() - dob.getFullYear()) * 12 + (d.getMonth() - dob.getMonth());
  if (d.getDate() < dob.getDate()) months--;
  if (months < 0) return "";
  const y = Math.floor(months / 12), m = months % 12;
  return y > 0 ? `${y}y ${m}m` : `${m}m`;
}

/* ---------- History: every dated entry ever recorded, newest first ---------- */
function HistoryView({ marks, notes, DJ_CONTENT, child }) {
  const subLookup = useMemo(() => {
    const map = {};
    DJ_CONTENT.AREAS.forEach(a => a.subdomains.forEach(s => { map[s.id] = { name: s.name, area: a.name }; }));
    return map;
  }, [DJ_CONTENT]);

  const rows = useMemo(() => {
    const out = [];
    Object.entries(marks).forEach(([key, recs]) => {
      const [itemId, track] = key.split("|");
      const item = DJ_CONTENT.ITEMS.find(i => i.id === itemId);
      if (!item) return;
      recs.forEach(r => out.push({ ...r, item, track, note: notes[key] || "" }));
    });
    out.sort((a, b) => (b.observed_on || "").localeCompare(a.observed_on || ""));
    return out;
  }, [marks, notes, DJ_CONTENT]);

  const exportExcel = () => {
    const data = rows.map(r => ({
      Date: r.observed_on || "",
      Age: ageAt(child.date_of_birth, r.observed_on),
      Step: r.item.step,
      Area: subLookup[r.item.sub]?.area || "",
      "Sub-domain": subLookup[r.item.sub]?.name || r.item.sub,
      Item: r.item.text,
      Track: r.track,
      Level: r.level.replace("_", " "),
      Status: r.is_current ? "current" : "superseded",
      Note: r.note
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "History");
    XLSX.writeFile(wb, `developmental-journal-${todayISO()}.xlsx`);
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h3 className="font-display text-lg text-[#5B4A2E]">Full history</h3>
        <button onClick={exportExcel} className="text-xs text-[#8B6F47] underline underline-offset-2">
          Export to Excel
        </button>
      </div>
      {rows.length === 0 ? (
        <p className="text-sm text-[#8A7E64]">Nothing recorded yet.</p>
      ) : (
        <ul className="text-sm space-y-3">
          {rows.map((r, i) => {
            const c = levelColor(r.level);
            const age = ageAt(child.date_of_birth, r.observed_on);
            return (
              <li key={i} className="border-b border-[#EAE2CD] pb-3">
                <div className="flex justify-between gap-3">
                  <span className="text-[#3A3226]">{r.item.text}</span>
                  <span className="text-xs text-[#8A7E64] whitespace-nowrap pt-0.5">
                    {r.observed_on}{age && ` (${age})`}
                  </span>
                </div>
                <div className="text-xs mt-1 flex items-center gap-2 flex-wrap">
                  <span className="px-1.5 py-0.5 rounded-full" style={{ background: c.bg, color: c.text }}>
                    {r.level.replace("_", " ")}
                  </span>
                  {r.track !== "both" && <span className="text-[#8A7E64]">{r.track}</span>}
                  {!r.is_current && <span className="text-[#8A7E64]">superseded</span>}
                </div>
                {r.note && <p className="text-xs italic text-[#8A7E64] mt-1.5">"{r.note}"</p>}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

/* ---------- Step picker ---------- */
function StepPicker({ step, setStep, STEPS_AVAILABLE }) {
  return (
    <div className="flex gap-1 overflow-x-auto pb-1 -mx-4 px-4">
      {STEPS_AVAILABLE.map(s => (
        <button
          key={s}
          onClick={() => setStep(s)}
          className="flex-shrink-0 px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors"
          style={{
            background: s === step ? "#8B6F47" : "#fff",
            color: s === step ? "#FAF6EE" : "#5B4A2E",
            border: `1px solid ${s === step ? "#8B6F47" : "#E3DCC9"}`
          }}
        >
          Step {s}
        </button>
      ))}
    </div>
  );
}

/* ---------- Main journal screen (rendered once signed in) ---------- */
function Journal({ onSignOut }) {
  const DJ_CONTENT = window.DJ_CONTENT;
  if (!DJ_CONTENT) {
    throw new Error("DJ_CONTENT is not loaded yet.");
  }

  const { child, loading: childLoading, err: childErr } = useChild();
  const [step, setStep] = useState(1);
  const [view, setView] = useState("review");
  const [refreshToken, setRefreshToken] = useState(0);
  const [queueCount, setQueueCount] = useState(queueGet().length);
  const [syncing, setSyncing] = useState(false);

  const bump = useCallback(() => {
    setQueueCount(queueGet().length);
    setRefreshToken(t => t + 1);
  }, []);

  useEffect(() => {
    const onOnline = () => drainQueue(n => { setQueueCount(n); bump(); });
    window.addEventListener("online", onOnline);
    onOnline(); // also runs once on mount - now that we're signed in, this catches
                // anything left over from before authentication existed
    return () => window.removeEventListener("online", onOnline);
  }, [bump]);

  const { marks, notes, concerns, loading: marksLoading } = useMarks(child?.id, refreshToken);
  const sessions = useReviewSessions(child?.id, refreshToken);

  if (childLoading) {
    return <div className="min-h-screen flex items-center justify-center text-[#8A7E64]">Loading…</div>;
  }
  if (childErr) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6 text-center">
        <div>
          <p className="font-display text-lg text-[#5B4A2E] mb-2">Couldn't connect</p>
          <p className="text-sm text-[#8A7E64]">{childErr}</p>
        </div>
      </div>
    );
  }
  if (!child) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6 text-center">
        <div>
          <p className="font-display text-lg text-[#5B4A2E] mb-2">No child record yet</p>
          <p className="text-sm text-[#8A7E64]">Run the seed SQL in Supabase, then reload.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-16">
      <header className="sticky top-0 bg-[#FAF6EE] z-10 border-b border-[#EAE2CD] px-4 pt-5 pb-3">
        <div className="flex items-baseline justify-between mb-3">
          <h1 className="font-display text-2xl text-[#3A3226]">Developmental Journal</h1>
          <div className="flex items-center gap-3">
            {queueCount > 0 && (
              <button
                onClick={async () => { setSyncing(true); await drainQueue(n => setQueueCount(n)); setSyncing(false); bump(); }}
                className="text-[11px] text-[#B7862F] underline underline-offset-2"
              >
                {syncing ? "Syncing…" : `${queueCount} pending — tap to sync`}
              </button>
            )}
            <button onClick={onSignOut} className="text-[11px] text-[#8A7E64] underline underline-offset-2">
              Sign out
            </button>
          </div>
        </div>
        <div className="flex gap-4 text-sm mb-3">
          <button
            onClick={() => setView("review")}
            className={view === "review" ? "text-[#3A3226] font-semibold" : "text-[#8A7E64]"}
          >
            Review
          </button>
          <button
            onClick={() => setView("profile")}
            className={view === "profile" ? "text-[#3A3226] font-semibold" : "text-[#8A7E64]"}
          >
            Profile
          </button>
          <button
            onClick={() => setView("progress")}
            className={view === "progress" ? "text-[#3A3226] font-semibold" : "text-[#8A7E64]"}
          >
            Progress
          </button>
          <button
            onClick={() => setView("history")}
            className={view === "history" ? "text-[#3A3226] font-semibold" : "text-[#8A7E64]"}
          >
            History
          </button>
        </div>
        {view === "review" && <StepPicker step={step} setStep={setStep} STEPS_AVAILABLE={DJ_CONTENT.STEPS_AVAILABLE} />}
      </header>

      <main className="px-4 pt-5 max-w-2xl mx-auto">
        {view === "review" && <ReviewSessionBar childId={child.id} sessions={sessions} bump={bump} />}
        {marksLoading ? (
          <p className="text-sm text-[#8A7E64]">Loading progress…</p>
        ) : view === "review" ? (
          <StepView step={step} childId={child.id} marks={marks} notes={notes} concerns={concerns} bump={bump} DJ_CONTENT={DJ_CONTENT} />
        ) : view === "profile" ? (
          <ProfileGrid marks={marks} DJ_CONTENT={DJ_CONTENT} />
        ) : view === "progress" ? (
          <ReviewDiff marks={marks} sessions={sessions} DJ_CONTENT={DJ_CONTENT} />
        ) : (
          <HistoryView marks={marks} notes={notes} DJ_CONTENT={DJ_CONTENT} child={child} />
        )}
      </main>
    </div>
  );
}

/* ---------- App: gates everything behind a Supabase session ---------- */
function App() {
  const [session, setSession] = useState(undefined); // undefined = still checking, null = signed out

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  const signOut = async () => {
    await sb.auth.signOut();
    setSession(null);
  };

  if (session === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-[#8A7E64]">Loading…</div>;
  }
  if (!session) {
    return <SignIn onSignedIn={setSession} />;
  }
  return <Journal onSignOut={signOut} />;
}

      document.body.appendChild(script);
