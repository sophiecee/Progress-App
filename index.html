<style>
  :root {
    --ink: #0b1220;
    --ink-2: #475569;
    --line: #d5dee8;
    --bg: #eef2f6;
    --card: #ffffff;
    --ot: #7c3aed;
    --physio: #0d9488;
    --diet: #be185d;
    --dys: #c2410c;
    --comm: #1d4ed8;
    --keep: #047857;
    --wobble: #b45309;
    --lost: #be123c;
    --skip: #64748b;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  input, select, textarea, button { font: inherit; color: inherit; }
  .tnum { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }

  /* Signature element: the streak pips. The core mechanic, made visible. */
  .pips { display: inline-flex; gap: 5px; align-items: center; }
  .pip {
    width: 11px; height: 11px; border-radius: 999px;
    border: 2px solid var(--line); background: transparent;
    transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .pip.on { background: var(--keep); border-color: var(--keep); transform: scale(1.12); }
  .pip.reset { border-color: var(--lost); }

  .tapsafe { min-height: 56px; }
  .verdict {
    min-height: 62px; border-radius: 14px; border: 2px solid transparent;
    font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center;
    justify-content: center; gap: 8px; background: #f6f8fb; color: var(--ink);
    border-color: var(--line);
  }
  .verdict:active { transform: scale(0.97); }
  .v-keep.sel { background: var(--keep); border-color: var(--keep); color: #fff; }
  .v-wobble.sel { background: var(--wobble); border-color: var(--wobble); color: #fff; }
  .v-lost.sel { background: var(--lost); border-color: var(--lost); color: #fff; }
  .v-skip.sel { background: var(--skip); border-color: var(--skip); color: #fff; }

  .disc-ot { color: var(--ot); }
  .disc-physio { color: var(--physio); }
  .disc-diet { color: var(--diet); }
  .disc-dys { color: var(--dys); }
  .disc-comm { color: var(--comm); }
  .bar-ot { background: var(--ot); }
  .bar-physio { background: var(--physio); }
  .bar-diet { background: var(--diet); }
  .bar-dys { background: var(--dys); }
  .bar-comm { background: var(--comm); }

  .rail { position: relative; padding-left: 18px; }
  .rail:before {
    content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px;
    width: 2px; background: var(--line);
  }
  .railnode:before {
    content: ""; position: absolute; left: -18px; top: 8px;
    width: 10px; height: 10px; border-radius: 999px; background: #fff;
    border: 2px solid var(--ink-2);

  #printroot { display: none; }

  @media print {

<script>
  // On-page error overlay. No console needed.
  window.__renderErrors = function () {
    var host = document.getElementById("errors");
    if (!host) return;
    if (!window.__errors.length) { host.innerHTML = ""; return; }
    var rows = window.__errors.slice(-6).map(function (e, i) {
      return '<div style="border-top:1px solid #7f1d1d;padding:10px 0">' +
        '<div style="font-weight:700">' + e.kind + '</div>' +
        '<div style="margin:4px 0">' + escapeHtml(e.message) + '</div>' +
        (e.detail ? '<pre style="white-space:pre-wrap;font-size:11px;margin:6px 0 0;opacity:.85">' + escapeHtml(e.detail.slice(0, 900)) + '</pre>' : '') +
        '</div>';
    }).join("");
    host.innerHTML =
      '<div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;max-height:62vh;overflow:auto;' +
      'background:#450a0a;color:#fee2e2;font-size:13px;padding:14px 16px 22px;' +
      'box-shadow:0 -8px 24px rgba(0,0,0,.3)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">' +
      '<strong style="font-size:15px">' + window.__errors.length + ' error(s)</strong>' +
      '<span><button onclick="window.__errors=[];window.__renderErrors()" ' +
      'style="background:#fecaca;color:#450a0a;border:0;border-radius:10px;padding:10px 14px;font-weight:700">Clear</button></span>' +
      '</div>' + rows + '</div>';
  };
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
</script>

function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw == null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function lsSet(key, value) {

    localStorage.setItem(key, JSON.stringify(value));

  const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) +
    ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}
function cx() {
  return Array.from(arguments).filter(Boolean).join(" ");
}
function errText(e) {
  if (!e) return "Unknown error";
  if (typeof e === "string") return e;
  return e.message || e.error_description || e.hint || JSON.stringify(e);
}

/* ------------------------------------------------------------- supabase */

function readConn() {
  const saved = lsGet(LS.conn, null);
  const url = (window.SUPABASE_URL || (saved && saved.url) || "").trim();
  const key = (window.SUPABASE_KEY || (saved && saved.key) || "").trim();
  return { url, key };
}

let client = null;
function getClient() {
  if (client) return client;
  const { url, key } = readConn();
  if (!url || !key) return null;
  if (!window.supabase || !window.supabase.createClient) {
    __pushError("Supabase library did not load", "window.supabase is missing", "The CDN script was blocked or you are offline on first load.");
    return null;
  }
  client = window.supabase.createClient(url, key, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "obslog.auth" },
  });
  return client;
}

/* ---------------------------------------------------- offline write queue */

function useQueue(onDrained) {
  const [queue, setQueue] = useState(() => lsGet(LS.queue, []));
  const [syncing, setSyncing] = useState(false);
  const busy = useRef(false);

  const persist = useCallback((next) => {
    setQueue(next);
    lsSet(LS.queue, next);
  }, []);

  const enqueue = useCallback(
    (items) => {
      const list = Array.isArray(items) ? items : [items];
      const next = lsGet(LS.queue, []).concat(list.map((i) => Object.assign({ qid: uid(), tries: 0 }, i)));
      persist(next);
      return next;
    },
    [persist]
  );

  const drain = useCallback(async () => {
    if (busy.current) return;
    const sb = getClient();
    if (!sb) return;
    let pending = lsGet(LS.queue, []);
    if (!pending.length) return;
    busy.current = true;
    setSyncing(true);
    let progressed = false;
    try {
      while (pending.length) {
        const job = pending[0];
        try {
          if (job.kind === "insert") {
            const { error } = await sb.from(job.table).insert(job.row);
            if (error) throw error;
          } else if (job.kind === "update") {
            const { error } = await sb.from(job.table).update(job.patch).eq("id", job.id);
            if (error) throw error;
          } else if (job.kind === "upsert") {
            const { error } = await sb.from(job.table).upsert(job.row);
            if (error) throw error;
          }
          pending = pending.slice(1);
          lsSet(LS.queue, pending);
          progressed = true;
        } catch (e) {
          const msg = errText(e);
          const permanent = /violates|duplicate|row-level security|permission denied|invalid input/i.test(msg);
          if (permanent) {
            __pushError("A saved change was rejected by the database", msg,
              "It stays in the queue so nothing is lost. Table: " + job.table + ". Fix the cause, then tap Retry sync.");
          }
          break; // stop on first failure, keep order
        }
      }
    } finally {
      persist(lsGet(LS.queue, []));
      busy.current = false;
      setSyncing(false);
      if (progressed && onDrained) onDrained();
    }
  }, [persist, onDrained]);

  useEffect(() => {
    drain();
    const t = setInterval(drain, 20000);
    const on = () => drain();
    window.addEventListener("online", on);
    return () => {
      clearInterval(t);
      window.removeEventListener("online", on);
    };
  }, [drain]);

  return { queue, enqueue, drain, syncing };
}

/* ---------------------------------------------------------- domain logic */

/* A "track" is one discipline's view of one skill: its own streak, status and
   retirement. A skill in two disciplines has two tracks, judged separately. */

function applyVerdict(track, verdict, threshold) {
  const t = Math.max(1, Number(threshold) || 3);
  let streak = Number(track.maintained_streak) || 0;
  let status = track.current_status;
  let retired = !!track.is_retired;

  if (verdict === "maintained") {
    streak = streak + 1;
    status = "maintained";
    if (streak >= t) {
      retired = true;
      status = "achieved";
    }
  } else if (verdict === "lost") {
    streak = 0;
    status = "lost";
    retired = false;
  } else if (verdict === "inconsistent") {
    streak = 0;
    status = "inconsistent";
    retired = false;
  }
  // "skipped" records itself in history and changes nothing else.

  return {
    patch: {
      maintained_streak: streak,
      current_status: status,
      is_retired: retired,
      retired_at: retired && !track.is_retired ? new Date().toISOString() : track.retired_at || null,
      updated_at: new Date().toISOString(),
    },
    streakAfter: streak,
    retiredNow: retired && !track.is_retired,
  };
}

function tracksFor(tracks, skillId) {
  return tracks.filter((t) => t.skill_id === skillId);
}
function disciplinesOf(tracks, skillId) {
  return tracksFor(tracks, skillId).map((t) => t.discipline);
}

/* -------------------------------------------------------------- data hook */

function useData(session) {
  const cached = lsGet(LS.cache, {});
  const [skills, setSkills] = useState(cached.skills || []);
  const [tracks, setTracks] = useState(cached.tracks || []);
  const [reviews, setReviews] = useState(cached.reviews || []);
  const [media, setMedia] = useState(cached.media || []);
  const [profile, setProfile] = useState(null);
  const [settings, setSettings] = useState({ id: 1, retirement_threshold: lsGet(LS.threshLocal, 3) });
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);

  const cache = useCallback((s, t, r, m) => {
    lsSet(LS.cache, { skills: s, tracks: t, reviews: r, media: m, at: new Date().toISOString() });
  }, []);

  const load = useCallback(async () => {
    const sb = getClient();
    if (!sb || !session) return;
    setLoadError(null);
    try {
      const [p, sk, tr, rv, md, st] = await Promise.all([
        sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle(),
        sb.from("skills").select("*").order("name"),
        sb.from("skill_tracks").select("*"),
        sb.from("reviews").select("*").order("created_at", { ascending: true }),
        sb.from("media").select("*").order("created_at", { ascending: true }),
        sb.from("app_settings").select("*").eq("id", 1).maybeSingle(),
      ]);
      const firstErr = [p, sk, tr, rv, md, st].map((r) => r.error).filter(Boolean)[0];
      if (firstErr) throw firstErr;
      if (p.data) setProfile(p.data);
      setSkills(sk.data || []);
      setTracks(tr.data || []);
      setReviews(rv.data || []);
      setMedia(md.data || []);
      if (st.data) {
        setSettings(st.data);
        lsSet(LS.threshLocal, st.data.retirement_threshold);
      }
      cache(sk.data || [], tr.data || [], rv.data || [], md.data || []);
      if (!p.data) {
        setLoadError(
          "Signed in, but this account has no profile row, so the app cannot tell whether you are a parent or a professional. " +
          "Add a row to the profiles table for " + session.user.email + " and reload."
        );
      }
    } catch (e) {
      setLoadError(errText(e));
      __pushError("Could not load data", errText(e), "Showing the last copy saved on this device, if there is one.");
    } finally {
      setLoading(false);
    }
  }, [session, cache]);

  useEffect(() => {
    if (session) load();
    else setLoading(false);
  }, [session, load]);

  useEffect(() => {
    const sb = getClient();
    if (!sb || !session) return;
    const ch = sb.channel("obslog");
    ["skills", "skill_tracks", "reviews", "media"].forEach((table) => {
      ch.on("postgres_changes", { event: "*", schema: "public", table: table }, () => load());
    });
    ch.subscribe();
    return () => { try { sb.removeChannel(ch); } catch (e) {} };
  }, [session, load]);

  useEffect(() => { cache(skills, tracks, reviews, media); }, [skills, tracks, reviews, media, cache]);

  return {
    skills, setSkills, tracks, setTracks, reviews, setReviews, media, setMedia,
    profile, settings, setSettings, loading, loadError, reload: load,
  };
}

/* Number input that lets you clear it without snapping back. */
function NumberInput({ value, onCommit, min = 1, max = 10 }) {
  const [text, setText] = useState(String(value));
  const focused = useRef(false);
  useEffect(() => {
    if (!focused.current) setText(String(value));
  }, [value]);
  return (
    <input
      type="number"
      inputMode="numeric"
      className={inputCls}
      value={text}
      min={min}
      max={max}
      onFocus={() => (focused.current = true)}
      onChange={(e) => setText(e.target.value)}
      onBlur={() => {
        focused.current = false;
        const n = parseInt(text, 10);
        if (isNaN(n)) {
          setText(String(value));
          return;
        }
        const clamped = Math.min(max, Math.max(min, n));
        setText(String(clamped));
        if (clamped !== value) onCommit(clamped);
      }}
    />
  );
}

            setAdding(false);

        >
          Add
        </button>
        <button className="rounded-xl border-2 border-slate-200 px-3 tapsafe" onClick={() => { setAdding(false); setDraft(""); }}>
          <Icon name="x" />
        </button>
      </div>
    );
  }
  return (
    <select
      className={inputCls}
      value={value || ""}
      onChange={(e) => {

        <p className="mt-2 text-[15px] text-slate-600">Use the address your account was set up with.</p>
      </div>
      <Field label="Email">
        <input className={inputCls} type="email" inputMode="email" autoCapitalize="off" autoComplete="username"
          value={email} onChange={(e) => setEmail(e.target.value)} />
      </Field>
      <Field label="Password">
        <input className={inputCls} type="password" autoComplete="current-password"
          value={password} onChange={(e) => setPassword(e.target.value)} />
      </Field>
      {msg ? <div className="mb-4"><Banner tone="bad">{msg}</Banner></div> : null}
      <button
        className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white disabled:opacity-40"
        disabled={busy || !email.trim() || !password}
        onClick={go}
      >
        {busy ? "Signing in…" : "Sign in"}
      </button>
      <button
        className="mt-5 w-full rounded-2xl border-2 border-slate-300 py-3.5 text-[16px] font-bold text-slate-700"
        onClick={onDemo}>
        Try it with sample data
      </button>
      <p className="mt-2 text-center text-[13px] leading-relaxed text-slate-500">
        A made-up child, held only in this browser. No account, no real records.
      </p>

      <button
        className="mt-4 w-full py-3 text-[15px] font-semibold text-slate-600 underline"
        onClick={async () => {
          if (!email.trim()) { setMsg("Type your email address first, then tap this again."); return; }
          try {
            const sb = getClient();
            const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href });
            if (error) throw error;
            setMsg("Reset link sent. Check your email.");
          } catch (e) { setMsg(errText(e)); }
        }}
      >
        Send me a password reset link
      </button>
    </div>
  );
}

/* -------------------------------------------------------------- the sweep */

/* One card per skill, not per discipline. A verdict applies to every
   discipline that tracks the skill, because that is how a parent actually
   observes: you see the child do the thing once. Each discipline still keeps
   its own streak, retirement and history, so an OT can retire a skill while
   SLT has not, and the exports stay separate. Where the disciplines genuinely
   disagree, the skill's own page lets you give one discipline its own verdict. */

function DiscDots({ discs, size = 9 }) {
  return (
    <span className="inline-flex items-center gap-1" aria-label={discs.map((d) => (DISC_BY_ID[d] || {}).label).join(", ")}>
      {discs.map((d) => {
        const info = DISC_BY_ID[d] || {};
        return <span key={d} className={cx("rounded-full", info.bar)} style={{ width: size, height: size, display: "inline-block" }} />;
      })}
    </span>
  );
}

function SweepView({ skills, tracks, reviews, threshold, canWrite, onVerdict }) {
  const [date, setDate] = useState(todayISO());
  const [noteFor, setNoteFor] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [discFilter, setDiscFilter] = useState("all");

  const skillById = useMemo(() => Object.fromEntries(skills.map((s) => [s.id, s])), [skills]);

  /* Group the active tracks by skill, so each skill appears once. */
  const rows = useMemo(() => {
    const bySkill = {};
    tracks.forEach((t) => {
      const s = skillById[t.skill_id];
      if (!s || s.is_archived || t.is_retired) return;
      if (discFilter !== "all" && t.discipline !== discFilter) return;
      bySkill[t.skill_id] = bySkill[t.skill_id] || { skill: s, tracks: [] };
      bySkill[t.skill_id].tracks.push(t);
    });
    return Object.values(bySkill)
      .map((r) => {
        r.tracks.sort((a, b) => DISCIPLINES.findIndex((d) => d.id === a.discipline) - DISCIPLINES.findIndex((d) => d.id === b.discipline));
        r.discs = r.tracks.map((t) => t.discipline);
        r.minStreak = Math.min.apply(null, r.tracks.map((t) => Number(t.maintained_streak) || 0));
        return r;
      })
      .sort((a, b) => (a.skill.name || "").localeCompare(b.skill.name || ""));
  }, [tracks, skillById, discFilter]);

  /* A skill counts as reviewed today once every one of its active tracks has
     an entry for the date — so a half-finished per-discipline split still
     shows as outstanding rather than quietly counting as done. */
  const doneToday = useMemo(() => {
    const seen = {};
    reviews.forEach((r) => { if (r.reviewed_on === date) seen[r.skill_id + "|" + r.discipline] = r; });
    return seen;
  }, [reviews, date]);

  function rowDone(row) {
    return row.tracks.every((t) => doneToday[row.skill.id + "|" + t.discipline]);
  }
  function rowVerdictLabel(row) {
    const vs = row.tracks.map((t) => (doneToday[row.skill.id + "|" + t.discipline] || {}).verdict).filter(Boolean);
    const uniq = vs.filter((v, i) => vs.indexOf(v) === i);
    if (uniq.length === 1) return (VERDICT_BY_ID[uniq[0]] || {}).label || uniq[0];
    return uniq.map((v) => (VERDICT_BY_ID[v] || {}).label || v).join(" / ");
  }

  const remaining = rows.filter((r) => !rowDone(r));
  const pct = rows.length ? Math.round(((rows.length - remaining.length) / rows.length) * 100) : 0;
  const noteRow = noteFor ? rows.find((r) => r.skill.id === noteFor) : null;

  return (
    <div className="pb-32">
      <div className="sticky top-0 z-20 border-b border-slate-200 bg-[#eef2f6]/95 px-4 pb-3 pt-3 backdrop-blur">
        <div className="flex items-center gap-2">
          <input type="date" className="tnum rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 text-[16px] font-semibold"
            value={date} max={todayISO()} onChange={(e) => setDate(e.target.value)} />
          <div className="ml-auto text-right">
            <div className="tnum text-[22px] font-bold leading-none">
              {rows.length - remaining.length}<span className="text-slate-400">/{rows.length}</span>
            </div>
            <div className="text-[12px] font-semibold uppercase tracking-wide text-slate-500">reviewed</div>
          </div>
        </div>
        <div className="mt-2.5 h-2 overflow-hidden rounded-full bg-slate-200">
          <div className="h-full rounded-full bg-slate-900 transition-all" style={{ width: pct + "%" }} />
        </div>
        <div className="mt-2.5 -mx-4 flex gap-2 overflow-x-auto px-4 pb-1">
          <Chip onClick={() => setDiscFilter("all")} active={discFilter === "all"}>All</Chip>
          {DISCIPLINES.map((d) => (
            <Chip key={d.id} onClick={() => setDiscFilter(d.id)} active={discFilter === d.id}>
              <span className={discFilter === d.id ? "" : d.cls}>●</span> {d.label}
            </Chip>
          ))}
        </div>
      </div>

      {!canWrite ? (
        <div className="px-4 pt-4">
          <Banner tone="info">Your account has read-only access, so verdicts are hidden. The full history is in Skills and Export.</Banner>
        </div>
      ) : null}

      {rows.length === 0 ? (
        <div className="px-4 pt-10 text-center">
          <p className="text-[17px] font-semibold">Nothing in active review</p>
          <p className="mt-1.5 text-[15px] text-slate-600">
            {discFilter === "all" ? "Add a skill from the Skills tab and it will appear here." : "Nothing outstanding in this discipline."}
          </p>
        </div>
      ) : null}

      <div className="px-4 pt-4">
        {remaining.length === 0 && rows.length > 0 ? (
          <div className="mb-4"><Banner tone="good">Every skill has an entry for {fmtDate(date)}.</Banner></div>
        ) : null}

        {rows.map((row) => {
          const s = row.skill;
          const done = rowDone(row);
          return (
            <div key={s.id} className={cx("mb-3 rounded-2xl border-2 bg-white p-3.5", done ? "border-slate-100 opacity-80" : "border-slate-200")}>
              <div className="flex items-start gap-2">
                <div className="min-w-0 flex-1">
                  <div className="mb-1 flex items-center gap-2">
                    <DiscDots discs={row.discs} />
                    <span className="text-[12px] font-bold uppercase tracking-wide text-slate-500">
                      {row.discs.map((d) => (DISC_BY_ID[d] || {}).label).join(" · ")}
                    </span>
                  </div>
                  <div className="text-[17px] font-semibold leading-snug">{s.name}</div>
                  {s.description ? <div className="mt-1 text-[14px] leading-snug text-slate-600">{s.description}</div> : null}
                </div>
                <div className="pt-1"><Pips streak={row.minStreak} threshold={threshold} /></div>
              </div>

              {done ? (
                <div className="mt-3 flex items-center gap-2 border-t border-slate-100 pt-3">
                  <span className="text-[15px] font-semibold">{rowVerdictLabel(row)}</span>
                  {canWrite ? (
                    <button className="ml-auto shrink-0 text-[14px] font-semibold text-slate-600 underline"
                      onClick={() => { setNoteFor(s.id); setNoteText(""); }}>Add another</button>
                  ) : null}
                </div>
              ) : canWrite ? (
                <>
                  <div className="mt-3 grid grid-cols-2 gap-2">
                    {VERDICTS.map((v) => (
                      <button key={v.id} className={cx("verdict", v.cls)} onClick={() => onVerdict(s, row.tracks, v.id, date, "")}>
                        <Icon name={v.icon} size={19} /> {v.label}
                      </button>
                    ))}
                  </div>
                  <button className="mt-2 w-full rounded-xl py-2.5 text-[14px] font-semibold text-slate-600"
                    onClick={() => { setNoteFor(s.id); setNoteText(""); }}>
                    <span className="inline-flex items-center gap-1.5"><Icon name="pencil" size={16} /> Add a note with the verdict</span>
                  </button>
                  {row.discs.length > 1 ? (
                    <p className="mt-2 text-center text-[12.5px] text-slate-400">
                      Applies to all {row.discs.length} disciplines. Open the skill to record them separately.
                    </p>
                  ) : null}
                </>
              ) : null}
            </div>
          );
        })}
      </div>

      <Sheet open={!!noteFor} onClose={() => setNoteFor(null)} title="Verdict with a note">
        {noteRow ? (
          <>
            <p className="mb-1 text-[16px] font-semibold">{noteRow.skill.name}</p>
            <p className="mb-3 flex items-center gap-2 text-[13px] text-slate-500">
              <DiscDots discs={noteRow.discs} />
              {noteRow.discs.map((d) => (DISC_BY_ID[d] || {}).label).join(" · ")}
            </p>
            <Field label="Note" hint="Keep it anonymised: Kid 1, Mum, Dad, nursery.">
              <textarea className={cx(inputCls, "min-h-[110px]")} value={noteText}
                onChange={(e) => setNoteText(e.target.value)} placeholder="What you actually saw" />
            </Field>
            <div className="grid grid-cols-2 gap-2">
              {VERDICTS.map((v) => (
                <button key={v.id} className={cx("verdict", v.cls)}
                  onClick={() => { onVerdict(noteRow.skill, noteRow.tracks, v.id, date, noteText.trim()); setNoteFor(null); }}>
                  <Icon name={v.icon} size={19} /> {v.label}
                </button>
              ))}
            </div>
            <p className="mt-4 text-[13px] leading-relaxed text-slate-500">
              Recorded against {noteRow.discs.length === 1 ? "this discipline" : "all " + noteRow.discs.length + " disciplines"}.
              Entries are added, never edited or removed — a correction is a new entry on top.
            </p>
          </>
        ) : null}
      </Sheet>
    </div>
  );
}

/* ------------------------------------------------------- skills and detail */

function SkillsView({ skills, tracks, reviews, media, threshold, canWrite, onOpen, onAdd }) {
  const [disc, setDisc] = useState("all");
  const [show, setShow] = useState("active");
  const [q, setQ] = useState("");

  const skillById = useMemo(() => Object.fromEntries(skills.map((s) => [s.id, s])), [skills]);

  /* One row per skill. "In review" means at least one discipline still has it
     open; "Achieved" means every discipline has retired it. A skill that is
     half-retired stays in review, because it is still work in progress. */
  const rows = useMemo(() => {
    const bySkill = {};
    tracks.forEach((t) => {
      const s = skillById[t.skill_id];
      if (!s) return;
      if (show === "archived" ? !s.is_archived : s.is_archived) return;
      if (disc !== "all" && t.discipline !== disc) return;
      bySkill[t.skill_id] = bySkill[t.skill_id] || { skill: s, tracks: [] };
      bySkill[t.skill_id].tracks.push(t);
    });
    return Object.values(bySkill)
      .map((r) => {
        r.tracks.sort((a, b) => DISCIPLINES.findIndex((d) => d.id === a.discipline) - DISCIPLINES.findIndex((d) => d.id === b.discipline));
        r.discs = r.tracks.map((t) => t.discipline);
        r.allRetired = r.tracks.every((t) => t.is_retired);
        r.someRetired = r.tracks.some((t) => t.is_retired);
        r.minStreak = Math.min.apply(null, r.tracks.map((t) => Number(t.maintained_streak) || 0));
        r.entries = reviews.filter((x) => x.skill_id === r.skill.id).length;
        r.shots = media.filter((m) => m.skill_id === r.skill.id).length;
        return r;
      })
      .filter((r) => {
        if (show === "active") return !r.allRetired;
        if (show === "retired") return r.allRetired;
        return true;
      })
      .filter((r) => {
        const term = q.trim().toLowerCase();
        if (!term) return true;
        return (r.skill.name + " " + (r.skill.description || "")).toLowerCase().includes(term);
      })
      .sort((a, b) => (a.skill.name || "").localeCompare(b.skill.name || ""));
  }, [tracks, skillById, disc, show, q, reviews, media]);

  return (
    <div className="pb-32">
      <div className="sticky top-0 z-20 border-b border-slate-200 bg-[#eef2f6]/95 px-4 pb-3 pt-3 backdrop-blur">
        <input className={cx(inputCls, "py-2.5")} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search skills" />
        <div className="mt-2.5 -mx-4 flex gap-2 overflow-x-auto px-4 pb-1">
          <Chip onClick={() => setShow("active")} active={show === "active"}>In review</Chip>
          <Chip onClick={() => setShow("retired")} active={show === "retired"}>Achieved</Chip>
          <Chip onClick={() => setShow("all")} active={show === "all"}>All</Chip>
          <Chip onClick={() => setShow("archived")} active={show === "archived"}>Archived</Chip>
          <span className="w-1" />
          <Chip onClick={() => setDisc("all")} active={disc === "all"}>Every discipline</Chip>
          {DISCIPLINES.map((d) => (
            <Chip key={d.id} onClick={() => setDisc(d.id)} active={disc === d.id}>
              <span className={disc === d.id ? "" : d.cls}>●</span> {d.label}
            </Chip>
          ))}
        </div>
      </div>

      <div className="px-4 pt-4">
        {canWrite && show !== "archived" ? (
          <button onClick={onAdd}
            className="mb-4 flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 py-4 text-[16px] font-bold text-slate-700">
            <Icon name="plus" size={20} /> Add a skill
          </button>
        ) : null}

        {rows.length === 0 ? (
          <p className="pt-6 text-center text-[15px] text-slate-600">
            {q.trim() ? "No skills match that search."
              : show === "archived" ? "Nothing archived."
              : show === "retired" ? "Nothing achieved yet."
              : "Nothing here yet."}
          </p>
        ) : null}

        {rows.map((r) => (
          <button key={r.skill.id} onClick={() => onOpen(r.skill.id)}
            className="mb-2 flex w-full items-center gap-3 rounded-2xl border-2 border-slate-200 bg-white p-3.5 text-left tapsafe">
            <div className="min-w-0 flex-1">
              <div className="mb-1 flex items-center gap-2">
                <DiscDots discs={r.discs} />
                <span className="text-[12px] font-semibold uppercase tracking-wide text-slate-500">
                  {r.discs.map((d) => (DISC_BY_ID[d] || {}).label).join(" · ")}
                </span>
              </div>
              <div className="text-[17px] font-semibold leading-snug">{r.skill.name}</div>
              <div className="mt-1 flex flex-wrap items-center gap-2">
                {r.allRetired ? (
                  <span className="rounded-md border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-semibold text-emerald-800">
                    Achieved
                  </span>
                ) : r.someRetired ? (
                  <span className="rounded-md border border-slate-200 bg-slate-50 px-2 py-0.5 text-[12px] font-semibold text-slate-600">
                    Achieved in some
                  </span>
                ) : null}
                <span className="tnum text-[13px] text-slate-500">{r.entries} entr{r.entries === 1 ? "y" : "ies"}</span>
                {r.shots ? (
                  <span className="inline-flex items-center gap-1 text-[13px] text-slate-500">
                    <Icon name="paperclip" size={13} />{r.shots}
                  </span>
                ) : null}
              </div>
            </div>
            {r.allRetired ? <Icon name="award" size={20} className="text-emerald-600" /> : <Pips streak={r.minStreak} threshold={threshold} />}
            <Icon name="chevron-right" size={18} className="text-slate-300" />
          </button>
        ))}
      </div>
    </div>
  );
}

function SkillDetail({ skill, tracks, reviews, media, threshold, canWrite, onClose, onReopen, onEdit, onAddMedia, onArchive, onVerdict, signedUrls }) {
  const [splitFor, setSplitFor] = useState(null);
  if (!skill) return null;
  const mine = media.filter((m) => m.skill_id === skill.id);
  const myTracks = tracksFor(tracks, skill.id).slice().sort(
    (a, b) => DISCIPLINES.findIndex((d) => d.id === a.discipline) - DISCIPLINES.findIndex((d) => d.id === b.discipline)
  );

  return (
    <Sheet open={!!skill} onClose={onClose} title={skill.name}>
      {skill.is_archived ? (
        <div className="mb-3">
          <Banner tone="info">
            Archived, so it is out of the sweep, the lists and the export. Its history is intact and comes back with it.
          </Banner>
        </div>
      ) : null}
      {skill.description ? <p className="text-[16px] leading-relaxed">{skill.description}</p> : null}
      <p className="mt-2 tnum text-[14px] text-slate-500">First observed {fmtDate(skill.date_first_observed)}</p>

      {canWrite ? (
        <div className="mt-4 flex flex-wrap gap-2">
          <button onClick={() => onEdit(skill)} className="rounded-xl border-2 border-slate-200 px-4 py-3 text-[15px] font-semibold">
            <span className="inline-flex items-center gap-1.5"><Icon name="pencil" size={16} /> Edit</span>
          </button>
          <button onClick={() => onAddMedia(skill, "photo")} className="rounded-xl border-2 border-slate-200 px-4 py-3 text-[15px] font-semibold">
            <span className="inline-flex items-center gap-1.5"><Icon name="camera" size={16} /> Photo</span>
          </button>
          <button onClick={() => onAddMedia(skill, "video_link")} className="rounded-xl border-2 border-slate-200 px-4 py-3 text-[15px] font-semibold">
            <span className="inline-flex items-center gap-1.5"><Icon name="link" size={16} /> Video link</span>
          </button>
          <button onClick={() => onArchive(skill, !skill.is_archived)}
            className={cx("rounded-xl px-4 py-3 text-[15px] font-semibold",
              skill.is_archived ? "bg-slate-900 text-white" : "border-2 border-slate-200")}>
            <span className="inline-flex items-center gap-1.5">
              <Icon name={skill.is_archived ? "reopen" : "archive"} size={16} />
              {skill.is_archived ? "Restore" : "Archive"}
            </span>
          </button>
        </div>
      ) : null}

      {mine.length ? (
        <div className="mt-5">
          <h3 className="mb-2 text-[13px] font-bold uppercase tracking-wide text-slate-500">Attachments</h3>
          {mine.map((m) => (
            <div key={m.id} className="mb-2 rounded-xl border border-slate-200 p-3">
              {m.kind === "photo" ? (
                <>
                  {signedUrls[m.storage_path] ? (
                    <img src={signedUrls[m.storage_path]} alt={m.caption || "Observation photo"} className="mb-2 w-full rounded-lg" />
                  ) : (
                    <div className="mb-2 rounded-lg bg-slate-100 px-3 py-6 text-center text-[14px] text-slate-500">
                      Photo — needs a connection to display
                    </div>
                  )}
                  <div className="text-[14px]">{m.caption}</div>
                </>
              ) : (
                <>
                  <a href={m.url} target="_blank" rel="noreferrer"
                    className="inline-flex items-center gap-1.5 text-[16px] font-semibold text-blue-700 underline">
                    <Icon name="video" size={17} /> Open video
                  </a>
                  <div className="mt-1 text-[14px]">{m.caption}</div>
                  <div className="mt-1 text-[13px] text-slate-500">Opens in OneDrive. Sign in with the address it was shared to.</div>
                </>
              )}
              <div className="tnum mt-1 text-[12px] text-slate-400">{fmtWhen(m.created_at)}</div>
            </div>
          ))}
        </div>
      ) : null}

      {myTracks.map((t) => {
        const d = DISC_BY_ID[t.discipline] || DISCIPLINES[0];
        const hist = reviews.filter((r) => r.skill_id === skill.id && r.discipline === t.discipline).slice().reverse();
        return (
          <div key={t.id} className="mt-6 border-t-2 border-slate-100 pt-4">
            <div className="flex flex-wrap items-center gap-2">
              <span className={cx("text-[13px] font-bold uppercase tracking-wide", d.cls)}>{d.full}</span>
              <StatusTag status={t.current_status} />
              {t.is_retired ? (
                <span className="rounded-md border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[12px] font-semibold text-emerald-800">
                  Achieved
                </span>
              ) : null}
            </div>

            <div className="mt-2.5 flex flex-wrap items-center gap-3 rounded-xl bg-slate-50 px-3.5 py-3">
              <Pips streak={t.maintained_streak} threshold={threshold} />
              <span className="tnum text-[14px] text-slate-600">
                {t.is_retired
                  ? "Achieved \u2014 no longer for active review \u00b7 " + fmtDate(t.retired_at)
                  : (t.maintained_streak || 0) + " of " + threshold + " towards retiring"}
              </span>
              {canWrite && t.is_retired ? (
                <button onClick={() => onReopen(t)} className="ml-auto rounded-lg bg-slate-900 px-3 py-2 text-[14px] font-semibold text-white">
                  <span className="inline-flex items-center gap-1.5"><Icon name="reopen" size={15} /> Reopen</span>
                </button>
              ) : canWrite && onVerdict ? (
                <button onClick={() => setSplitFor(splitFor === t.id ? null : t.id)}
                  className="ml-auto rounded-lg border-2 border-slate-200 px-3 py-2 text-[14px] font-semibold">
                  {splitFor === t.id ? "Cancel" : "Just this one"}
                </button>
              ) : null}
            </div>

            {splitFor === t.id && canWrite && onVerdict ? (
              <div className="mt-3 rounded-xl border-2 border-slate-200 p-3">
                <p className="mb-2 text-[13px] text-slate-600">
                  Records against {d.label} only, leaving the other disciplines untouched.
                </p>
                <div className="grid grid-cols-2 gap-2">
                  {VERDICTS.map((v) => (
                    <button key={v.id} className={cx("verdict", v.cls)}
                      onClick={() => { onVerdict(skill, [t], v.id, todayISO(), ""); setSplitFor(null); }}>
                      <Icon name={v.icon} size={18} /> {v.label}
                    </button>
                  ))}
                </div>
              </div>
            ) : null}

            <h4 className="mb-2 mt-3 text-[12px] font-bold uppercase tracking-wide text-slate-500">
              History <span className="tnum text-slate-400">· {hist.length}</span>
            </h4>
            {hist.length === 0 ? (
              <p className="text-[15px] text-slate-600">No reviews recorded yet.</p>
            ) : (
              <div className="rail">
                {hist.map((r) => {
                  const v = VERDICT_BY_ID[r.verdict];
                  const tone =
                    r.verdict === "maintained" ? "text-emerald-700" :
                    r.verdict === "lost" ? "text-rose-700" :
                    r.verdict === "inconsistent" ? "text-amber-700" : "text-slate-500";
                  return (
                    <div key={r.id} className="railnode relative mb-4">
                      <div className="flex items-baseline gap-2">
                        <span className={cx("text-[16px] font-bold", tone)}>{v ? v.label : r.verdict}</span>
                        {r.retired_by_this ? <span className="text-[12px] font-semibold text-emerald-700">— achieved here</span> : null}
                      </div>
                      <div className="tnum text-[13px] text-slate-500">
                        Observed {fmtDate(r.reviewed_on)} · logged {fmtWhen(r.created_at)}
                      </div>
                      {r.note ? <p className="mt-1 text-[15px] leading-snug">{r.note}</p> : null}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </Sheet>
  );
}

/* ------------------------------------------------------- editors and media */

function checkAnon(text, avoidList) {
  if (!text) return [];
  const hay = text.toLowerCase();
  return avoidList.filter((n) => n && hay.includes(n.toLowerCase()));
}

function SkillEditor({ open, initial, initialDisciplines, onClose, onSave, avoidList, online }) {
  const [achieved, setAchieved] = useState(false);
  const blank = { name: "", description: "", date_first_observed: todayISO() };
  const [form, setForm] = useState(blank);
  const [discs, setDiscs] = useState([]);
  const [photos, setPhotos] = useState([]);
  const [caption, setCaption] = useState("");
  const [warn, setWarn] = useState([]);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    setForm(initial ? Object.assign({}, initial) : blank);
    setDiscs(initialDisciplines || []);
    setPhotos([]);
    setCaption("");
    setWarn([]);
    setBusy(false);
    setAchieved(false);
  }, [initial, initialDisciplines, open]);

  const set = (k) => (v) => setForm((f) => Object.assign({}, f, { [k]: v }));
  const hits = checkAnon(form.name + " " + form.description + " " + caption, avoidList);
  const removing = (initialDisciplines || []).filter((d) => discs.indexOf(d) === -1);

  return (
    <Sheet
      open={open}
      onClose={onClose}
      title={initial ? "Edit skill" : "Add a skill"}
      footer={
        <button
          className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white disabled:opacity-40"
          disabled={busy || !form.name.trim() || discs.length === 0}
          onClick={async () => {
            if (hits.length && !warn.length) { setWarn(hits); return; }
            setBusy(true);
            try {
              await onSave(
                Object.assign({}, form, { name: form.name.trim(), description: form.description.trim() }),
                discs,
                photos,
                caption.trim(),
                achieved
              );
            } finally {
              setBusy(false);
            }
          }}
        >
          {busy ? "Saving…" : hits.length && !warn.length ? "Check the name warning" : initial ? "Save changes" : "Add skill"}
        </button>
      }
    >
      <Field label="Skill" hint="What he can do, in plain words. “Holds a spoon to mouth”, not “fine motor target 3”.">
        <input className={inputCls} value={form.name} onChange={(e) => set("name")(e.target.value)} />
      </Field>

      <div className="mb-4">
        <span className="mb-1.5 block text-[13px] font-bold uppercase tracking-wide text-slate-500">Disciplines</span>
        <div className="grid gap-2">
          {DISCIPLINES.map((d) => {
            const on = discs.indexOf(d.id) !== -1;
            return (
              <button
                key={d.id}
                onClick={() => setDiscs((cur) => (on ? cur.filter((x) => x !== d.id) : cur.concat([d.id])))}
                className={cx(
                  "flex items-center gap-3 rounded-xl border-2 px-3.5 py-3 text-left text-[16px] font-semibold tapsafe",
                  on ? "border-slate-900 bg-slate-900 text-white" : "border-slate-200 bg-white"
                )}
              >
                <span className={cx("text-[18px] leading-none", on ? "" : d.cls)}>{on ? "✓" : "○"}</span>
                {d.full}
              </button>
            );
          })}
        </div>
        <span className="mt-1.5 block text-[13px] text-slate-500">
          Pick as many as apply. Each discipline reviews and retires this skill separately, so you give one verdict per
          discipline in a sweep.
        </span>
      </div>

      <Field label="Date first observed">
        <input type="date" className={cx(inputCls, "tnum")} max={todayISO()}
          value={form.date_first_observed || ""} onChange={(e) => set("date_first_observed")(e.target.value)} />
      </Field>

      <Field label="Description" hint="Optional. Context a therapist would need to judge it the same way you do.">
        <textarea className={cx(inputCls, "min-h-[100px]")} value={form.description || ""} onChange={(e) => set("description")(e.target.value)} />
      </Field>

      {!initial ? (
        <>
          <Field label="Photos (up to 3)" hint={online ? "Clinical detail only: grip, posture, position." : "Needs a connection \u2014 add them later from the skill's page."}>
            <input type="file" accept="image/*" multiple className={inputCls} disabled={!online}
              onChange={(e) => setPhotos(Array.from(e.target.files || []).slice(0, 3))} />
          </Field>
          {photos.length ? (
            <Field label={"Caption for " + (photos.length === 1 ? "this photo" : "these " + photos.length + " photos")}>
              <input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} />
            </Field>
          ) : null}

          <button onClick={() => setAchieved(!achieved)}
            className={cx("mb-4 flex w-full items-center gap-3 rounded-xl border-2 px-3.5 py-3 text-left tapsafe",
              achieved ? "border-emerald-600 bg-emerald-50" : "border-slate-200")}>
            <span className={cx("text-[18px] leading-none", achieved ? "text-emerald-700" : "text-slate-300")}>
              {achieved ? "\u2713" : "\u25cb"}
            </span>
            <span className="flex-1">
              <span className="block text-[16px] font-semibold">Already achieved</span>
              <span className="block text-[13px] text-slate-500">
                For things he mastered before this log existed. Goes straight to Achieved, out of the sweep. Reopen it any time.
              </span>
            </span>
          </button>
        </>
      ) : null}

      {removing.length ? (
        <div className="mb-3">
          <Banner tone="warn">
            Removing {removing.map((d) => (DISC_BY_ID[d] || {}).label).join(", ")} hides this skill from that discipline's
            sweep. Its past entries are kept and reappear if you add the discipline back.
          </Banner>
        </div>
      ) : null}

      {warn.length ? (
        <Banner tone="warn">
          This mentions {warn.join(", ")}. Professionals can read every entry, so swap real names for Kid 1, Mum or Dad if
          you can. Tap save again to keep it as written.
        </Banner>
      ) : null}
    </Sheet>
  );
}

function MediaEditor({ open, mode, skill, onClose, onSavePhoto, onSaveLink, online }) {
  const [caption, setCaption] = useState("");
  const [url, setUrl] = useState("");
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  useEffect(() => { setCaption(""); setUrl(""); setFile(null); setMsg(null); setBusy(false); }, [open, mode]);

  if (!open) return null;
  const isPhoto = mode === "photo";

  return (
    <Sheet open={open} onClose={onClose} title={isPhoto ? "Add a photo" : "Add a video link"}>
      <p className="mb-4 text-[15px] text-slate-600">{skill ? skill.name : ""}</p>

      {isPhoto ? (
        <>
          {!online ? (
            <div className="mb-4">
              <Banner tone="warn">
                Photos need a connection — they are too big to hold on the device queue. Text entries still save offline.
              </Banner>
            </div>
          ) : null}
          <Field label="Photo" hint="Clinical detail only: grip, posture, position. Nothing he would not want a stranger to see.">
            <input type="file" accept="image/*" className={inputCls} onChange={(e) => setFile(e.target.files && e.target.files[0])} />
          </Field>
        </>
      ) : (
        <Field label="OneDrive link" hint="Share the file to each professional's work email first, then paste the link here.">
          <input className={inputCls} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…" autoCapitalize="off" />
        </Field>
      )}

      <Field label="Caption" hint="What it shows. Keep it anonymised.">
        <input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} />
      </Field>

      {msg ? <div className="mb-3"><Banner tone="bad">{msg}</Banner></div> : null}

      <button
        className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white disabled:opacity-40"
        disabled={busy || (isPhoto ? !file || !online : !url.trim())}
        onClick={async () => {
          setBusy(true);
          setMsg(null);
          try {
            if (isPhoto) await onSavePhoto(skill, file, caption.trim());
            else await onSaveLink(skill, url.trim(), caption.trim());
            onClose();
          } catch (e) {
            setMsg(errText(e));
          } finally {
            setBusy(false);
          }
        }}
      >
        {busy ? "Saving…" : isPhoto ? "Upload photo" : "Save link"}
      </button>
    </Sheet>
  );
}

function ExportView({ skills, reviews, threshold, onPrint, range, setRange, scope, setScope }) {
  const count = useMemo(
    () =>
      reviews
        .filter((r) => r.reviewed_on >= range.from && r.reviewed_on <= range.to)
        .filter((r) => (scope === "all" ? true : r.discipline === scope)).length,
    [reviews, range, scope]
  );

  return (
    <div className="px-4 pb-32 pt-4">
      <h1 className="text-[24px] font-bold tracking-tight">Export for the team</h1>
      <p className="mt-1.5 text-[15px] text-slate-600">
        Builds a printable record, chronological, every skill with its full history. Choose “Save as PDF” in the print
        dialogue to get a file you can attach to an email.
      </p>

      <div className="mt-5 rounded-2xl border-2 border-slate-200 bg-white p-4">
        <Field label="From">
          <input type="date" className={cx(inputCls, "tnum")} value={range.from} onChange={(e) => setRange({ from: e.target.value, to: range.to })} />
        </Field>
        <Field label="To">
          <input type="date" className={cx(inputCls, "tnum")} value={range.to} onChange={(e) => setRange({ from: range.from, to: e.target.value })} />
        </Field>
        <Field label="Include" hint="A single discipline gets only its own verdicts, so each therapist sees just their thread.">
          <select className={inputCls} value={scope} onChange={(e) => setScope(e.target.value)}>
            <option value="all">Every discipline, combined</option>
            {DISCIPLINES.map((d) => <option key={d.id} value={d.id}>{d.full} only</option>)}
          </select>
        </Field>
        <div className="mb-4 flex gap-2">
          <button className="rounded-xl bg-slate-100 px-3 py-2.5 text-[14px] font-semibold"
            onClick={() => setRange({ from: todayISO().slice(0, 4) + "-01-01", to: todayISO() })}>
            This year
          </button>
          <button className="rounded-xl bg-slate-100 px-3 py-2.5 text-[14px] font-semibold"
            onClick={() => {
              const d = new Date();
              d.setMonth(d.getMonth() - 4);
              setRange({ from: d.toISOString().slice(0, 10), to: todayISO() });
            }}>
            Last term
          </button>
        </div>
        <p className="tnum mb-4 text-[15px] text-slate-600">{count} entr{count === 1 ? "y" : "ies"} in this range.</p>
        <button className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white" onClick={onPrint}>
          <span className="inline-flex items-center gap-2"><Icon name="printer" size={19} /> Build and print</span>
        </button>
