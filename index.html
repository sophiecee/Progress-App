<script>
  window.__errors = [];
  function __pushError(kind, message, detail) {
    window.__errors.push({ kind: kind, message: String(message || "Unknown"), detail: String(detail || ""), at: new Date().toISOString() });
    if (window.__renderErrors) window.__renderErrors();
    var boot = document.getElementById("boot");
    if (boot) boot.style.display = "none";
  }
  window.addEventListener("error", function (e) {
    __pushError("Script error", e.message, (e.filename || "") + " line " + (e.lineno || "?") + (e.error && e.error.stack ? "\n" + e.error.stack : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason || {};
    __pushError("Unhandled promise", r.message || r, r.stack || (typeof r === "object" ? JSON.stringify(r) : ""));
  });
</script>

<script>
  // On-page error overlay. No console needed.
  window.__renderErrors = function () {
    var host = document.getElementById("errors");
    if (!host) return;
    if (!window.__errors.length) { host.innerHTML = ""; return; }
    var rows = window.__errors.slice(-6).map(function (e, i) {
      return '<div style="border-top:1px solid #7f1d1d;padding:10px 0">' +
        '<div style="font-weight:700">' + e.kind + '</div>' +
        '<div style="margin:4px 0">' + escapeHtml(e.message) + '</div>' +
        (e.detail ? '<pre style="white-space:pre-wrap;font-size:11px;margin:6px 0 0;opacity:.85">' + escapeHtml(e.detail.slice(0, 900)) + '</pre>' : '') +
        '</div>';
    }).join("");
    host.innerHTML =
      '<div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;max-height:62vh;overflow:auto;' +
      'background:#450a0a;color:#fee2e2;font-size:13px;padding:14px 16px 22px;' +
      'box-shadow:0 -8px 24px rgba(0,0,0,.3)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">' +
      '<strong style="font-size:15px">' + window.__errors.length + ' error(s)</strong>' +
      '<span><button onclick="window.__errors=[];window.__renderErrors()" ' +
      'style="background:#fecaca;color:#450a0a;border:0;border-radius:10px;padding:10px 14px;font-weight:700">Clear</button></span>' +
      '</div>' + rows + '</div>';
  };
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------------------------------------------------------------- config */

const DISCIPLINES = [
  { id: "ot", label: "OT", full: "Occupational therapy", cls: "disc-ot", bar: "bar-ot" },
  { id: "physio", label: "Physio", full: "Physiotherapy", cls: "disc-physio", bar: "bar-physio" },
  { id: "dietetics", label: "Dietetics", full: "Dietetics", cls: "disc-diet", bar: "bar-diet" },
  { id: "slt_dysphagia", label: "SLT \u2013 dysphagia", full: "Speech and language \u2013 dysphagia", cls: "disc-dys", bar: "bar-dys" },
  { id: "slt_communication", label: "SLT \u2013 communication", full: "Speech and language \u2013 communication", cls: "disc-comm", bar: "bar-comm" },
];
const DISC_BY_ID = Object.fromEntries(DISCIPLINES.map((d) => [d.id, d]));

const VERDICTS = [
  { id: "maintained", label: "Still there", cls: "v-keep", icon: "check", help: "Counts towards retiring the skill" },
  { id: "inconsistent", label: "Patchy", cls: "v-wobble", icon: "activity", help: "Resets the streak, stays in review" },
  { id: "lost", label: "Lost", cls: "v-lost", icon: "trending-down", help: "Resets the streak, stays in review" },
  { id: "skipped", label: "Skip", cls: "v-skip", icon: "skip", help: "Recorded, streak untouched" },
];
const VERDICT_BY_ID = Object.fromEntries(VERDICTS.map((v) => [v.id, v]));

const STATUS_LABEL = {
  not_yet_reviewed: "Not yet reviewed",
  achieved: "Achieved",
  maintained: "Still there",
  inconsistent: "Patchy",
  lost: "Lost",
};

const LS = {
  queue: "obslog.queue.v1",
  cache: "obslog.cache.v1",
  conn: "obslog.conn.v1",
  avoid: "obslog.avoidnames.v1", // never leaves this device
  threshLocal: "obslog.threshold.v1",
};

/* --------------------------------------------------------------- helpers */

function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw == null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    __pushError("Could not save to this device", e.message, "Storage may be full or private browsing is on.");
    return false;
  }
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2, 10);
}
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) +
    ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}
function cx() {
  return Array.from(arguments).filter(Boolean).join(" ");
}
function errText(e) {
  if (!e) return "Unknown error";
  if (typeof e === "string") return e;
  return e.message || e.error_description || e.hint || JSON.stringify(e);
}

/* Icons drawn inline: no CDN, so they work on a cold start with no signal. */
const ICONS = {
  check: [["path", { d: "M4 12l5 5L20 6" }]],
  activity: [["path", { d: "M3 12h4l3-7 4 14 3-7h4" }]],
  "trending-down": [["path", { d: "M3 8l6 6 4-4 6 6" }], ["path", { d: "M19 16h-4v-4" }]],
  skip: [["path", { d: "M6 5v9h10" }], ["path", { d: "M13 11l4 3-4 3" }]],
  x: [["path", { d: "M6 6l12 12" }], ["path", { d: "M18 6L6 18" }]],
  pencil: [["path", { d: "M4 20h4L20 8l-4-4L4 16z" }]],
  plus: [["path", { d: "M12 5v14" }], ["path", { d: "M5 12h14" }]],
  "chevron-right": [["path", { d: "M9 6l6 6-6 6" }]],
  paperclip: [["path", { d: "M8 12.5l6-6a3 3 0 014 4l-8 8a5 5 0 01-7-7l6-6" }]],
  award: [["circle", { cx: 12, cy: 9, r: 5 }], ["path", { d: "M9 14l-2 7 5-3 5 3-2-7" }]],
  reopen: [["path", { d: "M4 11a8 8 0 1115 4" }], ["path", { d: "M4 5v6h6" }]],
  camera: [["path", { d: "M4 8h3l2-2h6l2 2h3v11H4z" }], ["circle", { cx: 12, cy: 13, r: 3.5 }]],
  link: [["path", { d: "M9.5 14.5l5-5" }], ["path", { d: "M12 7l2-2a4 4 0 015.5 5.5l-2 2" }], ["path", { d: "M12 17l-2 2a4 4 0 01-5.5-5.5l2-2" }]],
  video: [["path", { d: "M4 7h10v10H4z" }], ["path", { d: "M14 11l6-3v8l-6-3" }]],
  printer: [["path", { d: "M7 8V4h10v4" }], ["path", { d: "M5 8h14v7H5z" }], ["path", { d: "M8 15h8v5H8z" }]],
  settings: [["circle", { cx: 12, cy: 12, r: 3 }], ["path", { d: "M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2" }]],
  skills: [["path", { d: "M12 4l1.9 4.6L18.5 10l-4.6 1.4L12 16l-1.9-4.6L5.5 10l4.6-1.4z" }], ["path", { d: "M18 15l.9 2.1 2.1.9-2.1.9L18 21l-.9-2.1-2.1-.9 2.1-.9z" }]],
  sweep: [["path", { d: "M4 7l2 2 3-3" }], ["path", { d: "M4 16l2 2 3-3" }], ["path", { d: "M13 8h7" }], ["path", { d: "M13 17h7" }]],
};

function Icon({ name, size = 20, className = "", strokeWidth = 2 }) {
  const parts = ICONS[name];
  if (!parts) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" className={className} aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="currentColor" />
      </svg>
    );
  }
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} aria-hidden="true"
    >
      {parts.map((part, i) => React.createElement(part[0], Object.assign({ key: i }, part[1])))}
    </svg>
  );
}

/* ------------------------------------------------------------- supabase */

function readConn() {
  const saved = lsGet(LS.conn, null);
  const url = (window.SUPABASE_URL || (saved && saved.url) || "").trim();
  const key = (window.SUPABASE_KEY || (saved && saved.key) || "").trim();
  return { url, key };
}

let client = null;
function getClient() {
  if (client) return client;
  const { url, key } = readConn();
  if (!url || !key) return null;
  if (!window.supabase || !window.supabase.createClient) {
    __pushError("Supabase library did not load", "window.supabase is missing", "The CDN script was blocked or you are offline on first load.");
    return null;
  }
  client = window.supabase.createClient(url, key, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "obslog.auth" },
  });
  return client;
}

/* ---------------------------------------------------- offline write queue */

function useQueue(onDrained) {
  const [queue, setQueue] = useState(() => lsGet(LS.queue, []));
  const [syncing, setSyncing] = useState(false);
  const busy = useRef(false);

  const persist = useCallback((next) => {
    setQueue(next);
    lsSet(LS.queue, next);
  }, []);

  const enqueue = useCallback(
    (items) => {
      const list = Array.isArray(items) ? items : [items];
      const next = lsGet(LS.queue, []).concat(list.map((i) => Object.assign({ qid: uid(), tries: 0 }, i)));
      persist(next);
      return next;
    },
    [persist]
  );

  const drain = useCallback(async () => {
    if (busy.current) return;
    const sb = getClient();
    if (!sb) return;
    let pending = lsGet(LS.queue, []);
    if (!pending.length) return;
    busy.current = true;
    setSyncing(true);
    let progressed = false;
    try {
      while (pending.length) {
        const job = pending[0];
        try {
          if (job.kind === "insert") {
            const { error } = await sb.from(job.table).insert(job.row);
            if (error) throw error;
          } else if (job.kind === "update") {
            const { error } = await sb.from(job.table).update(job.patch).eq("id", job.id);
            if (error) throw error;
          } else if (job.kind === "upsert") {
            const { error } = await sb.from(job.table).upsert(job.row);
            if (error) throw error;
          }
          pending = pending.slice(1);
          lsSet(LS.queue, pending);
          progressed = true;
        } catch (e) {
          const msg = errText(e);
          const permanent = /violates|duplicate|row-level security|permission denied|invalid input/i.test(msg);
          if (permanent) {
            __pushError("A saved change was rejected by the database", msg,
              "It stays in the queue so nothing is lost. Table: " + job.table + ". Fix the cause, then tap Retry sync.");
          }
          break; // stop on first failure, keep order
        }
      }
    } finally {
      persist(lsGet(LS.queue, []));
      busy.current = false;
      setSyncing(false);
      if (progressed && onDrained) onDrained();
    }
  }, [persist, onDrained]);

  useEffect(() => {
    drain();
    const t = setInterval(drain, 20000);
    const on = () => drain();
    window.addEventListener("online", on);
    return () => {
      clearInterval(t);
      window.removeEventListener("online", on);
    };
  }, [drain]);

  return { queue, enqueue, drain, syncing };
}

/* ---------------------------------------------------------- domain logic */

function applyVerdict(skill, verdict, threshold) {
  const t = Math.max(1, Number(threshold) || 3);
  let streak = Number(skill.maintained_streak) || 0;
  let status = skill.current_status;
  let retired = !!skill.is_retired;

  if (verdict === "maintained") {
    streak = streak + 1;
    status = "maintained";
    if (streak >= t) {
      retired = true;
      status = "achieved";
    }
  } else if (verdict === "lost") {
    streak = 0;
    status = "lost";
    retired = false;
  } else if (verdict === "inconsistent") {
    streak = 0;
    status = "inconsistent";
    retired = false;
  } else if (verdict === "skipped") {
    // history only: streak, status and retirement all untouched
  }

  return {
    patch: {
      maintained_streak: streak,
      current_status: status,
      is_retired: retired,
      retired_at: retired && !skill.is_retired ? new Date().toISOString() : skill.retired_at || null,
      updated_at: new Date().toISOString(),
    },
    streakAfter: streak,
    retiredNow: retired && !skill.is_retired,
  };
}

function progressFor(skills) {
  const active = skills.filter((s) => !s.is_retired);
  return { total: skills.length, active: active.length, retired: skills.length - active.length };
}

/* ------------------------------------------------------------ UI atoms */

function Pips({ streak, threshold, lastReset }) {
  const t = Math.max(1, Number(threshold) || 3);
  const n = Math.min(Number(streak) || 0, t);
  return (
    <span className="pips" aria-label={n + " of " + t + " towards retiring"}>
      {Array.from({ length: t }).map((_, i) => (
        <span key={i} className={cx("pip", i < n && "on", lastReset && n === 0 && i === 0 && "reset")} />
      ))}
    </span>
  );
}

function Chip({ children, className = "", onClick, active }) {
  const Tag = onClick ? "button" : "span";
  return (
    <Tag
      onClick={onClick}
      className={cx(
        "inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-semibold",
        active ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700",
        className
      )}
    >
      {children}
    </Tag>
  );
}

function StatusTag({ status }) {
  const map = {
    achieved: "bg-emerald-50 text-emerald-800 border-emerald-200",
    maintained: "bg-emerald-50 text-emerald-800 border-emerald-200",
    inconsistent: "bg-amber-50 text-amber-900 border-amber-200",
    lost: "bg-rose-50 text-rose-800 border-rose-200",
    not_yet_reviewed: "bg-slate-50 text-slate-600 border-slate-200",
  };
  return (
    <span className={cx("rounded-md border px-2 py-0.5 text-[12px] font-semibold", map[status] || map.not_yet_reviewed)}>
      {STATUS_LABEL[status] || status}
    </span>
  );
}

function Field({ label, hint, children }) {
  return (
    <label className="block mb-4">
      <span className="block text-[13px] font-bold uppercase tracking-wide text-slate-500 mb-1.5">{label}</span>
      {children}
      {hint ? <span className="block text-[13px] text-slate-500 mt-1.5">{hint}</span> : null}
    </label>
  );
}

const inputCls =
  "w-full rounded-xl border-2 border-slate-200 bg-white px-3.5 py-3 text-[17px] focus:border-slate-900 focus:outline-none";

/* Number input that lets you clear it without snapping back. */
function NumberInput({ value, onCommit, min = 1, max = 10 }) {
  const [text, setText] = useState(String(value));
  const focused = useRef(false);
  useEffect(() => {
    if (!focused.current) setText(String(value));
  }, [value]);
  return (
    <input
      type="number"
      inputMode="numeric"
      className={inputCls}
      value={text}
      min={min}
      max={max}
      onFocus={() => (focused.current = true)}
      onChange={(e) => setText(e.target.value)}
      onBlur={() => {
        focused.current = false;
        const n = parseInt(text, 10);
        if (isNaN(n)) {
          setText(String(value));
          return;
        }
        const clamped = Math.min(max, Math.max(min, n));
        setText(String(clamped));
        if (clamped !== value) onCommit(clamped);
      }}
    />
  );
}

/* Real select with an inline "add new" flow — not a datalist. */
function SelectWithAdd({ value, onChange, options, addLabel = "Add new…", placeholder = "Choose…" }) {
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState("");
  if (adding) {
    return (
      <div className="flex gap-2">
        <input autoFocus className={inputCls} value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="New entry" />
        <button
          className="rounded-xl bg-slate-900 px-4 font-semibold text-white tapsafe"
          onClick={() => {
            const v = draft.trim();
            if (v) onChange(v);
            setDraft("");
            setAdding(false);
          }}
        >
          Add
        </button>
        <button className="rounded-xl border-2 border-slate-200 px-3 tapsafe" onClick={() => { setAdding(false); setDraft(""); }}>
          <Icon name="x" />
        </button>
      </div>
    );
  }
  return (
    <select
      className={inputCls}

        <option key={o.value} value={o.value}>{o.label}</option>

      <option value="__add__">{addLabel}</option>
    </select>
  );
}

/* -------------------------------------------------------------- data hook */

function useData(session) {
  const [skills, setSkills] = useState(() => lsGet(LS.cache, {}).skills || []);
  const [reviews, setReviews] = useState(() => lsGet(LS.cache, {}).reviews || []);
  const [media, setMedia] = useState(() => lsGet(LS.cache, {}).media || []);
  const [profile, setProfile] = useState(null);
  const [settings, setSettings] = useState({ id: 1, retirement_threshold: lsGet(LS.threshLocal, 3) });
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);

  const cache = useCallback((s, r, m) => {
    lsSet(LS.cache, { skills: s, reviews: r, media: m, at: new Date().toISOString() });
  }, []);

  const load = useCallback(async () => {
    const sb = getClient();
    if (!sb || !session) return;
    setLoadError(null);
    try {
      const [p, sk, rv, md, st] = await Promise.all([
        sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle(),
        sb.from("skills").select("*").order("name"),
        sb.from("reviews").select("*").order("created_at", { ascending: true }),
        sb.from("media").select("*").order("created_at", { ascending: true }),
        sb.from("app_settings").select("*").eq("id", 1).maybeSingle(),
      ]);
      const firstErr = [p, sk, rv, md, st].map((r) => r.error).filter(Boolean)[0];
      if (firstErr) throw firstErr;
      if (p.data) setProfile(p.data);
      setSkills(sk.data || []);
      setReviews(rv.data || []);
      setMedia(md.data || []);
      if (st.data) {
        setSettings(st.data);
        lsSet(LS.threshLocal, st.data.retirement_threshold);
      }
      cache(sk.data || [], rv.data || [], md.data || []);
      if (!p.data) {
        setLoadError(
          "Signed in, but this account has no profile row, so the app cannot tell whether you are a parent or a professional. " +
          "Add a row to the profiles table for " + session.user.email + " and reload."
        );
      }
    } catch (e) {
      setLoadError(errText(e));
      __pushError("Could not load data", errText(e), "Showing the last copy saved on this device, if there is one.");
    } finally {
      setLoading(false);
    }
  }, [session, cache]);

  useEffect(() => {
    if (session) load();
    else setLoading(false);
  }, [session, load]);

  // Realtime: both parents see each other's entries land.
  useEffect(() => {
    const sb = getClient();
    if (!sb || !session) return;
    const ch = sb
      .channel("obslog")
      .on("postgres_changes", { event: "*", schema: "public", table: "skills" }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "reviews" }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "media" }, () => load())
      .subscribe();
    return () => { try { sb.removeChannel(ch); } catch (e) {} };
  }, [session, load]);

  useEffect(() => { cache(skills, reviews, media); }, [skills, reviews, media, cache]);

  return {
    skills, setSkills, reviews, setReviews, media, setMedia,
    profile, settings, setSettings, loading, loadError, reload: load,
  };
}

function SignIn() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function go() {
    setBusy(true);
    setMsg(null);
    try {
      const sb = getClient();
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw error;
    } catch (e) {
      setMsg(errText(e));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="mx-auto max-w-lg px-5 py-10">
      <div className="mb-8">
        <div className="text-[13px] font-bold uppercase tracking-[0.14em] text-slate-500">Observation log</div>
        <h1 className="mt-1 text-[28px] font-bold leading-tight tracking-tight">Sign in</h1>
        <p className="mt-2 text-[15px] text-slate-600">Use the address your account was set up with.</p>
      </div>
      <Field label="Email">
        <input className={inputCls} type="email" inputMode="email" autoCapitalize="off" autoComplete="username"
          value={email} onChange={(e) => setEmail(e.target.value)} />
      </Field>
      <Field label="Password">
        <input className={inputCls} type="password" autoComplete="current-password"
          value={password} onChange={(e) => setPassword(e.target.value)} />
      </Field>
      {msg ? <div className="mb-4"><Banner tone="bad">{msg}</Banner></div> : null}
      <button
        className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white disabled:opacity-40"
        disabled={busy || !email.trim() || !password}
        onClick={go}
      >
        {busy ? "Signing in…" : "Sign in"}
      </button>
      <button
        className="mt-4 w-full py-3 text-[15px] font-semibold text-slate-600 underline"
        onClick={async () => {
          if (!email.trim()) { setMsg("Type your email address first, then tap this again."); return; }
          try {
            const sb = getClient();
            const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href });
            if (error) throw error;
            setMsg("Reset link sent. Check your email.");
          } catch (e) { setMsg(errText(e)); }
        }}
      >
        Send me a password reset link
      </button>
    </div>
  );
}

/* -------------------------------------------------------------- the sweep */

function SweepView({ skills, reviews, threshold, canWrite, onVerdict }) {
  const [date, setDate] = useState(todayISO());
  const [openNote, setOpenNote] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [discFilter, setDiscFilter] = useState("all");

  const active = useMemo(
    () => skills.filter((s) => !s.is_retired).filter((s) => discFilter === "all" || s.discipline === discFilter),
    [skills, discFilter]
  );
  const doneToday = useMemo(() => {
    const map = {};
    reviews.forEach((r) => {
      if (r.reviewed_on === date) map[r.skill_id] = r;
    });
    return map;
  }, [reviews, date]);

  const remaining = active.filter((s) => !doneToday[s.id]);
  const pct = active.length ? Math.round(((active.length - remaining.length) / active.length) * 100) : 0;

  return (
    <div className="pb-32">
      <div className="sticky top-0 z-20 border-b border-slate-200 bg-[#eef2f6]/95 px-4 pb-3 pt-3 backdrop-blur">
        <div className="flex items-center gap-2">
          <input
            type="date"
            className="tnum rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 text-[16px] font-semibold"
            value={date}
            max={todayISO()}
            onChange={(e) => setDate(e.target.value)}
          />
          <div className="ml-auto text-right">
            <div className="tnum text-[22px] font-bold leading-none">{active.length - remaining.length}<span className="text-slate-400">/{active.length}</span></div>
            <div className="text-[12px] font-semibold uppercase tracking-wide text-slate-500">reviewed</div>
          </div>
        </div>
        <div className="mt-2.5 h-2 overflow-hidden rounded-full bg-slate-200">
          <div className="h-full rounded-full bg-slate-900 transition-all" style={{ width: pct + "%" }} />
        </div>
        <div className="mt-2.5 -mx-4 flex gap-2 overflow-x-auto px-4 pb-1">
          <Chip onClick={() => setDiscFilter("all")} active={discFilter === "all"}>All</Chip>
          {DISCIPLINES.map((d) => (
            <Chip key={d.id} onClick={() => setDiscFilter(d.id)} active={discFilter === d.id}>
              <span className={discFilter === d.id ? "" : d.cls}>●</span> {d.label}
            </Chip>
          ))}
        </div>
      </div>

      {!canWrite ? (
        <div className="px-4 pt-4"><Banner tone="info">Your account has read-only access, so verdicts are hidden. The full history is in Skills and Export.</Banner></div>
      ) : null}

      {active.length === 0 ? (
        <div className="px-4 pt-10 text-center">
          <p className="text-[17px] font-semibold">Nothing in active review</p>
          <p className="mt-1.5 text-[15px] text-slate-600">Add a skill from the Skills tab and it will appear here.</p>
        </div>
      ) : null}

      <div className="px-4 pt-4">
        {remaining.length === 0 && active.length > 0 ? (
          <div className="mb-4"><Banner tone="good">Every skill has an entry for {fmtDate(date)}.</Banner></div>
        ) : null}

        {active.map((s) => {
          const d = DISC_BY_ID[s.discipline] || DISCIPLINES[0];
          const done = doneToday[s.id];
          return (
            <div key={s.id} className={cx("mb-3 rounded-2xl border-2 bg-white p-3.5", done ? "border-slate-100 opacity-80" : "border-slate-200")}>
              <div className="flex items-start gap-2">
                <div className="min-w-0 flex-1">
                  <div className={cx("text-[12px] font-bold uppercase tracking-wide", d.cls)}>{d.label}</div>
                  <div className="text-[17px] font-semibold leading-snug">{s.name}</div>
                  {s.description ? <div className="mt-1 text-[14px] leading-snug text-slate-600">{s.description}</div> : null}
                </div>
                <div className="pt-1"><Pips streak={s.maintained_streak} threshold={threshold} /></div>
              </div>

              {done ? (
                <div className="mt-3 flex items-center gap-2 border-t border-slate-100 pt-3">
                  <span className="text-[15px] font-semibold">{VERDICT_BY_ID[done.verdict] ? VERDICT_BY_ID[done.verdict].label : done.verdict}</span>
                  {done.note ? <span className="truncate text-[14px] text-slate-500">— {done.note}</span> : null}
                  {canWrite ? (
                    <button className="ml-auto shrink-0 text-[14px] font-semibold text-slate-600 underline"
                      onClick={() => { setOpenNote(s.id); setNoteText(""); }}>
                      Add another
                    </button>
                  ) : null}
                </div>
              ) : canWrite ? (
                <>
                  <div className="mt-3 grid grid-cols-2 gap-2">
                    {VERDICTS.map((v) => (
                      <button
                        key={v.id}
                        className={cx("verdict", v.cls)}
                        onClick={() => { onVerdict(s, v.id, date, ""); }}
                      >
                        <Icon name={v.icon} size={19} /> {v.label}
                      </button>
                    ))}
                  </div>
                  <button
                    className="mt-2 w-full rounded-xl py-2.5 text-[14px] font-semibold text-slate-600"
                    onClick={() => { setOpenNote(s.id); setNoteText(""); }}
                  >
                    <span className="inline-flex items-center gap-1.5"><Icon name="pencil" size={16} /> Add a note with the verdict</span>
                  </button>
                </>
              ) : null}
            </div>
          );
        })}
      </div>

      <Sheet
        open={!!openNote}
        onClose={() => setOpenNote(null)}
        title="Verdict with a note"
      >
        {openNote ? (
          <>
            <p className="mb-3 text-[15px] text-slate-600">
              {(skills.find((s) => s.id === openNote) || {}).name}
            </p>
            <Field label="Note" hint="Keep it anonymised: Kid 1, Mum, Dad, nursery.">
              <textarea className={cx(inputCls, "min-h-[110px]")} value={noteText} onChange={(e) => setNoteText(e.target.value)}
                placeholder="What you actually saw" />
            </Field>
            <div className="grid grid-cols-2 gap-2">
              {VERDICTS.map((v) => (
                <button key={v.id} className={cx("verdict", v.cls)}
                  onClick={() => {
                    const s = skills.find((x) => x.id === openNote);
                    onVerdict(s, v.id, date, noteText.trim());
                    setOpenNote(null);
                  }}>
                  <Icon name={v.icon} size={19} /> {v.label}
                </button>
              ))}
            </div>
            <p className="mt-4 text-[13px] leading-relaxed text-slate-500">
              Entries are only ever added, never edited or removed. A correction is a new entry on top.
            </p>
          </>
        ) : null}
      </Sheet>
    </div>
  );
}

function SkillsView({ skills, reviews, media, threshold, canWrite, onOpen, onAdd }) {
  const [disc, setDisc] = useState("all");
  const [show, setShow] = useState("active");
  const [q, setQ] = useState("");

  const list = useMemo(() => {
    return skills
      .filter((s) => (disc === "all" ? true : s.discipline === disc))
      .filter((s) => (show === "active" ? !s.is_retired : show === "retired" ? s.is_retired : true))
      .filter((s) => {
        const t = q.trim().toLowerCase();
        if (!t) return true;
        return (s.name + " " + (s.description || "")).toLowerCase().includes(t);
      });
  }, [skills, disc, show, q]);

  const byDisc = useMemo(() => {
    const groups = {};
    list.forEach((s) => {
      groups[s.discipline] = groups[s.discipline] || [];
      groups[s.discipline].push(s);
    });
    return groups;
  }, [list]);

  return (
    <div className="pb-32">
      <div className="sticky top-0 z-20 border-b border-slate-200 bg-[#eef2f6]/95 px-4 pb-3 pt-3 backdrop-blur">
        <input className={cx(inputCls, "py-2.5")} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search skills" />
        <div className="mt-2.5 -mx-4 flex gap-2 overflow-x-auto px-4 pb-1">
          <Chip onClick={() => setShow("active")} active={show === "active"}>In review</Chip>
          <Chip onClick={() => setShow("retired")} active={show === "retired"}>Achieved</Chip>
          <Chip onClick={() => setShow("all")} active={show === "all"}>All</Chip>
          <span className="w-1" />
          <Chip onClick={() => setDisc("all")} active={disc === "all"}>Every discipline</Chip>
          {DISCIPLINES.map((d) => (
            <Chip key={d.id} onClick={() => setDisc(d.id)} active={disc === d.id}>
              <span className={disc === d.id ? "" : d.cls}>●</span> {d.label}
            </Chip>
          ))}
        </div>
      </div>

      <div className="px-4 pt-4">
        {canWrite ? (
          <button onClick={onAdd} className="mb-4 flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 py-4 text-[16px] font-bold text-slate-700">
            <Icon name="plus" size={20} /> Add a skill
          </button>
        ) : null}

        {list.length === 0 ? (
          <p className="pt-6 text-center text-[15px] text-slate-600">
            {q.trim() ? "No skills match that search." : "Nothing here yet."}
          </p>
        ) : null}

        {DISCIPLINES.filter((d) => byDisc[d.id]).map((d) => (
          <div key={d.id} className="mb-6">
            <div className={cx("mb-2 text-[12px] font-bold uppercase tracking-[0.12em]", d.cls)}>
              {d.full} <span className="tnum text-slate-400">· {byDisc[d.id].length}</span>
            </div>
            {byDisc[d.id].map((s) => {
              const hist = reviews.filter((r) => r.skill_id === s.id);
              const shots = media.filter((m) => m.skill_id === s.id);
              return (
                <button key={s.id} onClick={() => onOpen(s.id)}
                  className="mb-2 flex w-full items-center gap-3 rounded-2xl border-2 border-slate-200 bg-white p-3.5 text-left tapsafe">
                  <div className="min-w-0 flex-1">
                    <div className="text-[17px] font-semibold leading-snug">{s.name}</div>
                    <div className="mt-1 flex flex-wrap items-center gap-2">
                      <StatusTag status={s.current_status} />
                      <span className="tnum text-[13px] text-slate-500">{hist.length} entr{hist.length === 1 ? "y" : "ies"}</span>
                      {shots.length ? (
                        <span className="inline-flex items-center gap-1 text-[13px] text-slate-500">
                          <Icon name="paperclip" size={13} />{shots.length}
                        </span>
                      ) : null}
                    </div>
                  </div>
                  {s.is_retired ? <Icon name="award" size={20} className="text-emerald-600" /> : <Pips streak={s.maintained_streak} threshold={threshold} />}
                  <Icon name="chevron-right" size={18} className="text-slate-300" />

        ))}

    </div>
  );

              <div className="tnum mt-1 text-[12px] text-slate-400">{fmtWhen(m.created_at)}</div>
            </div>
          ))}
        </div>
      ) : null}

      <div className="mt-6">
        <h3 className="mb-3 text-[13px] font-bold uppercase tracking-wide text-slate-500">
          Review history <span className="tnum text-slate-400">· {hist.length}</span>
        </h3>
        {hist.length === 0 ? (
          <p className="text-[15px] text-slate-600">No reviews recorded yet.</p>
        ) : (
          <div className="rail">
            {hist.map((r) => {
              const v = VERDICT_BY_ID[r.verdict];
              const tone =
                r.verdict === "maintained" ? "text-emerald-700" :
                r.verdict === "lost" ? "text-rose-700" :
                r.verdict === "inconsistent" ? "text-amber-700" : "text-slate-500";
              return (
                <div key={r.id} className="railnode relative mb-4">
                  <div className="flex items-baseline gap-2">
                    <span className={cx("text-[16px] font-bold", tone)}>{v ? v.label : r.verdict}</span>
                    {r.retired_by_this ? <span className="text-[12px] font-semibold text-emerald-700">— retired here</span> : null}
                  </div>
                  <div className="tnum text-[13px] text-slate-500">

                  </div>
                  {r.note ? <p className="mt-1 text-[15px] leading-snug">{r.note}</p> : null}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </Sheet>
  );
}

/* ------------------------------------------------------- editors and media */

function checkAnon(text, avoidList) {
  if (!text) return [];
  const hay = text.toLowerCase();
  return avoidList.filter((n) => n && hay.includes(n.toLowerCase()));
}

function SkillEditor({ open, initial, onClose, onSave, avoidList }) {
  const blank = { name: "", discipline: "", description: "", date_first_observed: todayISO() };
  const [form, setForm] = useState(blank);
  const [warn, setWarn] = useState([]);
  useEffect(() => { setForm(initial ? Object.assign({}, initial) : blank); setWarn([]); }, [initial, open]);

  const set = (k) => (v) => setForm((f) => Object.assign({}, f, { [k]: v }));
  const hits = checkAnon(form.name + " " + form.description, avoidList);

  return (
    <Sheet
      open={open}
      onClose={onClose}
      title={initial ? "Edit skill" : "Add a skill"}
      footer={
        <button
          className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white disabled:opacity-40"
          disabled={!form.name.trim() || !form.discipline}
          onClick={() => {
            if (hits.length && !warn.length) { setWarn(hits); return; }
            onSave(Object.assign({}, form, { name: form.name.trim(), description: form.description.trim() }));
          }}
        >
          {hits.length && !warn.length ? "Check the name warning" : initial ? "Save changes" : "Add skill"}
        </button>
      }
    >
      <Field label="Skill" hint="What he can do, in plain words. “Holds a spoon to mouth”, not “fine motor target 3”.">
        <input className={inputCls} value={form.name} onChange={(e) => set("name")(e.target.value)} />
      </Field>
      <Field label="Discipline">
        <select className={inputCls} value={form.discipline} onChange={(e) => set("discipline")(e.target.value)}>
          <option value="">Choose a discipline…</option>
          {DISCIPLINES.map((d) => <option key={d.id} value={d.id}>{d.full}</option>)}
        </select>
      </Field>
      <Field label="Date first observed">
        <input type="date" className={cx(inputCls, "tnum")} max={todayISO()}
          value={form.date_first_observed || ""} onChange={(e) => set("date_first_observed")(e.target.value)} />
      </Field>
      <Field label="Description" hint="Optional. Context a therapist would need to judge it the same way you do.">
        <textarea className={cx(inputCls, "min-h-[100px]")} value={form.description || ""} onChange={(e) => set("description")(e.target.value)} />
      </Field>
      {warn.length ? (
        <Banner tone="warn">
          This mentions {warn.join(", ")}. Professionals can read every entry, so swap real names for Kid 1, Mum or Dad if you can.
          Tap save again to keep it as written.
        </Banner>
      ) : null}
    </Sheet>
  );
}

function MediaEditor({ open, mode, skill, onClose, onSavePhoto, onSaveLink, online }) {
  const [caption, setCaption] = useState("");
  const [url, setUrl] = useState("");
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  useEffect(() => { setCaption(""); setUrl(""); setFile(null); setMsg(null); setBusy(false); }, [open, mode]);

  if (!open) return null;
  const isPhoto = mode === "photo";

  return (
    <Sheet open={open} onClose={onClose} title={isPhoto ? "Add a photo" : "Add a video link"}>
      <p className="mb-4 text-[15px] text-slate-600">{skill ? skill.name : ""}</p>

      {isPhoto ? (
        <>
          {!online ? (
            <div className="mb-4">
              <Banner tone="warn">
                Photos need a connection — they are too big to hold on the device queue. Text entries still save offline.
              </Banner>
            </div>
          ) : null}
          <Field label="Photo" hint="Clinical detail only: grip, posture, position. Nothing he would not want a stranger to see.">
            <input type="file" accept="image/*" className={inputCls} onChange={(e) => setFile(e.target.files && e.target.files[0])} />
          </Field>
        </>
      ) : (
        <Field label="OneDrive link" hint="Share the file to each professional's work email first, then paste the link here.">
          <input className={inputCls} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…" autoCapitalize="off" />
        </Field>
      )}

      <Field label="Caption" hint="What it shows. Keep it anonymised.">
        <input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} />
      </Field>

      {msg ? <div className="mb-3"><Banner tone="bad">{msg}</Banner></div> : null}

      <button
        className="w-full rounded-2xl bg-slate-900 py-4 text-[17px] font-bold text-white disabled:opacity-40"
        disabled={busy || (isPhoto ? !file || !online : !url.trim())}
        onClick={async () => {
          setBusy(true);
          setMsg(null);
          try {
            if (isPhoto) await onSavePhoto(file, caption.trim());
            else await onSaveLink(url.trim(), caption.trim());
            onClose();
          } catch (e) {
            setMsg(errText(e));
          } finally {
            setBusy(false);
          }
        }}
      >

      </button>
    </Sheet>
  );
}

/* ------------------------------------------------------------ error guard */

class Guard extends React.Component {
  constructor(p) { super(p); this.state = { dead: false }; }
  componentDidCatch(err, info) {
    __pushError("The screen crashed", err && err.message, (info && info.componentStack) || "");
    this.setState({ dead: true });
  }
  render() {
    if (this.state.dead) {
      return (
        <div className="px-5 py-10">
          <h1 className="text-[22px] font-bold">This screen stopped working</h1>
          <p className="mt-2 text-[15px] text-slate-600">
            The red panel at the bottom shows exactly what failed. Nothing waiting to sync has been lost.
          </p>
          <button className="mt-4 rounded-2xl bg-slate-900 px-5 py-3.5 font-bold text-white" onClick={() => location.reload()}>
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ------------------------------------------------------------------- shell */

function App() {
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [tab, setTab] = useState("sweep");
  const [openSkill, setOpenSkill] = useState(null);
  const [editing, setEditing] = useState(null);
  const [editorOpen, setEditorOpen] = useState(false);
  const [mediaFor, setMediaFor] = useState(null);
  const [mediaMode, setMediaMode] = useState("photo");
  const [online, setOnline] = useState(navigator.onLine);
  const [signedUrls, setSignedUrls] = useState({});
  const [toast, setToast] = useState(null);
  const [scope, setScope] = useState("all");
  const [range, setRange] = useState({ from: todayISO().slice(0, 4) + "-01-01", to: todayISO() });

  const data = useData(session);
  const { queue, enqueue, drain, syncing } = useQueue(data.reload);
  const canWrite = !!(data.profile && data.profile.role === "parent");
  const threshold = Number(data.settings.retirement_threshold) || 3;
  const avoidList = lsGet(LS.avoid, []) || [];

  useEffect(() => {
    const sb = getClient();
    if (!sb) { setAuthReady(true); return; }
    sb.auth.getSession().then(({ data: d }) => {
      setSession(d.session || null);
      setAuthReady(true);
    });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);

  // Stamp last sign-in so parents can see who is actually using it.
  useEffect(() => {
    if (!session) return;
    const sb = getClient();
    sb.from("profiles").update({ last_seen_at: new Date().toISOString() }).eq("id", session.user.id).then(() => {});
  }, [session]);

  useEffect(() => {
    const up = () => { setOnline(true); drain(); };
    const down = () => setOnline(false);
    window.addEventListener("online", up);
    window.addEventListener("offline", down);
    return () => { window.removeEventListener("online", up); window.removeEventListener("offline", down); };
  }, [drain]);

  // Signed URLs for private photos, refreshed on load.
  useEffect(() => {
    const sb = getClient();
    if (!sb || !session) return;
    const paths = data.media.filter((m) => m.kind === "photo" && m.storage_path).map((m) => m.storage_path);
    if (!paths.length) return;
    (async () => {
      try {
        const { data: d, error } = await sb.storage.from("observations").createSignedUrls(paths, 3600);
        if (error) throw error;
        const next = {};
        (d || []).forEach((row) => { if (row.signedUrl) next[row.path] = row.signedUrl; });
        setSignedUrls(next);
      } catch (e) {
        __pushError("Could not load photos", errText(e), "Check the observations bucket exists and its policies are in place.");
      }
    })();
  }, [data.media, session]);

  function flash(text) {
    setToast(text);
    setTimeout(() => setToast(null), 2600);
  }

  /* ---- writes: local first, queue always ---- */

  function handleVerdict(skill, verdict, date, note) {
    if (!skill || !canWrite) return;
    const hits = checkAnon(note, avoidList);
    if (hits.length && !confirm("This note mentions " + hits.join(", ") + ". Save it anyway?")) return;

    const { patch, streakAfter, retiredNow } = applyVerdict(skill, verdict, threshold);
    const review = {
      id: uid(),
      skill_id: skill.id,
      reviewed_on: date,
      verdict: verdict,
      note: note || null,
      streak_after: streakAfter,
      threshold_used: threshold,
      retired_by_this: retiredNow,
      created_at: new Date().toISOString(),
      created_by: session.user.id,
    };

    data.setReviews((rs) => rs.concat([review]));
    if (verdict !== "skipped") {
      data.setSkills((ss) => ss.map((s) => (s.id === skill.id ? Object.assign({}, s, patch) : s)));
    }
    const jobs = [{ kind: "insert", table: "reviews", row: review }];
    if (verdict !== "skipped") jobs.push({ kind: "update", table: "skills", id: skill.id, patch: patch });
    enqueue(jobs);
    drain();
    if (retiredNow) flash(skill.name + " reached " + threshold + " in a row — out of active review.");
  }

  function saveSkill(form) {
    if (!canWrite) return;
    if (editing) {
      const patch = {
        name: form.name,
        discipline: form.discipline,
        description: form.description || null,
        date_first_observed: form.date_first_observed,
        updated_at: new Date().toISOString(),
      };
      data.setSkills((ss) => ss.map((s) => (s.id === editing.id ? Object.assign({}, s, patch) : s)));
      enqueue({ kind: "update", table: "skills", id: editing.id, patch: patch });
    } else {
      const row = {
        id: uid(),
        name: form.name,
        discipline: form.discipline,
        description: form.description || null,
        date_first_observed: form.date_first_observed,
        current_status: "not_yet_reviewed",
        maintained_streak: 0,
        is_retired: false,
        retired_at: null,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
        created_by: session.user.id,
      };
      data.setSkills((ss) => ss.concat([row]));
      enqueue({ kind: "insert", table: "skills", row: row });
    }
    drain();
    setEditorOpen(false);
    setEditing(null);
  }

  function reopen(skill) {
    if (!canWrite) return;
    const patch = { is_retired: false, current_status: "inconsistent", maintained_streak: 0, retired_at: null, updated_at: new Date().toISOString() };
    data.setSkills((ss) => ss.map((s) => (s.id === skill.id ? Object.assign({}, s, patch) : s)));
    enqueue({ kind: "update", table: "skills", id: skill.id, patch: patch });
    drain();
    flash("Back in active review.");
  }

  async function savePhoto(file, caption) {
    const sb = getClient();
    const skill = mediaFor;
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = skill.id + "/" + uid() + "." + ext;
    const { error } = await sb.storage.from("observations").upload(path, file, { cacheControl: "3600", upsert: false });
    if (error) throw error;
    const row = {
      id: uid(), skill_id: skill.id, kind: "photo", storage_path: path, url: null,
      caption: caption || null, created_at: new Date().toISOString(), created_by: session.user.id,
    };
    const { error: e2 } = await sb.from("media").insert(row);
    if (e2) throw e2;
    data.setMedia((m) => m.concat([row]));
    flash("Photo added.");
  }

  async function saveLink(url, caption) {
    const row = {
      id: uid(), skill_id: mediaFor.id, kind: "video_link", storage_path: null, url: url,
      caption: caption || null, created_at: new Date().toISOString(), created_by: session.user.id,
    };
    data.setMedia((m) => m.concat([row]));
    enqueue({ kind: "insert", table: "media", row: row });
    drain();
    flash("Video link saved.");
  }

  function setThreshold(n) {
    const row = { id: 1, retirement_threshold: n };
    data.setSettings((s) => Object.assign({}, s, { retirement_threshold: n }));
    lsSet(LS.threshLocal, n);
    enqueue({ kind: "upsert", table: "app_settings", row: row });
    drain();
  }

  /* ---- gates ---- */

  const conn = readConn();
  if (!conn.url || !conn.key) return <SetupScreen />;
  if (!authReady) return <div className="px-5 py-10 text-[15px] text-slate-600">Checking your sign-in…</div>;
  if (!session) return <SignIn />;

  const skill = data.skills.find((s) => s.id === openSkill) || null;

  const TABS = [
    { id: "sweep", label: "Sweep", icon: "sweep" },
    { id: "skills", label: "Skills", icon: "skills" },
    { id: "export", label: "Export", icon: "printer" },
    { id: "settings", label: "Settings", icon: "settings" },
  ];

  return (
    <>
      <div id="app">
        {(!online || queue.length > 0) ? (
          <div className={cx("px-4 py-2 text-center text-[14px] font-semibold", online ? "bg-amber-100 text-amber-900" : "bg-slate-800 text-white")}>
            {online
              ? (syncing ? "Syncing " + queue.length + " change" + (queue.length === 1 ? "" : "s") + "…" : queue.length + " change" + (queue.length === 1 ? "" : "s") + " waiting to sync")
              : "Offline — entries are saved on this device"}
          </div>
        ) : null}

        {data.loadError ? <div className="px-4 pt-3"><Banner tone="bad">{data.loadError}</Banner></div> : null}

        {tab === "sweep" ? (
          <SweepView skills={data.skills} reviews={data.reviews} threshold={threshold} canWrite={canWrite} onVerdict={handleVerdict} />
        ) : null}
        {tab === "skills" ? (
          <SkillsView skills={data.skills} reviews={data.reviews} media={data.media} threshold={threshold} canWrite={canWrite}
            onOpen={setOpenSkill} onAdd={() => { setEditing(null); setEditorOpen(true); }} />
        ) : null}
        {tab === "export" ? (
          <ExportView skills={data.skills} reviews={data.reviews} media={data.media} threshold={threshold}
            range={range} setRange={setRange} scope={scope} setScope={setScope}
            onPrint={() => setTimeout(() => window.print(), 60)} />
        ) : null}
        {tab === "settings" ? (
          <SettingsView profile={data.profile} session={session} settings={data.settings} canWrite={canWrite}
            onThreshold={setThreshold} queue={queue} syncing={syncing} onRetry={drain}
            onSignOut={async () => {
              if (queue.length && !confirm(queue.length + " change(s) have not synced yet. Sign out anyway? They stay on this device.")) return;
              const sb = getClient();
              await sb.auth.signOut();
            }} />
        ) : null}

        {toast ? (
          <div className="fixed bottom-24 left-4 right-4 z-40 rounded-2xl bg-slate-900 px-4 py-3.5 text-[15px] font-semibold text-white shadow-lg">
            {toast}
          </div>
        ) : null}

        <nav className="fixed bottom-0 left-0 right-0 z-30 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)]">
          <div className="mx-auto flex max-w-xl">
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={cx("flex flex-1 flex-col items-center gap-1 py-2.5", tab === t.id ? "text-slate-900" : "text-slate-400")}>
                <Icon name={t.icon} size={23} strokeWidth={tab === t.id ? 2.4 : 1.9} />
                <span className="text-[11px] font-bold uppercase tracking-wide">{t.label}</span>
              </button>
            ))}
          </div>
        </nav>

        <SkillDetail skill={skill} reviews={data.reviews} media={data.media} threshold={threshold} canWrite={canWrite}
          signedUrls={signedUrls}
          onClose={() => setOpenSkill(null)}
          onReopen={(s) => { reopen(s); }}
          onEdit={(s) => { setEditing(s); setEditorOpen(true); setOpenSkill(null); }}
          onAddMedia={(s, mode) => { setMediaFor(s); setMediaMode(mode); }} />

        <SkillEditor open={editorOpen} initial={editing} avoidList={avoidList}
          onClose={() => { setEditorOpen(false); setEditing(null); }} onSave={saveSkill} />

        <MediaEditor open={!!mediaFor} mode={mediaMode} skill={mediaFor} online={online}
          onClose={() => setMediaFor(null)} onSavePhoto={savePhoto} onSaveLink={saveLink} />
      </div>

      <PrintDoc skills={data.skills} reviews={data.reviews} media={data.media} threshold={threshold} range={range} scope={scope} />
    </>
  );
}

const rootEl = document.getElementById("root");
const boot = document.getElementById("boot");
if (boot) boot.style.display = "none";
ReactDOM.createRoot(rootEl).render(
  <Guard>
    <App />
  </Guard>
);

</script>
</body>
</html>
