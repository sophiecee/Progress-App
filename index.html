function PhotoSheet({ open, bag, photo, onClose, onSave, onDelete }) {
  const [preview, setPreview] = useState(null);
  const [caption, setCaption] = useState("");
  useEffect(() => { if (open) { setPreview(photo?.data_url || null); setCaption(photo?.caption || ""); } }, [open, photo]);
  if (!open) return null;

  const shrink = (file) => new Promise((res) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.55));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  return (
    <Sheet open title={`Photo — ${bag}`} onClose={onClose}>
      {preview ? (
        <img src={preview} alt={`${bag} packed`} className="mb-4 w-full rounded-xl border-2 border-slate-300" />
      ) : (
        <div className="mb-4 rounded-xl border-2 border-dashed border-slate-300 p-8 text-center text-sm text-slate-500">
          No photo yet. Take one once it's packed — next time you'll know how it all fitted.
        </div>
      )}
      <label className={`${btn} mb-3 w-full cursor-pointer border-2 border-slate-900 bg-white`}>
        <Camera size={16} /> {preview ? "Replace photo" : "Take or choose a photo"}
        <input type="file" accept="image/*" capture="environment" className="hidden"
          onChange={async (e) => { const f = e.target.files?.[0]; if (f) setPreview(await shrink(f)); }} />
      </label>
      <Field label="Caption"><input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="Meds pouch sits on top, left side" /></Field>
      <button disabled={!preview} onClick={() => onSave(preview, caption)} className={`${btn} w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>Save photo</button>
      {photo && <button onClick={onDelete} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}><Trash2 size={16} /> Delete photo</button>}
    </Sheet>
  );
}

function ImportSheet({ open, rooms, bags, activeTrip, onClose, onImport, onImportWithTrip }) {
  const [text, setText] = useState("");
  const [groups, setGroups] = useState(null);
  const [mapping, setMapping] = useState({});
  const [skipped, setSkipped] = useState({});
  const [titleInfo, setTitleInfo] = useState(null);
  const [useTitle, setUseTitle] = useState(true);

  useEffect(() => { if (open) { setText(""); setGroups(null); setMapping({}); setSkipped({}); setTitleInfo(null); setUseTitle(true); } }, [open]);

  const analyse = () => {
    const found = extractTripTitle(text);
    const bodyText = found ? text.replace(found.consumedLine, "") : text;
    setTitleInfo(found);
    const g = parsePastedList(bodyText);
    setGroups(g);
    const m = {};
    g.forEach((grp, i) => {
      m[i] = { room: guessRoom(grp.heading, rooms), bag: guessBag(grp.heading, bags) };
    });
    setMapping(m);
  };

  const totalItems = groups ? groups.reduce((a, g, i) => a + (skipped[i] ? 0 : g.items.length), 0) : 0;
  const unresolvedCount = groups ? groups.filter((g, i) => !skipped[i] && (!mapping[i]?.room || !mapping[i]?.bag)).length : 0;

  const buildRows = () => {
    const rows = [];
    groups.forEach((g, i) => {
      if (skipped[i]) return;
      const map = mapping[i] || {};
      g.items.forEach((it) => {
        rows.push({
          name: it.name,
          quantity: it.quantity,
          notes_or_special_instructions: it.notes,
          room_source: map.room || rooms[0],
          assigned_bag: map.bag || bags[0],
        });
      });
    });
    return rows;
  };

  const doImport = () => {
    const rows = buildRows();
    if (useTitle && titleInfo && onImportWithTrip) {
      onImportWithTrip(
        {
          name: titleInfo.name,
          month: titleInfo.month || "January",
          days: titleInfo.days || 1,
          transport: titleInfo.transport || "Car",
          international: titleInfo.international,
        },
        rows
      );
    } else {
      onImport(rows);
    }
  };

  return (
    <Sheet open={open} title="Paste in an old list" onClose={onClose}>
      {!groups ? (
        <>
          <p className="mb-3 text-sm text-slate-600">
            Paste a whole old list — Google Tasks, notes, anywhere. If the first line reads like a trip title ("Efteling christmas, 4 days, driving"), it's used to fill in the trip itself rather than treated as an item. Headings become groups you map to a room and bag; quantities like "x3" and brackets-as-notes are picked up automatically.
          </p>
          <p className="mb-3 rounded-lg border-2 border-amber-200 bg-amber-50 p-2 text-xs font-semibold text-amber-800">
            Worth stripping out real names before pasting — use S, F, Mum, Dad.
          </p>
          <textarea rows="12" className={`${inputCls} font-mono text-sm`} value={text} onChange={(e) => setText(e.target.value)}
            placeholder={"Efteling christmas, 4 days, driving\n\nKitchen:\nwipes\noat milk x3\ncool bag (freeze packs overnight)\nMeds:\nParacetamol\nLaxido"} />
          <button onClick={analyse} disabled={!text.trim()} className={`${btn} mt-3 w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>
            Read the list
          </button>
        </>
      ) : (
        <>
          <button onClick={() => setGroups(null)} className="mb-3 flex items-center gap-2 text-sm font-bold text-slate-500">
            <ArrowLeft size={15} /> Paste something different
          </button>

          {titleInfo && (
            <div className="mb-4 rounded-xl border-2 border-teal-300 bg-teal-50 p-3">
              <p className="mb-1 text-xs font-bold uppercase tracking-wider text-teal-700">Found a trip title</p>
              <p className="mb-2 text-sm text-slate-700">
                "{titleInfo.consumedLine}" →
                {" "}<strong>{titleInfo.name}</strong>
                {titleInfo.month && `, ${titleInfo.month}`}
                {titleInfo.days && `, ${titleInfo.days} days`}
                {titleInfo.transport && `, ${titleInfo.transport}`}
                {titleInfo.international && `, international`}
              </p>
              <label className="flex items-center gap-2 text-sm font-semibold text-slate-700">
                <input type="checkbox" checked={useTitle} onChange={(e) => setUseTitle(e.target.checked)} className="h-5 w-5" />
                Create this as a new trip using these details
              </label>
              {!useTitle && (
                <p className="mt-1 text-xs text-slate-500">Off means these items import into "{activeTrip?.name || "the current trip"}" instead, and the title line is discarded.</p>
              )}
            </div>
          )}
          {!titleInfo && (
            <p className="mb-4 rounded-xl border-2 border-slate-200 bg-slate-50 p-3 text-sm text-slate-600">
              No trip title detected on the first line — importing straight into "{activeTrip?.name || "the current trip"}".
            </p>
          )}

          <p className="mb-4 text-sm text-slate-600">
            Found <strong>{groups.length} groups</strong>, {totalItems} items to import. Set where each group came from and where it's going.
          </p>
          {groups.map((g, i) => ({ g, i }))
            .sort((a, b) => {
              const aUnmapped = !mapping[a.i]?.room || !mapping[a.i]?.bag;
              const bUnmapped = !mapping[b.i]?.room || !mapping[b.i]?.bag;
              return aUnmapped === bUnmapped ? 0 : aUnmapped ? -1 : 1;
            })
            .map(({ g, i }) => {
            const needsRoom = !mapping[i]?.room;
            const needsBag = !mapping[i]?.bag;
            const needsAttention = !skipped[i] && (needsRoom || needsBag);
            return (
            <div key={i} className={`mb-4 rounded-xl border-2 p-3 ${
              skipped[i] ? "border-slate-200 bg-slate-100 opacity-60"
              : needsAttention ? "border-amber-400 bg-amber-50"
              : "border-slate-300 bg-white"
            }`}>
              <div className="mb-2 flex items-center justify-between gap-2">
                <p className="min-w-0 flex-1 truncate text-sm font-bold">
                  {g.heading} <span className="text-xs font-normal text-slate-500">({g.items.length})</span>
                  {needsAttention && <span className="ml-2 text-xs font-bold text-amber-700">needs a choice</span>}
                </p>
                <button onClick={() => setSkipped({ ...skipped, [i]: !skipped[i] })}
                  className="shrink-0 text-xs font-bold text-slate-500">
                  {skipped[i] ? "Include" : "Skip"}
                </button>
              </div>
              {!skipped[i] && (
                <>
                  {g.heading.toLowerCase().includes("upstairs") && needsAttention && (
                    <p className="mb-2 text-xs text-slate-600">This group had a lot of different kinds of things in it — worth spreading across a few rooms rather than picking just one.</p>
                  )}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Room</span>
                      <select className={`${inputCls} ${needsRoom ? "border-amber-400" : ""}`} value={mapping[i]?.room || ""}
                        onChange={(e) => setMapping({ ...mapping, [i]: { ...mapping[i], room: e.target.value } })}>
                        {needsRoom && <option value="" disabled>Choose a room…</option>}
                        {rooms.map((r) => <option key={r}>{r}</option>)}
                      </select>
                    </div>
                    <div>
                      <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Bag</span>
                      <select className={`${inputCls} ${needsBag ? "border-amber-400" : ""}`} value={mapping[i]?.bag || ""}
                        onChange={(e) => setMapping({ ...mapping, [i]: { ...mapping[i], bag: e.target.value } })}>
                        {needsBag && <option value="" disabled>Choose a bag…</option>}
                        {bags.map((b) => <option key={b}>{b}</option>)}
                      </select>
                    </div>
                  </div>
                  <p className="mt-2 truncate text-xs text-slate-500">
                    {g.items.slice(0, 4).map((it) => it.name + (it.quantity > 1 ? ` ×${it.quantity}` : "")).join(", ")}
                    {g.items.length > 4 && `, +${g.items.length - 4} more`}
                  </p>
                </>
              )}
            </div>
          )})}
          <button onClick={doImport} disabled={!totalItems || unresolvedCount > 0} className={`${btn} w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>
            {unresolvedCount > 0
              ? `Choose a room and bag for ${unresolvedCount} more group${unresolvedCount === 1 ? "" : "s"}`
              : useTitle && titleInfo ? `Create "${titleInfo.name}" with ${totalItems} items` : `Import ${totalItems} items into ${activeTrip?.name || "current trip"}`}
          </button>
        </>
      )}
    </Sheet>
  );
}

function NewTripSheet({ open, onClose, trips, items, tasks, rooms, bags, onCreate }) {
  const [f, setF] = useState({
    name: "", month: "August", days: 7, transport: "Car",
    accommodation: "Self-catering", international: false, nights_en_route: 0,
    needs: "S: PEG fed, wheelchair user, puree and limited finger foods, smoothie only for drinks, osmotic and stimulant laxatives, suppositories, PEG kit including extension tubes. F: sound sensitive, ear defenders, chewy necklace.",
  });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [progress, setProgress] = useState("");
  const [draft, setDraft] = useState(null);
  const [picked, setPicked] = useState({});
  const [partialNote, setPartialNote] = useState("");
  const [carryJobs, setCarryJobs] = useState(true);
  const [carryMissed, setCarryMissed] = useState(true);

  /* Jobs from the most recently created trip — insurance, the cat sitter,
     assistance bookings — nearly all of which recur every time. */
  const lastTripJobs = useMemo(() => {
    const sorted = [...trips].sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
    const last = sorted[0];
    if (!last) return [];
    return (tasks || []).filter((t) => t.trip_id === last.id);
  }, [trips, tasks]);

  /* Things they wished they'd packed last time — the whole point of recording
     them is that they turn up here, on the next trip, rather than being a note
     nobody rereads. */
  const lastTripMissedItems = useMemo(() => {
    const sorted = [...trips].sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
    const last = sorted[0];
    if (!last) return [];
    return (items || []).filter((i) => i.trip_id === last.id && i.was_missed);
  }, [trips, items]);
  const lastTripName = useMemo(() => {
    const sorted = [...trips].sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
    return sorted[0]?.name || "";
  }, [trips]);
  useEffect(() => { if (open) { setDraft(null); setErr(""); setPicked({}); setProgress(""); setPartialNote(""); } }, [open]);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const history = useMemo(() => historyText(trips, items), [trips, items]);

  const generate = async () => {
    setLoading(true); setErr(""); setPartialNote(""); setProgress("Starting…");
    try {
      const { items: rows, failures } = await draftItemsSectioned(
        { ...f, history, rooms, bags, nightsEnRoute: f.nights_en_route },
        setProgress
      );
      setDraft(rows);
      setPicked(Object.fromEntries(rows.map((_, i) => [i, true])));
      if (failures.length) {
        setPartialNote(`Couldn't complete: ${failures.join(", ")}. Everything else came through — you can add the rest from a past trip.`);
      }
    } catch (e) { setErr(e.message); }
    setProgress("");
    setLoading(false);
  };
  const chosen = draft ? draft.filter((_, i) => picked[i]) : [];

  return (
    <Sheet open={open} title="New trip" onClose={onClose}>
      {!draft ? (
        <>
          <Field label="Trip name"><input className={inputCls} value={f.name} onChange={set("name")} placeholder="Half-term by the sea" /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Month">
              <select className={inputCls} value={f.month} onChange={set("month")}>
                {["January","February","March","April","May","June","July","August","September","October","November","December"].map((m) => <option key={m}>{m}</option>)}
              </select>
            </Field>
            <Field label="Days away"><QuantityInput value={f.days} onChange={(n) => setF({ ...f, days: n })} /></Field>
          </div>
          <Field label="Getting there by">
            <select className={inputCls} value={f.transport} onChange={set("transport")}>
              {["Car", "Train", "Plane", "Ferry", "Coach"].map((t) => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="Staying in">
            <select className={inputCls} value={f.accommodation} onChange={set("accommodation")}>
              {["Self-catering", "Hotel", "With relatives", "With friends", "Camping", "Mixed"].map((a) => <option key={a}>{a}</option>)}
            </select>
          </Field>
          <Field label="Nights in temporary accommodation on the way out">
            <QuantityInput value={f.nights_en_route + 1} onChange={(n) => setF({ ...f, nights_en_route: Math.max(0, n - 1) })} />
            <span className="mt-1 block text-xs text-slate-500">
              Currently {f.nights_en_route === 0 ? "none — straight there" : `${f.nights_en_route} night(s)`}. This drives how much has to be reachable in the grab bag.
            </span>
          </Field>
          <button onClick={() => setF({ ...f, international: !f.international })}
            className={`${btn} mb-4 w-full border-2 py-4 ${f.international ? "border-teal-700 bg-teal-100 text-teal-800" : "border-slate-300 bg-white text-slate-600"}`}>
            {f.international ? <><Check size={16} strokeWidth={3} /> International trip</> : "Domestic trip — tap if international"}
          </button>
          {f.international && (
            <p className="mb-4 rounded-lg border-2 border-teal-200 bg-teal-50 p-2 text-xs font-semibold text-teal-800">
              Passports, birth certificates, travel insurance, international breakdown cover and plug adaptors will be suggested.
            </p>
          )}
          <p className="mb-4 rounded-lg border-2 border-sky-200 bg-sky-50 p-2 text-xs font-semibold text-sky-800">
            Swimming things will be suggested — they're the most commonly forgotten thing, whatever the season.
            {["May", "June", "July", "August", "September"].includes(f.month) &&
              " As it's " + f.month + ", insect repellent, sun cream, hats and sunglasses will be too."}
            {["November", "December", "January", "February"].includes(f.month) &&
              " As it's " + f.month + ", thermals, gloves, hats and waterproofs will be too."}
          </p>
          <Field label="What the children need"><textarea rows="5" className={inputCls} value={f.needs} onChange={set("needs")} /></Field>

          {lastTripJobs.length > 0 && (
            <label className="mb-4 flex items-start gap-2 rounded-lg border-2 border-slate-300 bg-white p-3 text-sm font-semibold text-slate-700">
              <input type="checkbox" checked={carryJobs} onChange={(e) => setCarryJobs(e.target.checked)} className="mt-0.5 h-5 w-5 shrink-0" />
              <span>
                Bring over the {lastTripJobs.length} jobs from {lastTripName}
                <span className="mt-1 block text-xs font-normal text-slate-500">
                  Insurance, assistance bookings, the cat — mostly the same every time. They come across unticked, and you can delete any that don't apply.
                </span>
              </span>
            </label>
          )}
          {lastTripMissedItems.length > 0 && (
            <label className="mb-4 flex items-start gap-2 rounded-lg border-2 border-amber-300 bg-amber-50 p-3 text-sm font-semibold text-amber-900">
              <input type="checkbox" checked={carryMissed} onChange={(e) => setCarryMissed(e.target.checked)} className="mt-0.5 h-5 w-5 shrink-0" />
              <span>
                Add the {lastTripMissedItems.length} thing{lastTripMissedItems.length === 1 ? "" : "s"} you wished you'd packed on {lastTripName}
                <span className="mt-1 block text-xs font-normal text-amber-800">
                  {lastTripMissedItems.map((i) => i.name).join(", ")}
                </span>
              </span>
            </label>
          )}
          {err && <p className="mb-3 rounded-xl border-2 border-red-200 bg-red-50 p-3 text-sm font-semibold text-red-700">{err}</p>}
          <button onClick={generate} disabled={loading} className={`${btn} w-full bg-teal-700 py-4 text-white disabled:opacity-60`}>
            {loading ? <><Loader2 size={16} className="animate-spin" /> {progress || "Reading your past trips…"}</> : <><Sparkles size={16} /> Draft the list for me</>}
          </button>
          <button onClick={() => onCreate({ ...f, name: f.name || `${f.month} trip`, notes: f.needs }, [], carryJobs ? lastTripJobs : [], carryMissed ? lastTripMissedItems : [])} className={`${btn} mt-3 w-full border-2 border-slate-300 bg-white py-4`}>
            Start empty instead
          </button>
        </>
      ) : (
        <>
          <p className="mb-2 text-sm text-slate-600">{draft.length} suggestions from {f.month}, {f.days} days by {f.transport.toLowerCase()}, and what you wrote after past trips. Untick anything you don't want.</p>
          {partialNote && (
            <p className="mb-3 rounded-xl border-2 border-amber-200 bg-amber-50 p-3 text-sm font-semibold text-amber-800">{partialNote}</p>
          )}
          <button onClick={() => setDraft(null)} className="mb-3 flex items-center gap-2 text-sm font-bold text-slate-500"><ArrowLeft size={15} /> Change the details</button>
          <ul className="mb-4 space-y-1.5">
            {draft.map((r, i) => (
              <li key={i}>
                <button onClick={() => setPicked({ ...picked, [i]: !picked[i] })}
                  className={`flex w-full items-center gap-2 rounded-lg border-2 px-2 py-2 text-left ${picked[i] ? "border-teal-600 bg-white" : "border-slate-200 bg-slate-100 opacity-60"}`}>
                  <span className={`flex h-5 w-5 shrink-0 items-center justify-center rounded border-2 ${picked[i] ? "border-teal-600 bg-teal-600 text-white" : "border-slate-300"}`}>
                    {picked[i] && <Check size={12} strokeWidth={3} />}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-sm font-semibold">
                      {r.name}{r.quantity > 1 && ` ×${r.quantity}`}
                      {r.is_prescription && <Pill size={11} className="ml-1 inline text-teal-700" />}
                      {r.last_minute && <Snowflake size={11} className="ml-1 inline text-sky-600" />}
                    </span>
                    <span className="block text-xs uppercase tracking-wide text-slate-400">{r.room_source} → {r.assigned_bag}</span>
                  </span>
                </button>
              </li>
            ))}
          </ul>
          <button onClick={() => onCreate({ name: f.name || `${f.month} trip`, month: f.month, days: f.days, transport: f.transport, accommodation: f.accommodation, international: f.international, nights_en_route: f.nights_en_route, notes: f.needs }, chosen, carryJobs ? lastTripJobs : [], carryMissed ? lastTripMissedItems : [])}
            className={`${btn} w-full bg-slate-900 py-4 text-white`}>Create trip with {chosen.length} items</button>
        </>
      )}
    </Sheet>
  );
}

/* The master library: every item ever packed, deduplicated by name, with the
   trips it appeared on and the bags it went into. Editing here rewrites every
   matching row across every trip, which is what makes it possible to empty a
   room like "Medicine Cabinet" and then delete it. */
function LibrarySheet({ open, onClose, items, trips, activeTripId, rooms, bags, packers,
                        archivedLibraryItems, onArchive, onUnarchive, initialSearch,
                        collapsedGroups, setCollapsedGroups,
                        onAddToTrip, onEditEverywhere, onDeleteEverywhere }) {
  const [view, setView] = useState("library"); // library | duplicates
  const [search, setSearch] = useState("");
  const [groupBy, setGroupBy] = useState("room"); // room | bag | name
  const [sel, setSel] = useState({});
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const [applyToPast, setApplyToPast] = useState(false);
  const archivedSet = useMemo(() => new Set(archivedLibraryItems || []), [archivedLibraryItems]);

  useEffect(() => {
    if (open) {
      setSearch(initialSearch || "");
      setSel({}); setEditing(null); setView("library"); setConfirmDelete(null);
      /* Only force groups open when arriving from a "did you mean X" link —
         otherwise leave the person's own collapsed/expanded choices alone. */
      if (initialSearch) setCollapsedGroups({});
    }
  }, [open, initialSearch]);

  const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

  /* Trips newest first, so a library entry can show how an item was packed
     most recently — that's the sensible default for adding it again. */
  const tripOrder = useMemo(() => {
    const m = new Map();
    [...trips]
      .sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")))
      .forEach((t, idx) => m.set(t.id, idx));
    return m;
  }, [trips]);

  /* One row per distinct item name, carrying every occurrence behind it. */
  const library = useMemo(() => {
    const map = new Map();
    items.forEach((i) => {
      const key = norm(i.name);
      if (!key) return;
      if (!map.has(key)) {
        map.set(key, { key, occurrences: [], tripIds: new Set() });
      }
      const entry = map.get(key);
      entry.occurrences.push(i);
      entry.tripIds.add(i.trip_id);
    });
    return [...map.values()].map((entry) => {
      /* Most recent occurrence wins for the displayed defaults. */
      const sorted = [...entry.occurrences].sort(
        (a, b) => (tripOrder.get(a.trip_id) ?? 999) - (tripOrder.get(b.trip_id) ?? 999)
      );
      const latest = sorted[0];
      return {
        ...entry,
        latestId: latest.id,
        name: latest.name,
        room_source: latest.room_source,
        assigned_bag: latest.assigned_bag,
        quantity: latest.quantity,
        notes_or_special_instructions: latest.notes_or_special_instructions,
        is_prescription: entry.occurrences.some((o) => o.is_prescription),
        last_minute: entry.occurrences.some((o) => o.last_minute),
      };
    });
  }, [items, tripOrder]);

  const onThisTrip = useMemo(
    () => new Set(items.filter((i) => i.trip_id === activeTripId).map((i) => norm(i.name))),
    [items, activeTripId]
  );

  /* Items appearing more than once on the CURRENT trip — often deliberate
     (pants in the grab bag and the suitcase) so these are for review only. */
  const duplicatesOnTrip = useMemo(() => {
    const map = new Map();
    items.filter((i) => i.trip_id === activeTripId).forEach((i) => {
      const key = norm(i.name);
      if (!key) return;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(i);
    });
    return [...map.entries()].filter(([, list]) => list.length > 1).map(([key, list]) => ({ key, name: list[0].name, list }));
  }, [items, activeTripId]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    let list = library;
    if (!showArchived) list = list.filter((e) => !archivedSet.has(e.key));
    if (q) list = list.filter((e) => e.name.toLowerCase().includes(q));
    return list;
  }, [library, search, archivedSet, showArchived]);
  const archivedCount = library.filter((e) => archivedSet.has(e.key)).length;

  /* Items already on this trip sink below the ones you could still add, and
     both halves run alphabetically — which also makes near-duplicates sit
     next to each other and easier to spot. */
  const byNotOnTripThenName = (a, b) => {
    const aOn = onThisTrip.has(a.key), bOn = onThisTrip.has(b.key);
    if (aOn !== bOn) return aOn ? 1 : -1;
    return (a.name || "").localeCompare(b.name || "");
  };

  const grouped = useMemo(() => {
    if (groupBy === "name") {
      return [["All items, A–Z", [...filtered].sort(byNotOnTripThenName)]];
    }
    const field = groupBy === "room" ? "room_source" : "assigned_bag";
    const order = groupBy === "room" ? rooms : bags;
    const m = new Map();
    filtered.forEach((e) => {
      const k = e[field] || "Unsorted";
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(e);
    });
    return [...m.entries()]
      .sort((a, b) => {
        const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a[0].localeCompare(b[0]);
      })
      .map(([k, list]) => [k, [...list].sort(byNotOnTripThenName)]);
  }, [filtered, groupBy, rooms, bags, onThisTrip]);

  const selectedKeys = Object.keys(sel).filter((k) => sel[k]);
  const selectedEntries = library.filter((e) => sel[e.key]);

  const addSelected = () => {
    onAddToTrip(selectedEntries.map((e) => ({
      name: e.name, room_source: e.room_source, assigned_bag: e.assigned_bag,
      quantity: e.quantity || 1, notes_or_special_instructions: e.notes_or_special_instructions || "",
      is_prescription: !!e.is_prescription, last_minute: !!e.last_minute,
    })));
    setSel({});
    onClose();
  };

  return (
    <Sheet open={open} title="Item library" onClose={onClose}>
      <div className="mb-3 grid grid-cols-2 gap-2">
        <button onClick={() => setView("library")}
          className={`rounded-lg border-2 px-2 py-2 text-sm font-bold ${view === "library" ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white"}`}>
          All items ({library.length})
        </button>
        <button onClick={() => setView("duplicates")}
          className={`rounded-lg border-2 px-2 py-2 text-sm font-bold ${view === "duplicates" ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white"}`}>
          Check duplicates ({duplicatesOnTrip.length})
        </button>
      </div>

      {view === "duplicates" ? (
        <>
          <p className="mb-3 text-sm text-slate-600">
            Items appearing more than once on this trip. Often that's deliberate — a few pants in the grab bag and the rest in the suitcase — so nothing is removed automatically. Check the quantities look right.
          </p>
          {duplicatesOnTrip.length === 0 && (
            <p className="rounded-xl border-2 border-dashed border-slate-300 p-6 text-center text-sm text-slate-500">
              Nothing is listed twice on this trip.
            </p>
          )}
          {duplicatesOnTrip.map((d) => (
            <div key={d.key} className="mb-3 rounded-xl border-2 border-amber-300 bg-amber-50 p-3">
              <p className="mb-2 text-sm font-bold">{d.name} — {d.list.length} entries</p>
              <ul className="space-y-1">
                {d.list.map((i) => (
                  <li key={i.id} className="flex items-center justify-between gap-2 rounded-lg bg-white px-2 py-2">
                    <span className="min-w-0 flex-1 text-xs">
                      <span className="font-semibold">{i.assigned_bag || "No bag"}</span>
                      <span className="text-slate-500"> · from {i.room_source || "Unsorted"}</span>
                    </span>
                    <span className="shrink-0 rounded bg-slate-100 px-2 py-0.5 text-xs font-bold">×{i.quantity || 1}</span>
                  </li>
                ))}
              </ul>
              <p className="mt-2 text-xs text-amber-800">
                Total across all entries: {d.list.reduce((a, i) => a + (i.quantity || 1), 0)}
              </p>
            </div>
          ))}
        </>
      ) : (
        <>
          <p className="mb-3 text-sm text-slate-600">
            Everything you've ever packed, listed once each. Tick to add to this trip, or tap the pencil to edit — edits apply to every trip that item appears on, which is how you empty out a room you want to delete.
          </p>

          <div className="mb-2 flex gap-1">
            {[["room", "By room"], ["bag", "By bag"], ["name", "A–Z"]].map(([id, label]) => (
              <button key={id} onClick={() => setGroupBy(id)}
                className={`flex-1 rounded-lg border-2 px-2 py-1.5 text-xs font-bold ${groupBy === id ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                {label}
              </button>
            ))}
          </div>

          <div className="relative mb-3">
            <Search size={14} className="absolute left-2 top-2.5 text-slate-400" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Find an item"
              className="w-full rounded-lg border-2 border-slate-300 bg-white py-1.5 pl-7 pr-2 text-sm" />
          </div>

          {archivedCount > 0 && (
            <button onClick={() => setShowArchived(!showArchived)}
              className="mb-3 text-xs font-bold text-teal-700">
              {showArchived ? `Hide archived (${archivedCount})` : `Show ${archivedCount} archived item${archivedCount === 1 ? "" : "s"}`}
            </button>
          )}

          {grouped.map(([label, list]) => (
            <section key={label} className="mb-4">
              <button onClick={() => setCollapsedGroups({ ...collapsedGroups, [groupBy + label]: !collapsedGroups[groupBy + label] })}
                className="mb-1 flex w-full items-center gap-1 text-left">
                {collapsedGroups[groupBy + label] ? <ChevronRight size={13} /> : <ChevronDown size={13} />}
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">{label} ({list.length})</h3>
              </button>
              {!collapsedGroups[groupBy + label] && (
              <ul className="space-y-1.5">
                {list.map((e) => {
                  const already = onThisTrip.has(e.key);
                  const isArchived = archivedSet.has(e.key);
                  return (
                    <li key={e.key} className={`flex items-stretch overflow-hidden rounded-lg border-2 ${sel[e.key] ? "border-teal-600" : isArchived ? "border-slate-200 bg-slate-50" : "border-slate-200"} bg-white`}>
                      <button onClick={() => setSel({ ...sel, [e.key]: !sel[e.key] })}
                        className={`flex w-10 shrink-0 items-center justify-center ${sel[e.key] ? "bg-teal-600 text-white" : already ? "bg-slate-100 text-slate-300" : "bg-slate-50 text-slate-300"}`}>
                        <Check size={16} strokeWidth={3} />
                      </button>
                      <div className="min-w-0 flex-1 px-2 py-2">
                        <p className={`text-sm font-semibold leading-tight ${already ? "text-slate-400" : ""}`}>
                          {e.name}
                          {e.is_prescription && <Pill size={11} className="ml-1 inline text-teal-700" />}
                          {e.last_minute && <Snowflake size={11} className="ml-1 inline text-sky-600" />}
                          {isArchived && <span className="ml-2 rounded bg-slate-200 px-1.5 py-0.5 text-xs font-bold text-slate-500">Archived</span>}
                        </p>
                        <p className="truncate text-xs text-slate-400">
                          {already && <span className="font-bold text-slate-500">On this trip · </span>}
                          {e.room_source || "Unsorted"} → {e.assigned_bag || "No bag"}
                          {e.tripIds.size > 1 && <span> · used on {e.tripIds.size} trips</span>}
                        </p>
                      </div>
                      <button onClick={() => setEditing({ ...e })} className="flex w-10 shrink-0 items-center justify-center text-slate-500">
                        <Pencil size={15} />
                      </button>
                    </li>
                  );
                })}
              </ul>
              )}
            </section>
          ))}

          {filtered.length === 0 && (
            <p className="rounded-xl border-2 border-dashed border-slate-300 p-6 text-center text-sm text-slate-500">
              {search ? "Nothing matches that search." : "No items yet — they'll appear here once you've packed a trip."}
            </p>
          )}
        </>
      )}

      {selectedKeys.length > 0 && view === "library" && (
        <button onClick={addSelected} className={`${btn} sticky bottom-2 w-full bg-slate-900 py-4 text-white shadow-lg`}>
          Add {selectedKeys.length} to this trip
        </button>
      )}

      <Sheet open={!!editing} title="Edit item" onClose={() => { setEditing(null); setConfirmDelete(null); setApplyToPast(false); }}>
        {editing && (
          <>
            <p className="mb-4 rounded-lg border-2 border-slate-200 bg-slate-50 p-2 text-xs text-slate-600">
              Packed on {editing.tripIds.size} trip{editing.tripIds.size === 1 ? "" : "s"}. By default this updates how it's packed from now on — past trips keep their own record of where things actually went.
            </p>
            <Field label="Item"><input className={inputCls} value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} /></Field>
            <Field label="From which room">
              <PickOrAdd value={editing.room_source} options={rooms} placeholder="New room name"
                onChange={(v) => setEditing({ ...editing, room_source: v })} />
            </Field>
            <Field label="Into which bag">
              <PickOrAdd value={editing.assigned_bag} options={bags} placeholder="New bag name"
                onChange={(v) => setEditing({ ...editing, assigned_bag: v })} />
            </Field>

            {editing.occurrences.length > 1 && (
              <label className="mb-4 flex items-start gap-2 rounded-lg border-2 border-amber-200 bg-amber-50 p-3 text-sm font-semibold text-amber-800">
                <input type="checkbox" checked={applyToPast} onChange={(e) => setApplyToPast(e.target.checked)} className="mt-0.5 h-5 w-5 shrink-0" />
                <span>
                  Also correct past trips ({editing.occurrences.length} entries)
                  <span className="mt-1 block text-xs font-normal">
                    For fixing a genuine mistake — a typo, a wrong name. Leave off if you've simply changed where something goes now, so Iona still shows where it really was.
                  </span>
                </span>
              </label>
            )}

            <button
              onClick={() => {
                const fields = { name: editing.name, room_source: editing.room_source, assigned_bag: editing.assigned_bag };
                const ids = applyToPast ? editing.occurrences.map((o) => o.id) : [editing.latestId];
                onEditEverywhere(ids, fields);
                setEditing(null);
                setApplyToPast(false);
              }}
              className={`${btn} w-full bg-slate-900 py-4 text-white`}>
              {applyToPast ? `Update all ${editing.occurrences.length} entries` : "Save"}
            </button>

            {archivedSet.has(editing.key) ? (
              <button onClick={() => { onUnarchive(editing.key); setEditing(null); }}
                className={`${btn} mt-3 w-full border-2 border-teal-700 bg-white text-teal-800`}>
                Bring back into the library
              </button>
            ) : (
              <button onClick={() => { onArchive(editing.key); setEditing(null); }}
                className={`${btn} mt-3 w-full border-2 border-slate-300 bg-white text-slate-700`}>
                Archive from library
              </button>
            )}
            <p className="mt-1 text-xs text-slate-500">
              Archiving just stops it cluttering the library and future suggestions. Every trip it's already on — including this one — keeps it exactly as it is. Reversible any time.
            </p>

            {confirmDelete !== editing.key ? (
              <button onClick={() => setConfirmDelete(editing.key)} className={`${btn} mt-4 w-full border-2 border-red-200 bg-white text-red-700`}>
                <Trash2 size={16} /> Remove from every trip
              </button>
            ) : (
              <div className="mt-3 rounded-xl border-2 border-red-300 bg-red-50 p-3">
                <p className="mb-2 text-sm font-bold text-red-800">Delete all {editing.occurrences.length} entries?</p>
                <p className="mb-2 text-xs text-red-700">This removes it from past trips too, and can't be undone.</p>
                <div className="flex gap-2">
                  <button onClick={() => { onDeleteEverywhere(editing.occurrences.map((o) => o.id)); setEditing(null); setConfirmDelete(null); }}
                    className={`${btn} flex-1 bg-red-700 text-white`}>Yes, delete</button>
                  <button onClick={() => setConfirmDelete(null)} className={`${btn} flex-1 border-2 border-slate-300 bg-white`}>Cancel</button>
                </div>
              </div>
            )}
          </>
        )}
      </Sheet>
    </Sheet>
  );
}

function TripsSheet({ open, onClose, onNewTrip, trips, items, activeTripId, onSwitch, onCopyItems, onCopyTrip, onResetTicks }) {
  const [openTrip, setOpenTrip] = useState(null);
  const [sel, setSel] = useState({});
  const [hideExisting, setHideExisting] = useState(true);
  const [search, setSearch] = useState("");
  useEffect(() => { if (open) { setOpenTrip(null); setSel({}); setHideExisting(true); setSearch(""); } }, [open]);

  /* Normalised names already on the active list, so we can tell at a glance
     what would be a duplicate. Loose matching on purpose — "Passports (all 4)"
     and "Passports and birth certificates" won't match, but "Wipes" and
     "wipes " will, which catches most real overlap. */
  const existingNames = useMemo(() => {
    const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    return new Set(items.filter((i) => i.trip_id === activeTripId).map((i) => norm(i.name)));
  }, [items, activeTripId]);

  const isAlreadyOnList = (name) => {
    const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    return existingNames.has(norm(name));
  };

  const tripItems = items.filter((i) => i.trip_id === openTrip);
  const newCount = tripItems.filter((i) => !isAlreadyOnList(i.name)).length;
  const dupeCount = tripItems.length - newCount;

  const visibleItems = useMemo(() => {
    let list = tripItems;
    if (hideExisting) list = list.filter((i) => !isAlreadyOnList(i.name));
    const q = search.trim().toLowerCase();
    if (q) list = list.filter((i) => (i.name || "").toLowerCase().includes(q));
    return list;
  }, [tripItems, hideExisting, search, existingNames]);

  const byRoom = useMemo(() => {
    const m = new Map();
    visibleItems.forEach((i) => { const k = i.room_source || "Unsorted"; if (!m.has(k)) m.set(k, []); m.get(k).push(i); });
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  }, [visibleItems]);

  const chosen = tripItems.filter((i) => sel[i.id]);

  const selectAllMissing = () => {
    const next = { ...sel };
    tripItems.forEach((i) => { if (!isAlreadyOnList(i.name)) next[i.id] = true; });
    setSel(next);
  };

  return (
    <Sheet open={open} title={openTrip ? "Borrow from this trip" : "Your trips"} onClose={onClose}>
      {!openTrip && (
        <button onClick={onNewTrip} className={`${btn} mb-4 w-full bg-slate-900 py-4 text-white`}>
          <Sparkles size={16} /> Start a new trip
        </button>
      )}
      {!openTrip ? (
        <ul className="space-y-3">
          {trips.map((t) => {
            const n = items.filter((i) => i.trip_id === t.id).length;
            let review = null;
            try { review = t.review ? JSON.parse(t.review) : null; } catch {}
            return (
              <li key={t.id} className="rounded-xl border-2 border-slate-300 bg-white p-3">
                <p className="font-bold">
                  {t.name}
                  {t.id === activeTripId && <span className="ml-2 rounded bg-teal-100 px-2 py-0.5 text-xs font-bold uppercase text-teal-800">Current</span>}
                </p>
                <p className="text-xs text-slate-500">{t.month} · {t.days} days · {t.transport} · {n} items</p>
                {review?.missing && <p className="mt-1 text-xs text-amber-700">Wished we'd had: {review.missing}</p>}
                <div className="mt-2 grid grid-cols-2 gap-2">
                  <button onClick={() => setOpenTrip(t.id)} className={`${btn} border-2 border-slate-300 bg-white`}>See items</button>
                  {t.id !== activeTripId
                    ? <button onClick={() => onSwitch(t.id)} className={`${btn} bg-slate-900 text-white`}>Pack this one</button>
                    : <button onClick={onResetTicks} className={`${btn} border-2 border-amber-300 bg-white text-amber-800`}><RotateCcw size={15} /> Untick all</button>}
                  <button onClick={() => onCopyTrip(t.id)} className={`${btn} col-span-2 border-2 border-slate-300 bg-white`}><Copy size={15} /> Repeat as a new trip</button>
                </div>
              </li>
            );
          })}
        </ul>
      ) : (
        <>
          <button onClick={() => setOpenTrip(null)} className="mb-3 flex items-center gap-2 text-sm font-bold text-slate-500"><ArrowLeft size={15} /> All trips</button>

          <div className="mb-3 rounded-xl border-2 border-slate-300 bg-white p-3">
            <p className="mb-2 text-sm text-slate-600">
              <strong>{newCount}</strong> item{newCount === 1 ? "" : "s"} here aren't on your current list yet
              {dupeCount > 0 && <> · {dupeCount} you already have</>}
            </p>
            <div className="mb-2 flex gap-2">
              <button onClick={() => setHideExisting(!hideExisting)}
                className={`${btn} flex-1 border-2 text-xs ${hideExisting ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                {hideExisting ? "Hiding what you have" : "Showing everything"}
              </button>
              <button onClick={selectAllMissing} className={`${btn} flex-1 border-2 border-slate-900 bg-white text-xs`}>
                Select all {newCount} missing
              </button>
            </div>
            <div className="relative">
              <Search size={14} className="absolute left-2 top-2.5 text-slate-400" />
              <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Find an item"
                className="w-full rounded-lg border-2 border-slate-300 bg-white py-1.5 pl-7 pr-2 text-sm" />
            </div>
          </div>

          {visibleItems.length === 0 && (
            <p className="rounded-xl border-2 border-dashed border-slate-300 p-6 text-center text-sm text-slate-500">
              {search ? "Nothing matches that search." : hideExisting ? "You already have everything from this trip on your current list." : "Nothing here."}
            </p>
          )}

          <div className="space-y-4">
            {byRoom.map(([room, list]) => {
              const allOn = list.every((i) => sel[i.id]);
              return (
                <section key={room}>
                  <div className="mb-1 flex items-center justify-between">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">{room}</h3>
                    <button onClick={() => { const n = { ...sel }; list.forEach((i) => { n[i.id] = !allOn; }); setSel(n); }} className="text-xs font-bold text-teal-700">
                      {allOn ? "Clear group" : "Select group"}
                    </button>
                  </div>
                  <ul className="space-y-1.5">
                    {list.map((i) => {
                      const dupe = isAlreadyOnList(i.name);
                      return (
                      <li key={i.id}>
                        <button onClick={() => setSel({ ...sel, [i.id]: !sel[i.id] })}
                          className={`flex w-full items-center gap-2 rounded-lg border-2 px-2 py-2 text-left ${
                            sel[i.id] ? "border-teal-600 bg-white" : dupe ? "border-slate-200 bg-slate-100" : "border-slate-200 bg-white"
                          }`}>
                          <span className={`flex h-5 w-5 shrink-0 items-center justify-center rounded border-2 ${sel[i.id] ? "border-teal-600 bg-teal-600 text-white" : "border-slate-300"}`}>
                            {sel[i.id] && <Check size={12} strokeWidth={3} />}
                          </span>
                          <span className="min-w-0 flex-1">
                            <span className={`block text-sm font-semibold ${dupe ? "text-slate-400" : ""}`}>
                              {i.name}{i.quantity > 1 && ` ×${i.quantity}`}
                            </span>
                            <span className="block text-xs uppercase tracking-wide text-slate-400">
                              {dupe ? <span className="text-slate-500">Already on your list</span> : i.assigned_bag}
                            </span>
                          </span>
                        </button>
                      </li>
                    );})}
                  </ul>
                </section>
              );
            })}
          </div>
          {chosen.length > 0 && (
            <button onClick={() => { onCopyItems(chosen.map((i) => ({
              name: i.name, room_source: i.room_source, assigned_bag: i.assigned_bag, quantity: i.quantity,
              notes_or_special_instructions: i.notes_or_special_instructions, packer: i.packer,
              is_prescription: i.is_prescription, last_minute: i.last_minute,
            }))); onClose(); }} className={`${btn} mt-5 w-full bg-slate-900 py-4 text-white`}>
              Add {chosen.length} to the current list
            </button>
          )}
        </>
      )}
    </Sheet>
  );
}

function PlaceList({ title, blurb, field, list, onChange, renameEverywhere, countUsing }) {
  const [adding, setAdding] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const [draft, setDraft] = useState("");
  const [msg, setMsg] = useState("");
  const [retiring, setRetiring] = useState(null);
  const flash = (m) => { setMsg(m); setTimeout(() => setMsg(""), 5000); };

  // Drag state lives outside React state so a finger move doesn't re-render
  // on every pixel — only the row heights (fixed) and a "dragging index"
  // need tracking for the visual feedback.
  const dragFrom = useRef(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const rowRefs = useRef([]);

  const move = (i, dir) => {
    const n = [...list], j = i + dir;
    if (j < 0 || j >= n.length) return;
    [n[i], n[j]] = [n[j], n[i]];
    onChange(n);
  };
  const reorder = (from, to) => {
    if (from === to || from == null || to == null) return;
    const n = [...list];
    const [moved] = n.splice(from, 1);
    n.splice(to, 0, moved);
    onChange(n);
  };
  const commit = async (i) => {
    const to = draft.trim(), from = list[i];
    setEditIdx(null);
    if (!to || to === from) return;
    const n = [...list]; n[i] = to; onChange(n);
    if (field) { const c = await renameEverywhere(field, from, to); if (c) flash(`Renamed on ${c} item${c === 1 ? "" : "s"}.`); }
  };
  const remove = (i) => {
    const used = field ? countUsing(field, list[i]) : 0;
    if (used) { setRetiring({ index: i, name: list[i], count: used, moveTo: list.find((_, j) => j !== i) || "" }); return; }
    onChange(list.filter((_, j) => j !== i));
  };

  const findIndexAtY = (y) => {
    for (let i = 0; i < rowRefs.current.length; i++) {
      const el = rowRefs.current[i];
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) return i;
    }
    return null;
  };

  const onHandleTouchStart = (i) => (e) => {
    dragFrom.current = i;
    setDragIdx(i);
    setOverIdx(i);
  };
  const onHandleTouchMove = (e) => {
    if (dragFrom.current == null) return;
    e.preventDefault();
    const touch = e.touches[0];
    const idx = findIndexAtY(touch.clientY);
    if (idx != null) setOverIdx(idx);
  };
  const onHandleTouchEnd = () => {
    if (dragFrom.current != null && overIdx != null) reorder(dragFrom.current, overIdx);
    dragFrom.current = null;
    setDragIdx(null);
    setOverIdx(null);
  };

  return (
    <section className="mb-8">
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500">{title}</h3>
      <p className="mb-1 mt-1 text-sm text-slate-600">{blurb}</p>
      <p className="mb-3 text-xs text-slate-400">Hold the handle and drag to reorder, or use the arrows.</p>
      {msg && <p className="mb-3 rounded-xl border-2 border-amber-200 bg-amber-50 p-3 text-sm font-semibold text-amber-800">{msg}</p>}

      {retiring && (
        <div className="mb-3 rounded-xl border-2 border-amber-400 bg-amber-50 p-3">
          <p className="text-sm font-bold text-amber-900">Retire "{retiring.name}"?</p>
          <p className="mt-1 text-xs text-amber-800">
            {retiring.count} item{retiring.count === 1 ? "" : "s"} across your trips still use it. Choose where they should go — this does rewrite past trips, deliberately, because the place no longer exists.
          </p>
          <select className={`${inputCls} mt-2`} value={retiring.moveTo}
            onChange={(e) => setRetiring({ ...retiring, moveTo: e.target.value })}>
            {list.filter((_, j) => j !== retiring.index).map((n) => <option key={n}>{n}</option>)}
          </select>
          <div className="mt-2 flex gap-2">
            <button
              onClick={async () => {
                const moved = await renameEverywhere(field, retiring.name, retiring.moveTo);
                onChange(list.filter((_, j) => j !== retiring.index));
                setRetiring(null);
                flash(`Moved ${moved} item${moved === 1 ? "" : "s"} to ${retiring.moveTo}.`);
              }}
              disabled={!retiring.moveTo}
              className={`${btn} flex-1 bg-slate-900 text-white disabled:opacity-40`}>
              Move and retire
            </button>
            <button onClick={() => setRetiring(null)} className={`${btn} flex-1 border-2 border-slate-300 bg-white`}>Cancel</button>
          </div>
        </div>
      )}
      <ul className="space-y-2">
        {list.map((name, i) => (
          <li
            key={name + i}
            ref={(el) => (rowRefs.current[i] = el)}
            className={`flex items-center gap-1 rounded-xl border-2 bg-white px-2 py-1.5 transition ${
              dragIdx === i ? "border-teal-600 opacity-60" : overIdx === i && dragIdx != null && dragIdx !== i ? "border-teal-400 bg-teal-50" : "border-slate-300"
            }`}
          >
            {editIdx === i ? (
              <>
                <input autoFocus className="min-w-0 flex-1 rounded-lg border-2 border-teal-600 px-2 py-2" value={draft}
                  onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && commit(i)} />
                <button onClick={() => commit(i)} className="rounded-lg bg-teal-600 p-2.5 text-white"><Check size={16} strokeWidth={3} /></button>
              </>
            ) : (
              <>
                <button
                  className="touch-none p-2 text-slate-400"
                  onTouchStart={onHandleTouchStart(i)}
                  onTouchMove={onHandleTouchMove}
                  onTouchEnd={onHandleTouchEnd}
                  aria-label="Drag to reorder"
                >
                  <GripVertical size={16} />
                </button>
                <span className="min-w-0 flex-1 truncate px-1 text-sm font-semibold">
                  {name}{field && <span className="ml-2 text-xs font-bold text-slate-400">{countUsing(field, name)}</span>}
                </span>
                <button onClick={() => move(i, -1)} className="p-2 text-slate-400"><ChevronUp size={16} /></button>
                <button onClick={() => move(i, 1)} className="p-2 text-slate-400"><ChevronDown size={16} /></button>
                <button onClick={() => { setEditIdx(i); setDraft(name); }} className="p-2 text-slate-600"><Pencil size={16} /></button>
                <button onClick={() => remove(i)} className="p-2 text-red-600"><Trash2 size={16} /></button>
              </>
            )}
          </li>
        ))}
      </ul>
      <div className="mt-3 flex gap-2">
        <input className={inputCls} placeholder={`Add to ${title.toLowerCase()}`} value={adding} onChange={(e) => setAdding(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && adding.trim() && !list.includes(adding.trim())) { onChange([...list, adding.trim()]); setAdding(""); } }} />
        <button onClick={() => { const v = adding.trim(); if (v && !list.includes(v)) { onChange([...list, v]); setAdding(""); } }}
          className={`${btn} shrink-0 bg-slate-900 px-5 text-white`}><Plus size={18} /></button>
      </div>
    </section>
  );
}


function ListsSheet({ open, onClose, rooms, bags, packers, save, renameEverywhere, countUsing }) {
  return (
    <Sheet open={open} title="Rooms, bags and packers" onClose={onClose}>
      <PlaceList title="Rooms" blurb="Where things live at home. These are the sections in Gather mode, in the order you'd walk the house. The small number is how many items use each one."
        field="room_source" list={rooms} onChange={(n) => save({ rooms: n })} renameEverywhere={renameEverywhere} countUsing={countUsing} />
      <PlaceList title="Bags" blurb="What you actually carry. These order the Pack and In bags views. Put the reachable ones at the top."
        field="assigned_bag" list={bags} onChange={(n) => save({ bags: n })} renameEverywhere={renameEverywhere} countUsing={countUsing} />
      <PlaceList title="Packers" blurb="Whose job is whose. Keep one option that means either of you."
        field="packer" list={packers} onChange={(n) => save({ packers: n })} renameEverywhere={renameEverywhere} countUsing={countUsing} />
      <p className="text-sm text-slate-500">
        Renaming updates every item that used the old name, on both phones. The lists themselves are stored on this device, so set them up once on each.
      </p>
    </Sheet>
  );
}


function ApiKeyBlock() {
  const [key, setKey] = useState("");
  const [saved, setSaved] = useState(false);
  useEffect(() => { (async () => setKey((await store.get("anthropic-key")) || ""))(); }, []);
  return (
    <div className="mb-8">
      <h3 className="mb-2 text-sm font-bold uppercase tracking-wider text-slate-500">AI features</h3>
      <p className="mb-3 text-sm text-slate-600">
        Drafting a packing list and suggesting jobs both call Claude. Paste an Anthropic API key from console.anthropic.com. It stays on this phone and is never sent anywhere except Anthropic. Everything else in the app works without it.
      </p>
      <Field label="Anthropic API key">
        <input className={inputCls} type="password" placeholder="sk-ant-…" value={key}
          onChange={(e) => { setKey(e.target.value); setSaved(false); }} />
      </Field>
      <button onClick={async () => { await store.set("anthropic-key", key.trim()); setSaved(true); }}
        className={`${btn} w-full border-2 border-slate-300 bg-white`}>{saved ? "Saved" : "Save key"}</button>
    </div>
  );
}

function SettingsSheet({ open, onClose, onOpenLists, settings, setSettings, connect, status, statusMsg, busy }) {
  const [copied, setCopied] = useState(false);
  return (
    <Sheet open={open} title="Settings" onClose={onClose}>
      <button onClick={onOpenLists} className={`${btn} mb-8 w-full border-2 border-slate-900 bg-white py-4`}>
        <ClipboardList size={16} /> Rooms, bags and packers
      </button>

      <ApiKeyBlock />

      <h3 className="mb-2 text-sm font-bold uppercase tracking-wider text-slate-500">Sync with your partner</h3>
      <p className="mb-4 text-sm text-slate-600">Paste the two values from your Supabase project (Settings → API). Once connected, whatever one of you ticks, the other sees within a few seconds.</p>
      <Field label="Project URL"><input className={inputCls} placeholder="https://abcdefg.supabase.co" value={settings.url} onChange={(e) => setSettings({ ...settings, url: e.target.value })} /></Field>
      <Field label="Publishable key (or legacy anon key)"><input className={inputCls} placeholder="sb_publishable_… or eyJhbGciOi…" value={settings.key} onChange={(e) => setSettings({ ...settings, key: e.target.value })} /></Field>
      {status === "error" && <p className="mb-3 whitespace-pre-wrap break-words rounded-xl border-2 border-red-200 bg-red-50 p-3 text-sm font-semibold text-red-700">{statusMsg}</p>}
      {status === "live" && <p className="mb-3 rounded-xl border-2 border-teal-200 bg-teal-50 p-3 text-sm font-semibold text-teal-800">Connected. Both phones are on the same list.</p>}
      <button onClick={() => connect(settings.url.trim(), settings.key.trim())} disabled={busy || !settings.url || !settings.key}
        className={`${btn} w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>
        {busy ? <><Loader2 size={16} className="animate-spin" /> Connecting…</> : "Connect"}
      </button>

      <div className="mt-8 rounded-xl border-2 border-slate-300 bg-white p-4">
        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500">First time? Run this once</h3>
        <p className="mt-2 text-sm text-slate-600">In Supabase, open the SQL Editor, paste this in and press Run. It creates the five tables the app needs. If you already ran an earlier version, delete those tables first.</p>
        <pre className="mt-3 max-h-48 overflow-auto rounded-lg bg-slate-900 p-3 text-xs text-slate-100">{SQL}</pre>
        <button onClick={() => { navigator.clipboard?.writeText(SQL); setCopied(true); setTimeout(() => setCopied(false), 2000); }}
          className={`${btn} mt-3 w-full border-2 border-slate-300 bg-white`}>{copied ? "Copied" : "Copy the SQL"}</button>
      </div>
    </Sheet>
  );
}


try {
  window.__APP_STARTED__ = true;
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
} catch (err) {
  window.__APP_STARTED__ = true;
  showFailure("The app crashed while starting:", (err && err.stack) || String(err));
}

</script>
</body>
