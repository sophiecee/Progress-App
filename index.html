        Video links appear as addresses — the professional needs the OneDrive share to open them.
      </p>
    </div>
  );
}

function PrintDoc({ skills, tracks, reviews, media, threshold, range, scope }) {
  const skillById = Object.fromEntries(skills.map((s) => [s.id, s]));
  const groups = DISCIPLINES.filter((d) => (scope === "all" ? true : d.id === scope)).map((d) => {
    const rows = tracks
      .filter((t) => t.discipline === d.id && skillById[t.skill_id] && !skillById[t.skill_id].is_archived)
      .map((t) => ({
        track: t,
        skill: skillById[t.skill_id],
        hist: reviews
          .filter((r) => r.skill_id === t.skill_id && r.discipline === d.id && r.reviewed_on >= range.from && r.reviewed_on <= range.to)
          .slice()
          .sort((a, b) => (a.reviewed_on < b.reviewed_on ? -1 : 1)),
      }))
      .filter((row) => row.hist.length || (row.skill.date_first_observed >= range.from && row.skill.date_first_observed <= range.to))
      .sort((a, b) => (a.skill.name || "").localeCompare(b.skill.name || ""));
    return { d: d, rows: rows };
  }).filter((g) => g.rows.length);

  return (
    <div id="printroot">
      <div style={{ borderBottom: "2px solid #0b1220", paddingBottom: "8px", marginBottom: "16px" }}>
        <div style={{ fontSize: "10pt", letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 700 }}>
          Skill Chronicle — Kid 1
        </div>
        <div style={{ fontSize: "16pt", fontWeight: 700, marginTop: "2px" }}>
          {scope === "all" ? "All disciplines" : (DISC_BY_ID[scope] || {}).full}
        </div>
        <div style={{ fontSize: "10pt", marginTop: "2px" }}>
          {fmtDate(range.from)} to {fmtDate(range.to)} · prepared {fmtDate(todayISO())}
        </div>
      </div>

      {groups.length === 0 ? <p>No entries in this range.</p> : null}

      {groups.map((g) => (
        <div key={g.d.id} style={{ marginBottom: "18px" }}>
          <h2 style={{ fontSize: "12pt", fontWeight: 700, borderBottom: "1px solid #999", paddingBottom: "3px" }}>{g.d.full}</h2>
          {g.rows.map((row) => (
            <div key={row.track.id} className="pagebreak" style={{ marginTop: "12px" }}>
              <div style={{ fontWeight: 700, fontSize: "11.5pt" }}>{row.skill.name}</div>
              <div style={{ fontSize: "9.5pt", color: "#444" }}>
                First observed {fmtDate(row.skill.date_first_observed)} · status for this discipline:{" "}
                {row.track.is_retired ? "achieved" : (STATUS_LABEL[row.track.current_status] || row.track.current_status)}
                {row.track.is_retired ? " \u2014 achieved, no longer for active review" : ""}
              </div>
              {row.skill.description ? <div style={{ fontSize: "10pt", marginTop: "3px" }}>{row.skill.description}</div> : null}
              {row.hist.length ? (
                <table style={{ width: "100%", borderCollapse: "collapse", marginTop: "6px", fontSize: "9.5pt" }}>
                  <thead>
                    <tr>
                      <th style={{ textAlign: "left", borderBottom: "1px solid #bbb", padding: "3px 4px", width: "22%" }}>Observed</th>
                      <th style={{ textAlign: "left", borderBottom: "1px solid #bbb", padding: "3px 4px", width: "20%" }}>Verdict</th>
                      <th style={{ textAlign: "left", borderBottom: "1px solid #bbb", padding: "3px 4px" }}>Note</th>
                    </tr>
                  </thead>
                  <tbody>
                    {row.hist.map((r) => (
                      <tr key={r.id}>
                        <td style={{ padding: "3px 4px", borderBottom: "1px solid #eee", verticalAlign: "top" }}>{fmtDate(r.reviewed_on)}</td>
                        <td style={{ padding: "3px 4px", borderBottom: "1px solid #eee", verticalAlign: "top" }}>
                          {VERDICT_BY_ID[r.verdict] ? VERDICT_BY_ID[r.verdict].label : r.verdict}
                          {r.retired_by_this ? " — achieved here" : ""}
                        </td>
                        <td style={{ padding: "3px 4px", borderBottom: "1px solid #eee", verticalAlign: "top" }}>{r.note || ""}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <div style={{ fontSize: "9.5pt", color: "#666", marginTop: "4px" }}>No reviews in this range.</div>
              )}
              {media.filter((m) => m.skill_id === row.skill.id && m.kind === "video_link").map((m) => (
                <div key={m.id} style={{ fontSize: "9pt", marginTop: "3px", wordBreak: "break-all" }}>
                  Video: {m.caption ? m.caption + " — " : ""}{m.url}
                </div>
              ))}
            </div>
          ))}
        </div>
      ))}
      <div style={{ marginTop: "20px", fontSize: "8.5pt", color: "#555", borderTop: "1px solid #ccc", paddingTop: "6px" }}>
        Entries are appended only and never edited. Each discipline reviews a skill separately: it leaves that discipline's
        active review after {threshold} consecutive “still there” verdicts, and returns if it is later lost or patchy.
      </div>
    </div>
  );
}

/* -------------------------------------------------------------- settings */

function SettingsView({ profile, session, settings, canWrite, onThreshold, queue, syncing, onRetry, onSignOut }) {
  const [avoid, setAvoid] = useState(() => (lsGet(LS.avoid, []) || []).join(", "));
  const [people, setPeople] = useState(null);
  const [peopleErr, setPeopleErr] = useState(null);

  useEffect(() => {
    if (!canWrite) return;
    (async () => {
      try {
        const sb = getClient();
        const { data, error } = await sb.from("profiles").select("*").order("role");
        if (error) throw error;
        setPeople(data || []);
      } catch (e) {
        setPeopleErr(errText(e));
      }
    })();
  }, [canWrite]);

  return (
    <div className="px-4 pb-32 pt-4">
      <h1 className="text-[24px] font-bold tracking-tight">Settings</h1>

      <div className="mt-4 rounded-2xl border-2 border-slate-200 bg-white p-4">
        <div className="text-[13px] font-bold uppercase tracking-wide text-slate-500">Signed in as</div>
        <div className="mt-1 text-[17px] font-semibold break-all">{session ? session.user.email : "Demo mode \u2014 not signed in"}</div>
        <div className="mt-1 text-[15px] text-slate-600">
          {profile ? (profile.role === "parent" ? "Parent — full read and write" : "Professional — read only") : "No profile row found"}
        </div>
        <button onClick={onSignOut} className="mt-3 rounded-xl border-2 border-slate-200 px-4 py-3 text-[15px] font-semibold">
          {session ? "Sign out" : "Leave demo"}
        </button>
      </div>

      <div className="mt-4 rounded-2xl border-2 border-slate-200 bg-white p-4">
        <div className="mb-2 text-[13px] font-bold uppercase tracking-wide text-slate-500">Sync</div>
        {queue.length === 0 ? (
          <p className="text-[15px] text-slate-600">Everything saved. Nothing waiting.</p>
        ) : (
          <>
            <p className="text-[15px]">
              <strong className="tnum">{queue.length}</strong> change{queue.length === 1 ? "" : "s"} waiting to sync. They stay on this
              device until they reach the database.
            </p>
            <button onClick={onRetry} disabled={syncing}
              className="mt-3 rounded-xl bg-slate-900 px-4 py-3 text-[15px] font-semibold text-white disabled:opacity-40">
              {syncing ? "Syncing…" : "Retry now"}
            </button>
          </>
        )}
      </div>

      {canWrite ? (
        <>
          <div className="mt-4 rounded-2xl border-2 border-slate-200 bg-white p-4">
            <div className="mb-3 text-[13px] font-bold uppercase tracking-wide text-slate-500">Retirement threshold</div>
            <Field label="Consecutive “still there” verdicts" hint="Applies from the next verdict onward. Existing streaks are kept as they are.">
              <NumberInput value={Number(settings.retirement_threshold) || 3} onCommit={onThreshold} min={1} max={10} />
            </Field>
            <p className="text-[14px] text-slate-600">
              Retired skills never come back on their own. Reopen one by hand from its page whenever you want it back in the sweep.
            </p>
          </div>

          <div className="mt-4 rounded-2xl border-2 border-slate-200 bg-white p-4">
            <div className="mb-3 text-[13px] font-bold uppercase tracking-wide text-slate-500">Names to watch for</div>
            <Field label="Real names" hint="Kept on this device only — never uploaded. The app warns you if one appears in an entry.">
              <input className={inputCls} value={avoid} onChange={(e) => setAvoid(e.target.value)} placeholder="e.g. Thomas, Grandma Sue" />
            </Field>
            <button
              className="rounded-xl bg-slate-900 px-4 py-3 text-[15px] font-semibold text-white"
              onClick={() => {
                lsSet(LS.avoid, avoid.split(",").map((s) => s.trim()).filter(Boolean));
                setAvoid(avoid);
              }}
            >
              Save list
            </button>
          </div>

          <div className="mt-4 rounded-2xl border-2 border-slate-200 bg-white p-4">
            <div className="mb-2 text-[13px] font-bold uppercase tracking-wide text-slate-500">Who has been in</div>
            {peopleErr ? <Banner tone="bad">{peopleErr}</Banner> : null}
            {people === null && !peopleErr ? <p className="text-[15px] text-slate-600">Loading…</p> : null}
            {(people || []).map((p) => (
              <div key={p.id} className="flex items-baseline justify-between gap-3 border-t border-slate-100 py-2.5 first:border-0">
                <div className="min-w-0">
                  <div className="truncate text-[16px] font-semibold">{p.display_name || p.email}</div>
                  <div className="text-[13px] text-slate-500">{p.role === "parent" ? "Parent" : "Professional"}{p.discipline_note ? " · " + p.discipline_note : ""}</div>
                </div>
                <div className="tnum shrink-0 text-right text-[13px] text-slate-500">
                  {p.last_seen_at ? fmtWhen(p.last_seen_at) : "never"}
                </div>
              </div>
            ))}
            <p className="mt-2 text-[13px] leading-relaxed text-slate-500">
              This records the last sign-in only, not what anyone read. Per-record audit logs are a paid Supabase feature.
            </p>
          </div>
        </>
      ) : null}

      <button
        className="mt-4 w-full rounded-2xl border-2 border-slate-200 py-3.5 text-[15px] font-semibold text-slate-600"
        onClick={() => {
          if (confirm("Forget the database details saved on this device? You will need to paste them again.")) {
            localStorage.removeItem(LS.conn);
            location.reload();
          }
        }}
      >
        Change database connection
      </button>
    </div>
  );
}

/* ------------------------------------------------------------ error guard */

class Guard extends React.Component {
  constructor(p) { super(p); this.state = { dead: false }; }
  componentDidCatch(err, info) {
    __pushError("The screen crashed", err && err.message, (info && info.componentStack) || "");
    this.setState({ dead: true });
  }
  render() {
    if (this.state.dead) {
      return (
        <div className="px-5 py-10">
          <h1 className="text-[22px] font-bold">This screen stopped working</h1>
          <p className="mt-2 text-[15px] text-slate-600">
            The red panel at the bottom shows exactly what failed. Nothing waiting to sync has been lost.
          </p>
          <button className="mt-4 rounded-2xl bg-slate-900 px-5 py-3.5 font-bold text-white" onClick={() => location.reload()}>
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ------------------------------------------------------------------- shell */

function App() {
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [tab, setTab] = useState("sweep");
  const [openSkill, setOpenSkill] = useState(null);
  const [editing, setEditing] = useState(null);
  const [editorOpen, setEditorOpen] = useState(false);
  const [mediaFor, setMediaFor] = useState(null);
  const [mediaMode, setMediaMode] = useState("photo");
  const [online, setOnline] = useState(navigator.onLine);
  const [signedUrls, setSignedUrls] = useState({});
  const [toast, setToast] = useState(null);
  const [scope, setScope] = useState("all");
  const [demo, setDemo] = useState(() => (lsGet(DEMO_KEY, null) ? loadDemo() : null));
  const [range, setRange] = useState({ from: todayISO().slice(0, 4) + "-01-01", to: todayISO() });

  const liveData = useData(session);

  /* In demo mode every "write" lands in this browser only. The shape matches
     the live data source exactly, so every screen below is the real one. */
  const demoData = useMemo(() => {
    if (!demo) return null;
    const mutate = (key) => (fnOrVal) => {
      setDemo((cur) => {
        const next = Object.assign({}, cur);
        next[key] = typeof fnOrVal === "function" ? fnOrVal(cur[key]) : fnOrVal;
        saveDemo(next);
        return next;
      });
    };
    return {
      skills: demo.skills, setSkills: mutate("skills"),
      tracks: demo.tracks, setTracks: mutate("tracks"),
      reviews: demo.reviews, setReviews: mutate("reviews"),
      media: demo.media, setMedia: mutate("media"),
      profile: { role: "parent", display_name: "Demo" },
      settings: { id: 1, retirement_threshold: 3 },
      setSettings: () => {},
      loading: false, loadError: null, reload: () => {},
    };
  }, [demo]);

  const data = demo ? demoData : liveData;
  const live = useQueue(liveData.reload);
  const noop = { queue: [], enqueue: () => {}, drain: () => {}, syncing: false };
  const { queue, enqueue, drain, syncing } = demo ? noop : live;
  const canWrite = !!demo || !!(data.profile && data.profile.role === "parent");
  const threshold = Number(data.settings.retirement_threshold) || 3;
  const avoidList = lsGet(LS.avoid, []) || [];
  const meId = session ? session.user.id : "demo-user";
  /* Groundwork for more than one family sharing this project. Every row is
     stamped with the family it belongs to, and the policies scope reads to it.
     With a single family this is invisible: the column defaults to yours. */
  const familyId = (data.profile && data.profile.family_id) || null;
  const familyIdRef = useRef(null);
  familyIdRef.current = familyId;

  useEffect(() => {
    const sb = getClient();
    if (!sb) { setAuthReady(true); return; }
    sb.auth.getSession().then(({ data: d }) => {
      setSession(d.session || null);
      setAuthReady(true);
    });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);

  useEffect(() => {
    if (!session) return;
    const sb = getClient();
    sb.from("profiles").update({ last_seen_at: new Date().toISOString() }).eq("id", session.user.id).then(() => {});
  }, [session]);

  useEffect(() => {
    const up = () => { setOnline(true); drain(); };
    const down = () => setOnline(false);
    window.addEventListener("online", up);
    window.addEventListener("offline", down);
    return () => { window.removeEventListener("online", up); window.removeEventListener("offline", down); };
  }, [drain]);

  useEffect(() => {
    const sb = getClient();
    if (!sb || !session) return;
    const paths = data.media.filter((m) => m.kind === "photo" && m.storage_path).map((m) => m.storage_path);
    if (!paths.length) return;
    (async () => {
      try {
        const { data: d, error } = await sb.storage.from("observations").createSignedUrls(paths, 3600);
        if (error) throw error;
        const next = {};
        (d || []).forEach((row) => { if (row.signedUrl) next[row.path] = row.signedUrl; });
        setSignedUrls(next);
      } catch (e) {
        __pushError("Could not load photos", errText(e), "Check the observations bucket exists and its policies are in place.");
      }
    })();
  }, [data.media, session]);

  function flash(text) {
    setToast(text);
    setTimeout(() => setToast(null), 2800);
  }

  /* ---- writes: local first, queue always ---- */

  /* Accepts one track or several. One tap in the sweep records the same verdict
     against every discipline that tracks the skill; the skill's own page passes
     a single track when the disciplines genuinely disagree. */
  function handleVerdict(skill, trackOrTracks, verdict, date, note) {
    if (!skill || !trackOrTracks || !canWrite) return;
    const list = Array.isArray(trackOrTracks) ? trackOrTracks : [trackOrTracks];
    if (!list.length) return;
    const hits = checkAnon(note, avoidList);
    if (hits.length && !confirm("This note mentions " + hits.join(", ") + ". Save it anyway?")) return;

    const jobs = [];
    const newReviews = [];
    const patches = {};
    const retiredLabels = [];

    list.forEach((track) => {
      const r = applyVerdict(track, verdict, threshold);
      const review = {
        id: uid(),
        skill_id: skill.id,
        discipline: track.discipline,
        reviewed_on: date,
        verdict: verdict,
        note: note || null,
        streak_after: r.streakAfter,
        threshold_used: threshold,
        retired_by_this: r.retiredNow,
        created_at: new Date().toISOString(),
        created_by: meId,
        family_id: familyIdRef.current,
      };
      newReviews.push(review);
      jobs.push({ kind: "insert", table: "reviews", row: review });
      if (verdict !== "skipped") {
        patches[track.id] = r.patch;
        jobs.push({ kind: "update", table: "skill_tracks", id: track.id, patch: r.patch });
        if (r.retiredNow) retiredLabels.push((DISC_BY_ID[track.discipline] || {}).label);
      }
    });

    data.setReviews((rs) => rs.concat(newReviews));
    if (verdict !== "skipped") {
      data.setTracks((ts) => ts.map((t) => (patches[t.id] ? Object.assign({}, t, patches[t.id]) : t)));
    }
    enqueue(jobs);
    drain();
    if (retiredLabels.length) {
      flash(skill.name + " reached " + threshold + " in a row \u2014 achieved in " + retiredLabels.join(", ") + ".");
    }
  }

  async function saveSkill(form, discs, photos, caption, alreadyAchieved) {
    if (!canWrite) return;
    let skillId;

    if (editing) {
      skillId = editing.id;
      const patch = {
        name: form.name,
        description: form.description || null,
        date_first_observed: form.date_first_observed,
        updated_at: new Date().toISOString(),
      };
      data.setSkills((ss) => ss.map((s) => (s.id === skillId ? Object.assign({}, s, patch) : s)));
      enqueue({ kind: "update", table: "skills", id: skillId, patch: patch });

      const existing = tracksFor(data.tracks, skillId);
      const have = existing.map((t) => t.discipline);
      const added = discs.filter((d) => have.indexOf(d) === -1);
      const dropped = existing.filter((t) => discs.indexOf(t.discipline) === -1);

      added.forEach((d) => {
        const row = newTrack(skillId, d, false);
        data.setTracks((ts) => ts.concat([row]));
        enqueue({ kind: "insert", table: "skill_tracks", row: row });
      });
      // Dropping a discipline archives the track rather than deleting it, so
      // its history survives and returns if the discipline is added back.
      dropped.forEach((t) => {
        const patch2 = { is_archived: true, updated_at: new Date().toISOString() };
        data.setTracks((ts) => ts.filter((x) => x.id !== t.id));
        enqueue({ kind: "update", table: "skill_tracks", id: t.id, patch: patch2 });
      });
    } else {
      skillId = uid();
      const row = {
        id: skillId,
        name: form.name,
        description: form.description || null,
        date_first_observed: form.date_first_observed,
        is_archived: false,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
        created_by: meId,
        family_id: familyId,
      };
      data.setSkills((ss) => ss.concat([row]));
      enqueue({ kind: "insert", table: "skills", row: row });

      discs.forEach((d) => {
        const t = newTrack(skillId, d, alreadyAchieved);
        data.setTracks((ts) => ts.concat([t]));
        enqueue({ kind: "insert", table: "skill_tracks", row: t });
      });
    }

    drain();
    setEditorOpen(false);
    setEditing(null);

    const files = (photos || []).slice(0, 3);
    if (files.length) {
      try {
        // The skill row must land before a photo can reference it.
        await drain();
        for (const f of files) await savePhoto({ id: skillId, name: form.name }, f, caption);
      } catch (e) {
        __pushError("Skill saved, but a photo did not upload", errText(e), "Add it again from the skill's own page.");
        flash("Skill saved. A photo did not upload.");
        return;
      }
    }
    flash(editing ? "Changes saved." : alreadyAchieved ? "Added as already achieved." : "Skill added.");
  }

  function archiveSkill(skill, archived) {
    if (!canWrite) return;
    if (archived && !confirm("Archive \u201c" + skill.name + "\u201d? It leaves the sweep and the export. Nothing is deleted and you can restore it from the Archived list.")) return;
    const patch = { is_archived: archived, updated_at: new Date().toISOString() };
    data.setSkills((ss) => ss.map((x) => (x.id === skill.id ? Object.assign({}, x, patch) : x)));
    enqueue({ kind: "update", table: "skills", id: skill.id, patch: patch });
    drain();
    setOpenSkill(null);
    flash(archived ? "Archived. Find it under Archived in Skills." : "Restored.");
  }

  function newTrack(skillId, discipline, alreadyAchieved) {
    const now = new Date().toISOString();
    return {
      id: uid(),
      skill_id: skillId,
      discipline: discipline,
      current_status: alreadyAchieved ? "achieved" : "not_yet_reviewed",
      maintained_streak: alreadyAchieved ? threshold : 0,
      is_retired: !!alreadyAchieved,
      is_archived: false,
      retired_at: alreadyAchieved ? now : null,
      created_at: now,
      updated_at: now,
      family_id: familyIdRef.current,
    };
  }

  function reopen(track) {
    if (!canWrite) return;
    const patch = {
      is_retired: false,
      current_status: "inconsistent",
      maintained_streak: 0,
      retired_at: null,
      updated_at: new Date().toISOString(),
    };
    data.setTracks((ts) => ts.map((t) => (t.id === track.id ? Object.assign({}, t, patch) : t)));
    enqueue({ kind: "update", table: "skill_tracks", id: track.id, patch: patch });
    drain();
    flash("Back in " + ((DISC_BY_ID[track.discipline] || {}).label || "") + " review.");
  }

  async function savePhoto(skill, file, caption) {
    if (demo) { flash("Photos are switched off in the demo."); return; }
    const sb = getClient();
    const ext = ((file.name || "photo.jpg").split(".").pop() || "jpg").toLowerCase();
    const path = skill.id + "/" + uid() + "." + ext;
    const { error } = await sb.storage.from("observations").upload(path, file, { cacheControl: "3600", upsert: false });
    if (error) throw error;
    const row = {
      id: uid(), skill_id: skill.id, kind: "photo", storage_path: path, url: null,
      caption: caption || null, created_at: new Date().toISOString(), created_by: meId, family_id: familyId,
    };
    const { error: e2 } = await sb.from("media").insert(row);
    if (e2) throw e2;
    data.setMedia((m) => m.concat([row]));
    flash("Photo added.");
  }

  async function saveLink(skill, url, caption) {
    const row = {
      id: uid(), skill_id: skill.id, kind: "video_link", storage_path: null, url: url,
      caption: caption || null, created_at: new Date().toISOString(), created_by: meId, family_id: familyId,
    };
    data.setMedia((m) => m.concat([row]));
    enqueue({ kind: "insert", table: "media", row: row });
    drain();
    flash("Video link saved.");
  }

  function setThreshold(n) {
    data.setSettings((s) => Object.assign({}, s, { retirement_threshold: n }));
    lsSet(LS.threshLocal, n);
    enqueue({ kind: "upsert", table: "app_settings", row: { id: 1, retirement_threshold: n } });
    drain();
  }

  /* ---- gates ---- */

  const conn = readConn();
  if (!conn.url || !conn.key) return <SetupScreen />;
  if (!authReady) return <div className="px-5 py-10 text-[15px] text-slate-600">Checking your sign-in…</div>;
  if (!session && !demo) return <SignIn onDemo={() => { const d = demoSeed(); saveDemo(d); setDemo(d); }} />;

  const skill = data.skills.find((s) => s.id === openSkill) || null;
  const editingDiscs = editing ? disciplinesOf(data.tracks, editing.id) : [];

  const TABS = [
    { id: "sweep", label: "Sweep", icon: "sweep" },
    { id: "skills", label: "Skills", icon: "skills" },
    { id: "export", label: "Export", icon: "printer" },
    { id: "settings", label: "Settings", icon: "settings" },
  ];

  return (
    <>
      <div id="app">
        {(!online || queue.length > 0) ? (
          <div className={cx("px-4 py-2 text-center text-[14px] font-semibold", online ? "bg-amber-100 text-amber-900" : "bg-slate-800 text-white")}>
            {online
              ? (syncing
                  ? "Syncing " + queue.length + " change" + (queue.length === 1 ? "" : "s") + "…"
                  : queue.length + " change" + (queue.length === 1 ? "" : "s") + " waiting to sync")
              : "Offline — entries are saved on this device"}
          </div>
        ) : null}

        {demo ? (
          <div className="flex items-center gap-3 bg-slate-900 px-4 py-2 text-[13.5px] font-semibold text-white">
            <span className="flex-1">Demo \u2014 made-up child, saved only in this browser</span>
            <button className="rounded-lg bg-white/15 px-3 py-1.5"
              onClick={() => { if (confirm("Reset the demo back to its starting data?")) { const d = demoSeed(); saveDemo(d); setDemo(d); } }}>
              Reset
            </button>
          </div>
        ) : null}

        {data.loadError ? <div className="px-4 pt-3"><Banner tone="bad">{data.loadError}</Banner></div> : null}

        {tab === "sweep" ? (
          <SweepView skills={data.skills} tracks={data.tracks} reviews={data.reviews} threshold={threshold}
            canWrite={canWrite} onVerdict={handleVerdict} />
        ) : null}
        {tab === "skills" ? (
          <SkillsView skills={data.skills} tracks={data.tracks} reviews={data.reviews} media={data.media}
            threshold={threshold} canWrite={canWrite} onOpen={setOpenSkill}
            onAdd={() => { setEditing(null); setEditorOpen(true); }} />
        ) : null}
        {tab === "export" ? (
          <ExportView skills={data.skills} reviews={data.reviews} threshold={threshold}
            range={range} setRange={setRange} scope={scope} setScope={setScope}
            onPrint={() => setTimeout(() => window.print(), 60)} />
        ) : null}
        {tab === "settings" ? (
          <SettingsView profile={data.profile} session={session} settings={data.settings} canWrite={canWrite}
            onThreshold={setThreshold} queue={queue} syncing={syncing} onRetry={drain}
            onSignOut={async () => {
              if (demo) {
                if (!confirm("Leave the demo and clear its sample data?")) return;
                localStorage.removeItem(DEMO_KEY);
                setDemo(null);
                return;
              }
              if (queue.length && !confirm(queue.length + " change(s) have not synced yet. Sign out anyway? They stay on this device.")) return;
              await getClient().auth.signOut();
            }} />
        ) : null}

        {toast ? (
          <div className="fixed bottom-24 left-4 right-4 z-40 rounded-2xl bg-slate-900 px-4 py-3.5 text-[15px] font-semibold text-white shadow-lg">
            {toast}
          </div>
        ) : null}

        <nav className="fixed bottom-0 left-0 right-0 z-30 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)]">
          <div className="mx-auto flex max-w-xl">
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={cx("flex flex-1 flex-col items-center gap-1 py-2.5", tab === t.id ? "text-slate-900" : "text-slate-400")}>
                <Icon name={t.icon} size={23} strokeWidth={tab === t.id ? 2.4 : 1.9} />
                <span className="text-[11px] font-bold uppercase tracking-wide">{t.label}</span>
              </button>
            ))}
          </div>
        </nav>

        <SkillDetail skill={skill} tracks={data.tracks} reviews={data.reviews} media={data.media} threshold={threshold}
          canWrite={canWrite} signedUrls={signedUrls}
          onClose={() => setOpenSkill(null)}
          onReopen={reopen}
          onEdit={(s) => { setEditing(s); setEditorOpen(true); setOpenSkill(null); }}
          onArchive={archiveSkill}
          onVerdict={handleVerdict}
          onAddMedia={(s, mode) => { setMediaFor(s); setMediaMode(mode); }} />

        <SkillEditor open={editorOpen} initial={editing} initialDisciplines={editingDiscs} avoidList={avoidList}
          online={online} onClose={() => { setEditorOpen(false); setEditing(null); }} onSave={saveSkill} />

        <MediaEditor open={!!mediaFor} mode={mediaMode} skill={mediaFor} online={online}
          onClose={() => setMediaFor(null)} onSavePhoto={savePhoto} onSaveLink={saveLink} />
      </div>

      <PrintDoc skills={data.skills} tracks={data.tracks} reviews={data.reviews} media={data.media}
        threshold={threshold} range={range} scope={scope} />
    </>
  );
}

const rootEl = document.getElementById("root");
const boot = document.getElementById("boot");
if (boot) boot.style.display = "none";
ReactDOM.createRoot(rootEl).render(
  <Guard>
    <App />
  </Guard>
);

</script>
</body>
</html>
