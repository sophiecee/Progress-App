function showFailure(title, detail) {
  var d = document.createElement('div');
  d.setAttribute('style',
    'position:fixed;inset:0;z-index:99999;overflow:auto;background:#fff;color:#7f1d1d;' +
    'font-family:ui-monospace,monospace;font-size:13px;padding:20px;white-space:pre-wrap;word-break:break-word');
  d.textContent = title + '\n\n' + detail;
  document.body.appendChild(d);
}
window.addEventListener('error', function (e) {
  showFailure('Something failed to load:',
    (e.message || e) + '\n' + (e.filename || '') + '\nline ' + (e.lineno || '') + ':' + (e.colno || ''));
});
window.addEventListener('unhandledrejection', function (e) {
  showFailure('A background task failed:', (e.reason && e.reason.message) || String(e.reason));
});

    showFailure('The app never started.',
      'React loaded: ' + (typeof React !== 'undefined') +
      '\nReactDOM loaded: ' + (typeof ReactDOM !== 'undefined') +

}, 8000);

/* Icons are drawn from lucide, loaded from a CDN. If it fails to load the app
   still works, the little pictures just go blank. */
function LucideIcon({ name, size = 16, className = "", strokeWidth = 2, ...rest }) {
  /* lucide stores each icon as ["svg", {attrs}, [ [tag, attrs], ... ] ] */
  let parts = [];
  try {
    const icon = window.lucide && window.lucide.icons && window.lucide.icons[name];
    if (Array.isArray(icon) && Array.isArray(icon[2])) parts = icon[2];
  } catch (e) { parts = []; }

  const children = parts.map(function (part, i) {
    if (!Array.isArray(part) || typeof part[0] !== "string") return null;
    const attrs = part[1] && typeof part[1] === "object" ? part[1] : {};
    return React.createElement(part[0], { key: i, ...attrs });
  }).filter(Boolean);

  return React.createElement(
    "svg",
    { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
      strokeWidth, strokeLinecap: "round", strokeLinejoin: "round", className, ...rest },
    children
  );
}

/* ------------------- pasting in an old packing list ------------------
   Handles the shape Google Tasks lists come out in: headings that may or
   may not end in a colon, quantities written as "x3" / "X2" / "7 bottles"
   (sometimes glued straight onto the name), and parenthetical asides that
   are really notes rather than part of the item name. */
const HEADING_WORDS = [
  "downstairs", "upstairs", "kitchen", "meds", "medicine", "medication",
  "bathroom", "bedroom", "living room", "hallway", "utility", "garage",
  "shed", "fridge", "freezer", "nursery", "car", "loft", "conservatory",
  "bag", "suitcase", "rucksack", "backpack", "box",
];

function looksLikeHeading(line) {
  const t = line.trim();
  if (!t) return false;
  if (t.endsWith(":")) return true;
  const low = t.toLowerCase().replace(/:$/, "");
  if (t.split(/\s+/).length <= 4 && HEADING_WORDS.some((h) => low.includes(h))) {
    if (!/[xX]\s*\d+\s*$/.test(t) && !/\(/.test(t)) return true;
  }
  return false;
}

function parseListItem(raw) {
  let line = raw.trim().replace(/^[-*•\u2022]\s*/, "");
  let quantity = 1;
  let notes = "";
  const paren = line.match(/\(([^)]*)\)/);
  if (paren) { notes = paren[1].trim(); line = line.replace(paren[0], "").trim(); }
  const trailing = line.match(/[xX]\s*(\d+)\s*$/);
  if (trailing) { quantity = parseInt(trailing[1], 10); line = line.slice(0, trailing.index).trim(); }
  const leading = line.match(/^(\d+)\s+(.*)$/);
  if (leading && quantity === 1) { quantity = parseInt(leading[1], 10); line = leading[2].trim(); }
  line = line.replace(/[,\-–]\s*$/, "").trim();
  return { name: line, quantity, notes };
}

function parsePastedList(text) {
  const groups = [];
  let current = { heading: "Unsorted", items: [] };
  text.split(/\r?\n/).forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    if (looksLikeHeading(line)) {
      if (current.items.length) groups.push(current);
      current = { heading: line.replace(/:$/, "").trim(), items: [] };
    } else {
      const parsed = parseListItem(line);
      if (parsed.name) current.items.push(parsed);
    }
  });
  if (current.items.length) groups.push(current);
  return groups;
}

/* --------------------------- supabase REST -------------------------- */

function makeClient(url, key) {
  const base = url.replace(/\/$/, "");
  const h = { apikey: key, Authorization: `Bearer ${key}`, "Content-Type": "application/json" };
  const go = async (path, opts = {}) => {
    const res = await fetch(`${base}/rest/v1/${path}`, { ...opts, headers: { ...h, ...(opts.headers || {}) } });
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  };
  return {
    all: (table) => go(`${table}?select=*`),
    insert: (table, rows) => go(table, { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(rows) }),
    update: (table, id, patch) => go(`${table}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) }),
    remove: (table, id) => go(`${table}?id=eq.${id}`, { method: "DELETE" }),
  };
}

async function callClaude(prompt, maxTokens = 1000) {
  const apiKey = (await store.get("anthropic-key")) || "";
  if (!apiKey) throw new Error("Add your Anthropic API key in Settings first — the AI features need it.");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens, messages: [{ role: "user", content: prompt }] }),
  });
  if (res.status === 401) throw new Error("That Anthropic API key was rejected. Check it in Settings.");
  if (!res.ok) throw new Error("The AI request failed. Try again in a moment.");
  const data = await res.json();
  const text = (data.content || []).map((c) => c.text || "").join("");
  const s = text.indexOf("[");
  if (s === -1) throw new Error("The AI reply couldn't be read. Try again.");

  let end = text.lastIndexOf("]");
  let slice = end > s ? text.slice(s, end + 1) : text.slice(s);
  try {
    return JSON.parse(slice);
  } catch (e) {
    /* Reply likely got cut off mid-object. Drop back to the last complete
       item — the last "}," or "}" before the break — and close the array. */
    let cut = slice.lastIndexOf("},");
    if (cut === -1) cut = slice.lastIndexOf("}");
    if (cut === -1) throw new Error("The AI reply couldn't be read. Try again.");
    const repaired = slice.slice(0, cut + 1) + "]";
    try {
      return JSON.parse(repaired);
    } catch (e2) {
      throw new Error("The AI reply couldn't be read. Try again.");
    }
  }
}

    const when = t.created_at ? String(t.created_at).slice(0, 10) : "date unknown";
    const bits = [
      `${t.month}`, `${t.days} days`, `by ${t.transport}`,
      t.accommodation ? t.accommodation : null,
      t.international ? "international" : "domestic",
      t.nights_en_route ? `${t.nights_en_route} night(s) in temporary accommodation en route` : null,
    ].filter(Boolean).join(", ");
    let line = `- "${t.name}" [logged ${when}] (${bits}): ${names || "no items"}`;
    if (t.review) {
      try {
        const r = JSON.parse(t.review);
        line += `\n  AFTERWARDS: bags used: ${r.bags_used || "?"}. Not used: ${r.unused || "none"}. Wished we'd had: ${r.missing || "nothing"}. Worked well: ${r.what_worked || ""}. ${r.notes || ""}`;
      } catch {}
    }
    return line;
  }).join("\n");

- Accommodation: ${accommodation || "not specified"}
- ${international ? "INTERNATIONAL — passports, birth certificates, travel insurance, international breakdown cover, EU plug adaptors all matter" : "Domestic"}
- ${nightsEnRoute ? `${nightsEnRoute} night(s) in temporary accommodation on the way out — that much needs to be reachable in the overnight grab bag, not buried` : "No overnight stops en route"}

CHILDREN'S NEEDS: ${needs || "not specified"}

PAST TRIPS (most recently logged first), with what they said afterwards:
${history || "No past trips recorded yet."}

HOW TO WEIGH THE PAST TRIPS — this matters more than volume:
- For CLOTHING, footwear and weather gear: weight by SEASON above all. A trip in a similar month is far more informative than a recent one in a different season.
- For LOGISTICS and bulk (what fits, what travels how): weight by TRANSPORT and accommodation type. A car trip two years ago beats a flight last month. Self-catering needs food prep kit that a hotel does not.
- For MEDICATION, feeding equipment and anything clinical: weight by RECENCY above all. The children's needs change constantly, so the most recent trip is the best guide even if the season and transport are wrong.
- For QUANTITIES: scale to ${days} days, and note that consumables (nappies, wipes, feeds, medication doses) scale linearly while equipment does not.
- If a past trip's notes say something came home unused, don't suggest it again unless season or transport makes it newly relevant.
- If a past trip's notes say they wished they'd had something, include it.

ALWAYS INCLUDE, on every trip, regardless of history:
- An overnight grab bag holding everything needed before the main luggage is opened
- A cabin/close-by bag for entertainment and immediate needs during the journey
- The nappy/changing bag

Return ONLY a JSON array, no prose, no fences. Up to 45 objects. Compact keys:
n = item name (short)
r = source room, ONLY from: ${rooms.join(", ")}
b = target bag, ONLY from: ${bags.join(", ")}
q = quantity (number)
p = true only if it is prescription medication
l = true only if it can't be packed until the morning (fridge, freezer, charging, in daily use)
x = short note, only where it genuinely helps. Empty string otherwise.`, 2600);
  return raw.map((o) => ({
    name: String(o.n || "").slice(0, 80),
    room_source: o.r || rooms[0],
    assigned_bag: o.b || bags[0],
    quantity: Number(o.q) || 1,
    is_prescription: !!o.p,
    last_minute: !!o.l,
    notes_or_special_instructions: o.x || "",
  })).filter((i) => i.name);
}

async function draftJobs({ month, days, transport, needs, history, kind }) {
  const kindBrief = {
    sort: "admin and arrangements to sort in the weeks before leaving — bookings, assistance, equipment fixings, insurance, medical letters, pet care, prescriptions",
    buy: "things to buy or reorder before leaving",
    leaving: "the final checks in the last ten minutes before leaving the house, in the order you'd do them",
  }[kind];
  const raw = await callClaude(`A family with two adults and two children with special needs is going away: ${month}, ${days} days, by ${transport}.
CHILDREN'S NEEDS: ${needs || "not specified"}
PAST TRIPS AND WHAT THEY LEARNED:
${history || "none"}

List ${kindBrief}.
Return ONLY a JSON array, max 14 objects, keys: t = short task title, x = short note or empty string. No prose, no fences.`, 700);
  return raw.map((o) => ({ title: String(o.t || "").slice(0, 90), notes: o.x || "" })).filter((t) => t.title);
}

/* ---------------------------- UI atoms ----------------------------- */

const inputCls = "w-full rounded-xl border-2 border-slate-300 bg-white px-3 py-3 text-base text-slate-900 focus:border-teal-600 focus:outline-none";
const btn = "flex items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-bold transition active:scale-95";

const Field = ({ label, children }) => (
  <label className="mb-4 block">
    <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500">{label}</span>
    {children}
  </label>
);

/* A real dropdown of existing names, plus a one-tap way to add a brand new
   one — datalist inputs don't show their options until you start typing,
   which is why this exists instead. */
function PickOrAdd({ value, options, onChange, placeholder }) {
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState("");
  if (adding) {
    return (
      <div className="flex gap-2">
        <input
          autoFocus
          className={inputCls}
          placeholder={placeholder || "New name"}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter" && draft.trim()) { onChange(draft.trim()); setAdding(false); setDraft(""); }
            if (e.key === "Escape") { setAdding(false); setDraft(""); }
          }}
        />
        <button
          onClick={() => { if (draft.trim()) { onChange(draft.trim()); setAdding(false); setDraft(""); } }}
          className={`${btn} shrink-0 bg-slate-900 px-4 text-white`}
        >
          <Check size={16} strokeWidth={3} />
        </button>
        <button onClick={() => { setAdding(false); setDraft(""); }} className={`${btn} shrink-0 border-2 border-slate-300 bg-white px-4`}>
          <X size={16} />
        </button>
      </div>
    );
  }
  return (
    <select
      className={inputCls}
      value={options.includes(value) ? value : ""}
      onChange={(e) => { if (e.target.value === "__add__") setAdding(true); else onChange(e.target.value); }}
    >
      {!options.includes(value) && value && <option value="">{value} (not in list)</option>}
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
      <option value="__add__">+ Add new…</option>
    </select>
  );
}

/* A quantity stepper that never fights the person typing — the box can sit
   empty while editing, and only snaps back to 1 once they look away. */
function QuantityInput({ value, onChange }) {
  const [text, setText] = useState(String(value));
  useEffect(() => { setText(String(value)); }, [value]);
  const step = (delta) => onChange(Math.max(1, (Number(value) || 1) + delta));
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => step(-1)} className="rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-lg font-bold" aria-label="Decrease">−</button>
      <input
        type="number"
        min="1"
        className={`${inputCls} text-center`}
        value={text}
        onChange={(e) => setText(e.target.value)}
        onBlur={() => { const n = parseInt(text, 10); onChange(n > 0 ? n : 1); setText(String(n > 0 ? n : 1)); }}
      />
      <button onClick={() => step(1)} className="rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-lg font-bold" aria-label="Increase">+</button>
    </div>
  );
}

function Sheet({ open, title, onClose, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex flex-col justify-end bg-slate-900 bg-opacity-50">
      <div className="max-h-full w-full overflow-y-auto rounded-t-3xl border-t-4 border-slate-900 bg-slate-50 pb-12">
        <div className="sticky top-0 z-10 flex items-center justify-between border-b-2 border-slate-200 bg-slate-50 px-4 py-3">
          <h2 className="text-base font-bold">{title}</h2>
          <button onClick={onClose} className="rounded-full border-2 border-slate-300 p-2 text-slate-600" aria-label="Close"><X size={18} /></button>
        </div>
        <div className="px-4 py-4">{children}</div>
      </div>
    </div>
  );
}

function Meter({ done, total }) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return (
    <div className="flex items-center gap-3">
      <div className="h-2 flex-1 overflow-hidden rounded-full bg-slate-200">
        <div className="h-full rounded-full bg-teal-600 transition-all duration-500" style={{ width: `${pct}%` }} />
      </div>
      <span className="w-14 text-right text-xs font-bold tabular-nums text-slate-500">{done}/{total}</span>
    </div>
  );
}

const initials = (n) => (n || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();

function PackerDot({ name, onClick }) {
  if (!name) return null;
  const tone = { 0: "bg-slate-900", 1: "bg-teal-700", 2: "bg-slate-400", 3: "bg-amber-600", 4: "bg-slate-600" };
  const idx = Math.abs([...name].reduce((a, c) => a + c.charCodeAt(0), 0)) % 5;
  return (
    <button onClick={onClick} title={name}
      className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold text-white ${tone[idx]}`}>
      {initials(name)}
    </button>
  );
}

/* ------------------------------- app ------------------------------- */

function App() {
  const seed = useRef(demoSeed()).current;

  const [settings, setSettings] = useState({ url: "", key: "" });
  const [client, setClient] = useState(null);
  const [status, setStatus] = useState("demo");
  const [statusMsg, setStatusMsg] = useState("");
  const [busy, setBusy] = useState("");

  const [trips, setTrips] = useState(seed.trips);
  const [items, setItems] = useState(seed.items);
  const [tasks, setTasks] = useState(seed.tasks);
  const [contacts, setContacts] = useState(seed.contacts);
  const [photos, setPhotos] = useState(seed.photos);
  const [activeTripId, setActiveTripId] = useState(seed.activeTripId);

  const [rooms, setRooms] = useState(DEFAULT_ROOMS);
  const [bags, setBags] = useState(DEFAULT_BAGS);
  const [packers, setPackers] = useState(DEFAULT_PACKERS);
  const [me, setMe] = useState("Me");

  const [tab, setTab] = useState("list");
  const [view, setView] = useState("gather");
  const [filterPacker, setFilterPacker] = useState("all");
  const [hidePacked, setHidePacked] = useState(false);
  const [search, setSearch] = useState("");
  const [collapsed, setCollapsed] = useState({});

  const [sheet, setSheet] = useState(null); // settings | lists | newtrip | past | add | review | rx | photo
  const [editing, setEditing] = useState(null);
  const [assigning, setAssigning] = useState(null);
  const recentEdits = useRef(new Map());

  /* --- saved preferences --- */
  useEffect(() => {
    (async () => {
      const s = await store.get("supabase-settings");
      if (s?.url && s?.key) { setSettings(s); connect(s.url, s.key); }
      const p = await store.get("place-names");
      if (p) {
        if (p.rooms?.length) setRooms(p.rooms);
        if (p.bags?.length) setBags(p.bags);
        if (p.packers?.length) setPackers(p.packers);
        if (p.me) setMe(p.me);
      }
    })();
  }, []);

  const savePlaces = async (next) => {
    if (next.rooms) setRooms(next.rooms);
    if (next.bags) setBags(next.bags);
    if (next.packers) setPackers(next.packers);
    if (next.me) setMe(next.me);
    await store.set("place-names", { rooms, bags, packers, me, ...next });
  };

  const connect = useCallback(async (url, key) => {
    setBusy("connect");
    try {
      const c = makeClient(url, key);
      const [t, i, k, ct, ph] = await Promise.all([
        c.all("trips"), c.all("items"), c.all("tasks"), c.all("contacts"), c.all("photos"),
      ]);
      setClient(c);
      setTrips((t || []).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")));
      setItems(i || []); setTasks(k || []); setContacts(ct || []); setPhotos(ph || []);
      setActiveTripId((t || [])[0]?.id ?? null);
      setStatus("live"); setStatusMsg("");
      await store.set("supabase-settings", { url, key });
    } catch (e) {
      setStatus("error");
      const raw = String(e?.message || e);
      let hint = "";
      if (/Failed to fetch|NetworkError|Load failed/i.test(raw)) hint = "The URL didn't resolve at all — check it's exactly the Project URL, ending in .supabase.co";
      else if (/JWT|apikey|Invalid API key|401|403/i.test(raw)) hint = "The project was found, but the key was rejected. Use the publishable key (sb_publishable_…) or the legacy anon key.";
      else if (/does not exist|42P01|404|Not Found/i.test(raw)) hint = "Connected fine, but a table is missing. Re-run the setup SQL.";
      setStatusMsg(`${hint || "Couldn't connect."}\n\nExact error: ${raw.slice(0, 300)}`);
    }
    setBusy("");
  }, []);

  /* --- keep both phones in step --- */
  useEffect(() => {
    if (!client) return;
    const tick = setInterval(async () => {
      if (readQueue().length) return; // don't pull server state over unsent local changes
      try {
        const [i, k, ct, t, ph] = await Promise.all([
          client.all("items"), client.all("tasks"), client.all("contacts"), client.all("trips"), client.all("photos"),
        ]);
        const now = Date.now();
        const keepMine = (fresh, prev) => {
          const held = new Map();
          prev.forEach((x) => { const ts = recentEdits.current.get(x.id); if (ts && now - ts < 6000) held.set(x.id, x); });
          return (fresh || []).map((x) => held.get(x.id) || x);
        };
        setItems((p) => keepMine(i, p));
        setTasks((p) => keepMine(k, p));
        setContacts((p) => keepMine(ct, p));
        setTrips((p) => keepMine(t, p).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")));
        setPhotos(ph || []);
      } catch { /* next tick will catch up */ }
    }, 4000);
    return () => clearInterval(tick);
  }, [client]);

  /* --- offline-safe writes ---
     Every write updates the screen immediately, then either goes straight
     to Supabase or, if that fails (no signal, tunnel, etc.), is dropped into
     a queue saved in localStorage. A background loop keeps trying that queue
     every few seconds until it's empty, so nothing typed on a train is ever
     silently lost — it just waits. */
  const setters = { items: setItems, tasks: setTasks, contacts: setContacts, trips: setTrips, photos: setPhotos };
  const [pendingCount, setPendingCount] = useState(0);
  const [syncState, setSyncState] = useState("idle"); // idle | pending | error

  const setQueue = (q) => { writeQueue(q); setPendingCount(q.length); };
  const enqueue = (op) => setQueue([...readQueue(), { ...op, queuedAt: Date.now() }]);

  useEffect(() => { setPendingCount(readQueue().length); }, []);

  const runOp = async (op) => {
    if (op.kind === "update") await client.update(op.table, op.id, op.patch);
    else if (op.kind === "insert") await client.insert(op.table, op.rows);
    else if (op.kind === "delete") await client.remove(op.table, op.id);
  };

  const drainQueue = useCallback(async () => {
    if (!client) return;
    let q = readQueue();
    if (!q.length) { setSyncState("idle"); return; }
    setSyncState("pending");
    while (q.length) {
      try {
        await runOp(q[0]);
        q = q.slice(1);
        setQueue(q);
      } catch (e) {
        setSyncState("error");
        return; // stop here, retry from the same failed op next time
      }
    }
    setSyncState("idle");
  }, [client]);

  useEffect(() => {
    if (!client) return;
    drainQueue();
    const onOnline = () => drainQueue();
    window.addEventListener("online", onOnline);
    const retry = setInterval(drainQueue, 5000);
    return () => { window.removeEventListener("online", onOnline); clearInterval(retry); };
  }, [client, drainQueue]);

  const patch = async (table, id, p) => {
    recentEdits.current.set(id, Date.now());
    setters[table]((prev) => prev.map((r) => (r.id === id ? { ...r, ...p } : r)));
    if (!client) return;
    try { await client.update(table, id, p); }
    catch { enqueue({ kind: "update", table, id, patch: p }); drainQueue(); }
  };
  const drop = async (table, id) => {
    setters[table]((prev) => prev.filter((r) => r.id !== id));
    if (!client) return;
    try { await client.remove(table, id); }
    catch { enqueue({ kind: "delete", table, id }); drainQueue(); }
  };
  const add = async (table, rows, defaults = {}) => {
    const full = rows.map((r) => ({ id: uid(), trip_id: activeTripId, ...defaults, ...r }));
    setters[table]((prev) => [...prev, ...full]);
    if (!client) return full;
    try { await client.insert(table, full); }
    catch { enqueue({ kind: "insert", table, rows: full }); drainQueue(); }
    return full;
  };

  const addItems = async (rows, tripId = activeTripId) =>
    add("items", rows.map((r) => ({
      trip_id: tripId, is_packed: false, quantity: 1, notes_or_special_instructions: "",
      packer: "Either of us", is_flagged: false, flag_note: "", is_prescription: false,
      last_minute: false, room_source: rooms[0], assigned_bag: bags[0], ...r,
    })));

  const addTrip = async (t) => {
    const trip = { id: uid(), created_at: new Date().toISOString(), review: null, ...t };
    setTrips((p) => [trip, ...p]);
    setActiveTripId(trip.id);
    if (client) { try { await client.insert("trips", [trip]); } catch {} }
    return trip;
  };

  const renameEverywhere = async (field, from, to) => {
    const hits = items.filter((i) => i[field] === from);
    setItems((p) => p.map((i) => (i[field] === from ? { ...i, [field]: to } : i)));
    if (client) for (const i of hits) { try { await client.update("items", i.id, { [field]: to }); } catch {} }
    return hits.length;
  };
  const countUsing = (field, v) => items.filter((i) => i[field] === v).length;

  const bulkPacker = async (list, packer) => {
    const ids = new Set(list.map((i) => i.id));
    setItems((p) => p.map((i) => (ids.has(i.id) ? { ...i, packer } : i)));
    if (client) for (const i of list) { try { await client.update("items", i.id, { packer }); } catch {} }
  };

  const resetTicks = async () => {
    const hits = items.filter((i) => i.trip_id === activeTripId && i.is_packed);
    setItems((p) => p.map((i) => (i.trip_id === activeTripId ? { ...i, is_packed: false } : i)));
    if (client) for (const i of hits) { try { await client.update("items", i.id, { is_packed: false }); } catch {} }
  };

  const copyWholeTrip = async (srcId) => {
    const src = trips.find((t) => t.id === srcId);
    if (!src) return;
    const t = await addTrip({ name: `${src.name} (again)`, month: src.month, days: src.days, transport: src.transport, notes: src.notes });
    await addItems(items.filter((i) => i.trip_id === srcId).map((i) => ({
      name: i.name, room_source: i.room_source, assigned_bag: i.assigned_bag, quantity: i.quantity,
      notes_or_special_instructions: i.notes_or_special_instructions, packer: i.packer,
      is_prescription: i.is_prescription, last_minute: i.last_minute,
    })), t.id);
    const srcTasks = tasks.filter((x) => x.trip_id === srcId);
    if (srcTasks.length) {
      const rows = srcTasks.map((x) => ({ id: uid(), trip_id: t.id, kind: x.kind, title: x.title, notes: x.notes, done: false, packer: x.packer, position: x.position }));
      setTasks((p) => [...p, ...rows]);
      if (client) { try { await client.insert("tasks", rows); } catch {} }
    }
    const srcContacts = contacts.filter((c) => c.trip_id === srcId);
    if (srcContacts.length) {
      const rows = srcContacts.map((c) => ({ ...c, id: uid(), trip_id: t.id }));
      setContacts((p) => [...p, ...rows]);
      if (client) { try { await client.insert("contacts", rows); } catch {} }
    }
  };

  /* --- derived --- */
  const activeTrip = trips.find((t) => t.id === activeTripId) || null;
  const tripItems = useMemo(() => items.filter((i) => i.trip_id === activeTripId), [items, activeTripId]);
  const tripTasks = useMemo(() => tasks.filter((t) => t.trip_id === activeTripId), [tasks, activeTripId]);
  const tripContacts = useMemo(() => contacts.filter((c) => c.trip_id === activeTripId), [contacts, activeTripId]);
  const packedCount = tripItems.filter((i) => i.is_packed).length;
  const flagged = tripItems.filter((i) => i.is_flagged);

  const visible = useMemo(() => {
    let list = view === "manifest" ? tripItems.filter((i) => i.is_packed) : tripItems;
    if (filterPacker !== "all") list = list.filter((i) => i.packer === filterPacker || i.packer === "Either of us");
    if (hidePacked && view !== "manifest") list = list.filter((i) => !i.is_packed);
    const q = search.trim().toLowerCase();
    if (q) list = list.filter((i) => (i.name + " " + (i.notes_or_special_instructions || "")).toLowerCase().includes(q));
    return list;
  }, [tripItems, view, filterPacker, hidePacked, search]);

  const groups = useMemo(() => {
    const order = view === "gather" ? rooms : bags;
    const keyOf = (i) => (view === "gather" ? i.room_source || "Unsorted" : i.assigned_bag || "No bag yet");
    const map = new Map();
    visible.forEach((i) => { const k = keyOf(i); if (!map.has(k)) map.set(k, []); map.get(k).push(i); });
    return [...map.entries()].sort((a, b) => {
      const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a[0].localeCompare(b[0]);
    });
  }, [visible, view, rooms, bags]);

  const jobCounts = JOB_KINDS.map((k) => {
    const l = tripTasks.filter((t) => t.kind === k.id);
    return { ...k, done: l.filter((t) => t.done).length, total: l.length };
  });

  /* ------------------------------ render ---------------------------- */

  return (
    <div className="min-h-screen bg-slate-100 font-sans text-slate-900">
      <div className="mx-auto max-w-2xl pb-24">

        <header className="border-b-2 border-slate-900 bg-white px-4 pb-3 pt-4">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <p className="text-xs font-bold uppercase tracking-widest text-teal-700">Packing for</p>
              <h1 className="truncate text-xl font-bold tracking-tight">{activeTrip ? activeTrip.name : "No trip yet"}</h1>
              {activeTrip && <p className="text-xs text-slate-500">{activeTrip.month} · {activeTrip.days} days · {activeTrip.transport}</p>}
            </div>
            <div className="flex shrink-0 gap-2">
              <button onClick={() => setSheet("newtrip")} className="rounded-xl border-2 border-slate-300 p-2.5" aria-label="New trip"><Sparkles size={18} /></button>
              <button onClick={() => setSheet("past")} className="rounded-xl border-2 border-slate-300 p-2.5" aria-label="Trips"><History size={18} /></button>
              <button onClick={() => setSheet("settings")} className="rounded-xl border-2 border-slate-300 p-2.5" aria-label="Settings"><Settings size={18} /></button>
            </div>
          </div>
          <div className="mt-3"><Meter done={packedCount} total={tripItems.length} /></div>
          <div className="mt-2 flex items-center gap-2 text-xs font-semibold">
            {status === "live"
              ? <><Wifi size={13} className="text-teal-700" /><span className="text-teal-700">Synced</span></>
              : <><WifiOff size={13} className="text-amber-600" /><span className="text-amber-700">Demo mode — this device only</span></>}
            {status === "live" && pendingCount > 0 && (
              <span className="flex items-center gap-1 rounded-md bg-amber-100 px-2 py-0.5 text-amber-800">
                <CloudOff size={12} /> {pendingCount} waiting to sync
              </span>
            )}
            {flagged.length > 0 && (
              <span className="ml-auto flex items-center gap-1 rounded-md bg-amber-100 px-2 py-0.5 text-amber-800">
                <Flag size={12} /> {flagged.length} flagged
              </span>
            )}
          </div>
        </header>

        {tab === "list" && (
          <>
            <div className="sticky top-0 z-30 border-b-2 border-slate-900 bg-slate-100 px-3 pb-2 pt-2">
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: "gather", label: "Gather", sub: "by room", Icon: Home },

                ].map(({ id, label, sub, Icon }) => (
                  <button key={id} onClick={() => setView(id)}
                    className={`rounded-lg border-2 px-2 py-2 text-center ${view === id ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                    <Icon size={15} className="mx-auto" />
                    <div className="text-xs font-bold leading-tight">{label}</div>
                    <div className="text-xs leading-tight opacity-70">{sub}</div>
                  </button>
                ))}
              </div>

              <div className="mt-2 flex items-center gap-2">
                <div className="relative flex-1">
                  <Search size={14} className="absolute left-2 top-2.5 text-slate-400" />
                  <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Find an item"
                    className="w-full rounded-lg border-2 border-slate-300 bg-white py-1.5 pl-7 pr-2 text-sm" />
                </div>
                <button onClick={() => setHidePacked(!hidePacked)}
                  className={`rounded-lg border-2 px-2 py-1.5 text-xs font-bold ${hidePacked ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                  {hidePacked ? "Showing to-do" : "Show all"}
                </button>
              </div>

              <div className="mt-2 flex gap-1 overflow-x-auto pb-1">
                {["all", ...packers].map((p) => (
                  <button key={p} onClick={() => setFilterPacker(p)}
                    className={`shrink-0 rounded-full border-2 px-3 py-1 text-xs font-bold ${filterPacker === p ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white text-slate-600"}`}>

                ))}

            </div>

            <main className="space-y-4 px-3 py-3">
              {!activeTrip && (
                <Empty title="Start with a trip." body="Tell the app when you're going and for how long, and it'll draft the list from what you packed before."
                  action={<button onClick={() => setSheet("newtrip")} className={`${btn} w-full bg-slate-900 text-white`}><Sparkles size={16} /> New trip</button>} />
              )}
              {activeTrip && groups.length === 0 && (
                <Empty title={view === "manifest" ? "Nothing packed yet." : search ? "Nothing matches." : "This list is empty."}
                  body={view === "manifest" ? "Tick items off and they'll appear here, sorted by bag." : "Add items yourself, or pull them in from a past trip."} />
              )}

              {groups.map(([label, list]) => (
                <Group
                  key={label} label={label} list={list} view={view}
                  collapsed={!!collapsed[view + label]}
                  toggle={() => setCollapsed({ ...collapsed, [view + label]: !collapsed[view + label] })}
                  onTick={(i) => patch("items", i.id, { is_packed: !i.is_packed })}
                  onOpen={setEditing}
                  onAssignGroup={() => setAssigning({ label, list })}
                  photo={view === "manifest" ? photos.find((p) => p.trip_id === activeTripId && p.bag === label) : null}
                  onPhoto={view === "manifest" ? () => setSheet({ kind: "photo", bag: label }) : null}
                />
              ))}
            </main>
          </>
        )}

        {tab === "jobs" && (
          <JobsScreen
            trip={activeTrip} tasks={tripTasks} packers={packers} counts={jobCounts}
            history={historyText(trips, items)}
            onToggle={(t) => patch("tasks", t.id, { done: !t.done })}
            onAdd={(kind, rows) => add("tasks", rows.map((r, n) => ({ kind, done: false, packer: "Either of us", position: Date.now() + n, ...r })))}
            onPatch={(id, p) => patch("tasks", id, p)}
            onDelete={(id) => drop("tasks", id)}
          />
        )}

        {tab === "info" && (
          <InfoScreen
            trip={activeTrip} contacts={tripContacts}
            onAdd={(rows) => add("contacts", rows)}
            onPatch={(id, p) => patch("contacts", id, p)}
            onDelete={(id) => drop("contacts", id)}
          />
        )}

        {tab === "after" && (
          <AfterScreen
            trip={activeTrip} items={tripItems}
            onSaveReview={(r) => patch("trips", activeTrip.id, { review: JSON.stringify(r) })}
            onPatchItem={(id, p) => patch("items", id, p)}
            onAddItem={(row) => addItems([{ ...row, is_prescription: true }])}
            rooms={rooms} bags={bags}
          />
        )}
      </div>

      {/* bottom navigation */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 border-t-2 border-slate-900 bg-white">
        <div className="mx-auto grid max-w-2xl grid-cols-5">
          {[
            { id: "list", label: "List", Icon: Luggage },
            { id: "jobs", label: "Jobs", Icon: ListChecks, badge: jobCounts.reduce((a, k) => a + (k.total - k.done), 0) },
            { id: "add", label: "Add", Icon: Plus },
            { id: "info", label: "Info", Icon: Phone },
            { id: "after", label: "After", Icon: BookOpen },
          ].map(({ id, label, Icon, badge }) => (
            <button key={id}
              onClick={() => (id === "add" ? setSheet("add") : setTab(id))}
              disabled={id === "add" && !activeTrip}
              className={`relative flex flex-col items-center gap-0.5 py-2.5 text-xs font-bold ${tab === id ? "text-teal-700" : "text-slate-500"}`}>
              <Icon size={20} />
              {label}
              {badge > 0 && <span className="absolute right-4 top-1 rounded-full bg-amber-500 px-1.5 text-xs text-white">{badge}</span>}
            </button>
          ))}
        </div>
      </nav>

      {/* sheets */}
      <EditItemSheet item={editing} rooms={rooms} bags={bags} packers={packers}
        onAddRoom={(name) => savePlaces({ rooms: [...rooms, name] })}
        onAddBag={(name) => savePlaces({ bags: [...bags, name] })}
        onClose={() => setEditing(null)}
        onSave={(p) => { patch("items", editing.id, p); setEditing(null); }}
        onDelete={() => { drop("items", editing.id); setEditing(null); }} />

      <AddItemSheet open={sheet === "add"} rooms={rooms} bags={bags} packers={packers}
        onPasteList={() => setSheet("import")}
        onAddRoom={(name) => savePlaces({ rooms: [...rooms, name] })}
        onAddBag={(name) => savePlaces({ bags: [...bags, name] })}
        onClose={() => setSheet(null)} onAdd={(r) => { addItems([r]); setSheet(null); }} />

      <AssignSheet group={assigning} packers={packers} onClose={() => setAssigning(null)}
        onPick={(p) => { bulkPacker(assigning.list, p); setAssigning(null); }} />

      <PhotoSheet open={sheet?.kind === "photo"} bag={sheet?.bag}
        photo={photos.find((p) => p.trip_id === activeTripId && p.bag === sheet?.bag)}
        onClose={() => setSheet(null)}
        onSave={async (dataUrl, caption) => {
          const existing = photos.find((p) => p.trip_id === activeTripId && p.bag === sheet.bag);
          if (existing) await patch("photos", existing.id, { data_url: dataUrl, caption });
          else await add("photos", [{ bag: sheet.bag, data_url: dataUrl, caption }]);
          setSheet(null);
        }}
        onDelete={async () => {
          const existing = photos.find((p) => p.trip_id === activeTripId && p.bag === sheet.bag);
          if (existing) await drop("photos", existing.id);
          setSheet(null);
        }} />

      <NewTripSheet open={sheet === "newtrip"} trips={trips} items={items} rooms={rooms} bags={bags}
        onClose={() => setSheet(null)}
        onCreate={async (trip, generated) => {
          const t = await addTrip(trip);
          if (generated?.length) await addItems(generated, t.id);
          setSheet(null); setTab("list"); setView("gather");
        }} />

      <ImportSheet open={sheet === "import"} rooms={rooms} bags={bags}
        onClose={() => setSheet(null)}
        onImport={(rows) => { addItems(rows); setSheet(null); setTab("list"); }} />

      <TripsSheet open={sheet === "past"} onNewTrip={() => setSheet("newtrip")} trips={trips} items={items} activeTripId={activeTripId}
        onClose={() => setSheet(null)}
        onSwitch={(id) => { setActiveTripId(id); setSheet(null); }}
        onCopyItems={(rows) => addItems(rows)}
        onCopyTrip={(id) => { copyWholeTrip(id); setSheet(null); }}
        onResetTicks={() => { resetTicks(); setSheet(null); }} />

      <ListsSheet open={sheet === "lists"} rooms={rooms} bags={bags} packers={packers} me={me}
        onClose={() => setSheet(null)} save={savePlaces}
        renameEverywhere={renameEverywhere} countUsing={countUsing} />

      <SettingsSheet open={sheet === "settings"} settings={settings} setSettings={setSettings}
        connect={connect} status={status} statusMsg={statusMsg} busy={busy === "connect"}
        onClose={() => setSheet(null)} onOpenLists={() => setSheet("lists")} />
    </div>
  );
}

/* --------------------------- list rendering ------------------------- */

function Group({ label, list, view, collapsed, toggle, onTick, onOpen, onAssignGroup, photo, onPhoto }) {
  const done = list.filter((i) => i.is_packed).length;
  const pct = list.length ? (done / list.length) * 100 : 0;
  const full = done === list.length;
  return (
    <section>
      <div className="sticky top-32 z-20 mb-1 overflow-hidden rounded-lg border-2 border-slate-900 bg-white">
        <div className={`absolute inset-y-0 left-0 transition-all duration-500 ${full ? "bg-teal-200" : "bg-teal-100"}`} style={{ width: `${pct}%` }} />
        <div className="relative flex items-center gap-2 px-2 py-2">
          <button onClick={toggle} className="flex min-w-0 flex-1 items-center gap-2 text-left">
            {collapsed ? <ChevronRight size={15} /> : <ChevronDown size={15} />}
            <span className="h-2 w-2 shrink-0 rounded-full border-2 border-slate-900 bg-slate-100" />
            <h3 className="truncate text-xs font-bold uppercase tracking-wider">{label}</h3>
            <span className="text-xs font-bold tabular-nums text-slate-600">{done}/{list.length}</span>
            {full && <Check size={13} strokeWidth={3} className="text-teal-700" />}
          </button>
          {onPhoto && (
            <button onClick={onPhoto} className="rounded-md border-2 border-slate-300 bg-white p-1.5 text-slate-600" aria-label="Photo of this bag">
              {photo ? <img src={photo.data_url} alt="" className="h-4 w-4 rounded object-cover" /> : <Camera size={14} />}
            </button>
          )}
          <button onClick={onAssignGroup} className="rounded-md border-2 border-slate-300 bg-white p-1.5 text-slate-600" aria-label="Assign this group">
            <UserRound size={14} />
          </button>
        </div>
      </div>

      {!collapsed && (
        <ul className="divide-y-2 divide-slate-100 overflow-hidden rounded-lg border-2 border-slate-300 bg-white">
          {list.map((item) => (
            <li key={item.id} className={`flex items-stretch ${item.is_flagged ? "border-l-4 border-amber-500" : ""}`}>
              <button onClick={() => onTick(item)}
                className={`flex w-12 shrink-0 items-center justify-center ${item.is_packed ? "bg-teal-600 text-white" : "bg-slate-50 text-slate-300"}`}
                aria-label={item.is_packed ? "Not packed" : "Packed"}>
                <Check size={20} strokeWidth={3} />
              </button>
              <button onClick={() => onOpen(item)} className="flex flex-1 items-center gap-2 px-2 py-2 text-left">
                <div className="min-w-0 flex-1">
                  <p className={`text-sm font-semibold leading-tight ${item.is_packed ? "text-slate-400 line-through" : ""}`}>
                    {item.name}
                    {item.quantity > 1 && <span className="ml-1 text-xs font-bold text-slate-500">×{item.quantity}</span>}
                    {item.is_prescription && <Pill size={12} className="ml-1 inline text-teal-700" />}
                    {item.last_minute && <Snowflake size={12} className="ml-1 inline text-sky-600" />}
                  </p>
                  <p className="truncate text-xs uppercase tracking-wide text-slate-400">
                    {view === "gather" ? item.assigned_bag || "No bag yet" : item.room_source || "Unsorted"}
                    {item.notes_or_special_instructions && <span className="ml-1 normal-case tracking-normal text-slate-500">· {item.notes_or_special_instructions}</span>}
                  </p>
                  {item.is_flagged && (
                    <p className="mt-0.5 flex items-center gap-1 text-xs font-semibold text-amber-700">
                      <Flag size={11} /> {item.flag_note || "Flagged"}
                    </p>
                  )}
                </div>
                <PackerDot name={item.packer} />
              </button>
            </li>
          ))}
        </ul>
      )}
    </section>
  );
}

/* ------------------------------- jobs ------------------------------- */

function JobsScreen({ trip, tasks, packers, counts, history, onToggle, onAdd, onPatch, onDelete }) {
  const [kind, setKind] = useState("sort");
  const [draftText, setDraftText] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [editing, setEditing] = useState(null);

  if (!trip) return <div className="p-4"><Empty title="No trip yet." body="Start a trip and the job lists live here." /></div>;

  const list = tasks.filter((t) => t.kind === kind).sort((a, b) => (a.position || 0) - (b.position || 0));
  const meta = JOB_KINDS.find((k) => k.id === kind);

  const suggest = async () => {
    setLoading(true); setErr("");
    try {
      const rows = await draftJobs({ month: trip.month, days: trip.days, transport: trip.transport, needs: trip.notes, history, kind });
      const have = new Set(list.map((t) => t.title.toLowerCase()));
      onAdd(kind, rows.filter((r) => !have.has(r.title.toLowerCase())));
    } catch (e) { setErr(e.message); }
    setLoading(false);
  };

  return (
    <div className="px-3 py-3">
      <div className="mb-3 grid grid-cols-3 gap-2">
        {counts.map((k) => (
          <button key={k.id} onClick={() => setKind(k.id)}
            className={`rounded-lg border-2 px-2 py-2 text-left ${kind === k.id ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white"}`}>
            <div className="text-xs font-bold leading-tight">{k.label}</div>
            <div className="text-xs opacity-70">{k.done}/{k.total} done</div>
          </button>
        ))}
      </div>
      <p className="mb-3 text-xs text-slate-500">{meta.blurb}</p>

      <ul className="mb-3 divide-y-2 divide-slate-100 overflow-hidden rounded-lg border-2 border-slate-300 bg-white">
        {list.map((t) => (
          <li key={t.id} className="flex items-stretch">
            <button onClick={() => onToggle(t)} className={`flex w-12 shrink-0 items-center justify-center ${t.done ? "bg-teal-600 text-white" : "bg-slate-50 text-slate-300"}`}>
              <Check size={20} strokeWidth={3} />
            </button>
            <button onClick={() => setEditing(t)} className="flex flex-1 items-center gap-2 px-2 py-2 text-left">
              <div className="min-w-0 flex-1">
                <p className={`text-sm font-semibold leading-tight ${t.done ? "text-slate-400 line-through" : ""}`}>{t.title}</p>
                {t.notes && <p className="truncate text-xs text-slate-500">{t.notes}</p>}
              </div>
              <PackerDot name={t.packer} />
            </button>
          </li>
        ))}
        {list.length === 0 && <li className="px-3 py-6 text-center text-sm text-slate-500">Nothing here yet.</li>}
      </ul>

      <div className="flex gap-2">
        <input className={inputCls} placeholder="Add a job" value={draftText} onChange={(e) => setDraftText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && draftText.trim()) { onAdd(kind, [{ title: draftText.trim(), notes: "" }]); setDraftText(""); } }} />
        <button onClick={() => { if (draftText.trim()) { onAdd(kind, [{ title: draftText.trim(), notes: "" }]); setDraftText(""); } }}
          className={`${btn} shrink-0 bg-slate-900 px-5 text-white`}><Plus size={18} /></button>
      </div>

      {err && <p className="mt-3 rounded-xl border-2 border-red-200 bg-red-50 p-3 text-sm font-semibold text-red-700">{err}</p>}
      <button onClick={suggest} disabled={loading} className={`${btn} mt-3 w-full border-2 border-teal-700 bg-white text-teal-800 disabled:opacity-60`}>
        {loading ? <><Loader2 size={16} className="animate-spin" /> Thinking…</> : <><Sparkles size={16} /> Suggest jobs for this trip</>}
      </button>

      <Sheet open={!!editing} title="Edit job" onClose={() => setEditing(null)}>
        {editing && (
          <>
            <Field label="Job"><input className={inputCls} value={editing.title} onChange={(e) => setEditing({ ...editing, title: e.target.value })} /></Field>
            <Field label="Note"><textarea rows="2" className={inputCls} value={editing.notes || ""} onChange={(e) => setEditing({ ...editing, notes: e.target.value })} /></Field>
            <Field label="Who's doing it">
              <div className="flex flex-wrap gap-2">
                {packers.map((p) => (
                  <button key={p} onClick={() => setEditing({ ...editing, packer: p })}
                    className={`rounded-full border-2 px-3 py-2 text-sm font-bold ${editing.packer === p ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white"}`}>{p}</button>
                ))}
              </div>
            </Field>
            <button onClick={() => { onPatch(editing.id, { title: editing.title, notes: editing.notes, packer: editing.packer }); setEditing(null); }}
              className={`${btn} w-full bg-slate-900 text-white`}>Save changes</button>
            <button onClick={() => { onDelete(editing.id); setEditing(null); }} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}>
              <Trash2 size={16} /> Delete job
            </button>
          </>
        )}
      </Sheet>
    </div>
  );
}

        <Plus size={16} /> Add a contact or booking

      <Sheet open={!!editing} title={editing?.id ? "Edit contact" : "Add contact"} onClose={() => setEditing(null)}>
        {editing && (
          <>

            <Field label="Type">
              <input list="cats" className={inputCls} value={editing.category} onChange={(e) => setEditing({ ...editing, category: e.target.value })} />
              <datalist id="cats">
                {["Where we're staying", "Transport", "Medical", "Home", "Equipment hire", "Other"].map((c) => <option key={c} value={c} />)}
              </datalist>
            </Field>
            <Field label="Phone"><input type="tel" className={inputCls} value={editing.phone} onChange={(e) => setEditing({ ...editing, phone: e.target.value })} /></Field>
            <Field label="Booking reference or key detail"><input className={inputCls} value={editing.reference} onChange={(e) => setEditing({ ...editing, reference: e.target.value })} placeholder="Booking SVC-88214, arrive after 4pm" /></Field>
            <Field label="Notes"><textarea rows="3" className={inputCls} value={editing.notes} onChange={(e) => setEditing({ ...editing, notes: e.target.value })} placeholder="Key safe code, step-free access, parking" /></Field>
            <button
              onClick={() => {
                const { id, ...rest } = editing;
                if (id) onPatch(id, rest); else onAdd([rest]);
                setEditing(null);
              }}
              disabled={!editing.label.trim()}
              className={`${btn} w-full bg-slate-900 text-white disabled:opacity-40`}>Save</button>
            {editing.id && (
              <button onClick={() => { onDelete(editing.id); setEditing(null); }} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}>

              </button>

          </>
        )}
      </Sheet>

const REVIEW_PROMPTS = [
  { key: "bags_used", label: "Which bags did we actually take?", hint: "List them. Next time's suggestions start from this." },
  { key: "unused", label: "What came home unused?", hint: "The stuff to leave behind next time." },
  { key: "missing", label: "What did we wish we'd had?", hint: "The single most useful box here." },
  { key: "what_worked", label: "What worked, for the kids especially?", hint: "Routines, seating, timings, which bag things lived in." },
  { key: "notes", label: "Anything else to remember", hint: "Lead times, access, staff, journey notes." },
];

function AfterScreen({ trip, items, onSaveReview, onPatchItem, onAddItem, rooms, bags }) {
  const [section, setSection] = useState("rx");
  const [review, setReview] = useState({});
  const [saveState, setSaveState] = useState("idle"); // idle | pending | saved
  const [newRx, setNewRx] = useState("");
  const saveTimer = useRef(null);

  useEffect(() => {
    if (!trip) return;
    try { setReview(trip.review ? JSON.parse(trip.review) : {}); } catch { setReview({}); }
    setSaveState("idle");
  }, [trip?.id]);

  const updateField = (key, value) => {
    const next = { ...review, [key]: value };
    setReview(next);
    setSaveState("pending");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      onSaveReview(next);
      setSaveState("saved");
    }, 700);
  };

  useEffect(() => () => { if (saveTimer.current) clearTimeout(saveTimer.current); }, []);

  if (!trip) return <div className="p-4"><Empty title="No trip yet." body="Reordering and trip notes live here." /></div>;

  const rx = items.filter((i) => i.is_prescription);

  return (
    <div className="px-3 py-3">
      <div className="mb-3 grid grid-cols-2 gap-2">

function PhotoSheet({ open, bag, photo, onClose, onSave, onDelete }) {
  const [preview, setPreview] = useState(null);
  const [caption, setCaption] = useState("");
  useEffect(() => { if (open) { setPreview(photo?.data_url || null); setCaption(photo?.caption || ""); } }, [open, photo]);
  if (!open) return null;

  const shrink = (file) => new Promise((res) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.55));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  return (
    <Sheet open title={`Photo — ${bag}`} onClose={onClose}>
      {preview ? (
        <img src={preview} alt={`${bag} packed`} className="mb-4 w-full rounded-xl border-2 border-slate-300" />
      ) : (
        <div className="mb-4 rounded-xl border-2 border-dashed border-slate-300 p-8 text-center text-sm text-slate-500">
          No photo yet. Take one once it's packed — next time you'll know how it all fitted.
        </div>
      )}
      <label className={`${btn} mb-3 w-full cursor-pointer border-2 border-slate-900 bg-white`}>
        <Camera size={16} /> {preview ? "Replace photo" : "Take or choose a photo"}
        <input type="file" accept="image/*" capture="environment" className="hidden"
          onChange={async (e) => { const f = e.target.files?.[0]; if (f) setPreview(await shrink(f)); }} />
      </label>
      <Field label="Caption"><input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="Meds pouch sits on top, left side" /></Field>
      <button disabled={!preview} onClick={() => onSave(preview, caption)} className={`${btn} w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>Save photo</button>
      {photo && <button onClick={onDelete} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}><Trash2 size={16} /> Delete photo</button>}
    </Sheet>
  );
}

function ImportSheet({ open, rooms, bags, onClose, onImport }) {
  const [text, setText] = useState("");
  const [groups, setGroups] = useState(null);
  const [mapping, setMapping] = useState({});
  const [skipped, setSkipped] = useState({});

  useEffect(() => { if (open) { setText(""); setGroups(null); setMapping({}); setSkipped({}); } }, [open]);

  const analyse = () => {
    const g = parsePastedList(text);
    setGroups(g);
    const m = {};
    g.forEach((grp, i) => {
      // guess: if the heading mentions a bag, treat it as a bag; else a room
      const low = grp.heading.toLowerCase();
      const roomGuess = rooms.find((r) => low.includes(r.toLowerCase().split(" ")[0])) || rooms[0];
      const bagGuess = bags.find((b) => low.includes(b.toLowerCase().split(" ")[0])) || bags[0];
      m[i] = { room: roomGuess, bag: bagGuess };
    });
    setMapping(m);
  };

  const totalItems = groups ? groups.reduce((a, g, i) => a + (skipped[i] ? 0 : g.items.length), 0) : 0;

  const doImport = () => {
    const rows = [];
    groups.forEach((g, i) => {
      if (skipped[i]) return;
      const map = mapping[i] || {};
      g.items.forEach((it) => {
        rows.push({
          name: it.name,
          quantity: it.quantity,
          notes_or_special_instructions: it.notes,
          room_source: map.room || rooms[0],
          assigned_bag: map.bag || bags[0],
        });
      });
    });
    onImport(rows);
  };

  return (
    <Sheet open={open} title="Paste in an old list" onClose={onClose}>
      {!groups ? (
        <>
          <p className="mb-3 text-sm text-slate-600">
            Paste a list from Google Tasks, notes, anywhere. Headings become groups you can map to a room and bag. Quantities written like "x3" or "7 bottles" are picked up automatically, and anything in brackets becomes a note.
          </p>
          <p className="mb-3 rounded-lg border-2 border-amber-200 bg-amber-50 p-2 text-xs font-semibold text-amber-800">
            Worth stripping out real names before pasting — use S, F, Mum, Dad.
          </p>
          <textarea rows="12" className={`${inputCls} font-mono text-sm`} value={text} onChange={(e) => setText(e.target.value)}
            placeholder={"Kitchen:\nwipes\noat milk x3\ncool bag (freeze packs overnight)\nMeds:\nParacetamol\nLaxido"} />
          <button onClick={analyse} disabled={!text.trim()} className={`${btn} mt-3 w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>
            Read the list
          </button>
        </>
      ) : (
        <>
          <button onClick={() => setGroups(null)} className="mb-3 flex items-center gap-2 text-sm font-bold text-slate-500">
            <ArrowLeft size={15} /> Paste something different
          </button>
          <p className="mb-4 text-sm text-slate-600">
            Found <strong>{groups.length} groups</strong>, {totalItems} items to import. Set where each group came from and where it's going — you can change any individual item afterwards.
          </p>
          {groups.map((g, i) => (
            <div key={i} className={`mb-4 rounded-xl border-2 p-3 ${skipped[i] ? "border-slate-200 bg-slate-100 opacity-60" : "border-slate-300 bg-white"}`}>
              <div className="mb-2 flex items-center justify-between gap-2">
                <p className="min-w-0 flex-1 truncate text-sm font-bold">
                  {g.heading} <span className="text-xs font-normal text-slate-500">({g.items.length})</span>
                </p>
                <button onClick={() => setSkipped({ ...skipped, [i]: !skipped[i] })}
                  className="shrink-0 text-xs font-bold text-slate-500">
                  {skipped[i] ? "Include" : "Skip"}
                </button>
              </div>
              {!skipped[i] && (
                <>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Room</span>
                      <select className={inputCls} value={mapping[i]?.room || rooms[0]}
                        onChange={(e) => setMapping({ ...mapping, [i]: { ...mapping[i], room: e.target.value } })}>
                        {rooms.map((r) => <option key={r}>{r}</option>)}
                      </select>
                    </div>
                    <div>
                      <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Bag</span>
                      <select className={inputCls} value={mapping[i]?.bag || bags[0]}
                        onChange={(e) => setMapping({ ...mapping, [i]: { ...mapping[i], bag: e.target.value } })}>
                        {bags.map((b) => <option key={b}>{b}</option>)}
                      </select>
                    </div>
                  </div>
                  <p className="mt-2 truncate text-xs text-slate-500">
                    {g.items.slice(0, 4).map((it) => it.name + (it.quantity > 1 ? ` ×${it.quantity}` : "")).join(", ")}
                    {g.items.length > 4 && `, +${g.items.length - 4} more`}
                  </p>
                </>
              )}
            </div>
          ))}
          <button onClick={doImport} disabled={!totalItems} className={`${btn} w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>
            Import {totalItems} items
          </button>
        </>
      )}
    </Sheet>
  );
}

            <p className="mb-4 rounded-lg border-2 border-teal-200 bg-teal-50 p-2 text-xs font-semibold text-teal-800">
