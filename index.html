      const c = makeClient(url, key);
      const [t, i, k, ct, ph, appSettings] = await Promise.all([
        c.all("trips"), c.all("items"), c.all("tasks"), c.all("contacts"), c.all("photos"),
        c.all("app_settings").catch(() => []), // table may not exist yet on an older setup
      ]);
      setClient(c);
      setTrips((t || []).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")));
      setItems(i || []); setTasks(k || []); setContacts(ct || []); setPhotos(ph || []);
      setActiveTripId((t || [])[0]?.id ?? null);

      /* Rooms/bags/packers used to live only in each phone's own storage,
         which is how two phones ended up with different lists. There's now
         one shared row in Supabase — but the very first phone to connect
         after this change effectively "wins" and becomes the template for
         both, which can silently drop names the other phone actually needs.
         To make that impossible: always reconcile the shared list against
         what's ACTUALLY used on real items, which can never be wrong or
         stale, and add back anything genuinely missing. This runs every
         connect, so the list heals itself rather than depending on which
         phone got there first. */
      const usedRooms = [...new Set((i || []).map((x) => x.room_source).filter(Boolean))];
      const usedBags = [...new Set((i || []).map((x) => x.assigned_bag).filter(Boolean))];

      const existing = (appSettings || [])[0];
      let finalRooms, finalBags, finalPackers, needsWrite = false;

      if (existing) {
        finalRooms = existing.rooms?.length ? existing.rooms : DEFAULT_ROOMS;
        finalBags = existing.bags?.length ? existing.bags : DEFAULT_BAGS;
        finalPackers = existing.packers?.length ? existing.packers : DEFAULT_PACKERS;
      } else {
        finalRooms = seed?.rooms?.length ? seed.rooms : DEFAULT_ROOMS;
        finalBags = seed?.bags?.length ? seed.bags : DEFAULT_BAGS;
        finalPackers = seed?.packers?.length ? seed.packers : DEFAULT_PACKERS;
        needsWrite = true;
      }

      const missingRooms = usedRooms.filter((r) => !finalRooms.includes(r));
      const missingBags = usedBags.filter((b) => !finalBags.includes(b));
      if (missingRooms.length) { finalRooms = [...finalRooms, ...missingRooms]; needsWrite = true; }
      if (missingBags.length) { finalBags = [...finalBags, ...missingBags]; needsWrite = true; }

      setRooms(finalRooms); setBags(finalBags); setPackers(finalPackers);

      if (needsWrite) {
        try { await c.upsert("app_settings", { id: "shared", rooms: finalRooms, bags: finalBags, packers: finalPackers }); }
        catch { /* app_settings table missing or unreachable; local values still work for this session */ }
      }

      setStatus("live"); setStatusMsg("");
      await store.set("supabase-settings", { url, key });
    } catch (e) {
      setStatus("error");
      const raw = String(e?.message || e);
      let hint = "";
      if (/Failed to fetch|NetworkError|Load failed/i.test(raw)) hint = "The URL didn't resolve at all — check it's exactly the Project URL, ending in .supabase.co";
      else if (/JWT|apikey|Invalid API key|401|403/i.test(raw)) hint = "The project was found, but the key was rejected. Use the publishable key (sb_publishable_…) or the legacy anon key.";
      else if (/does not exist|42P01|404|Not Found/i.test(raw)) hint = "Connected fine, but a table is missing. Re-run the setup SQL.";
      setStatusMsg(`${hint || "Couldn't connect."}\n\nExact error: ${raw.slice(0, 300)}`);
    }
    setBusy("");
  }, []);

  /* --- keep both phones in step --- */
  useEffect(() => {
    if (!client) return;
    const tick = setInterval(async () => {
      if (readQueue().length) return; // don't pull server state over unsent local changes
      try {
        const [i, k, ct, t, ph, appSettings] = await Promise.all([
          client.all("items"), client.all("tasks"), client.all("contacts"), client.all("trips"), client.all("photos"),
          client.all("app_settings").catch(() => null),
        ]);
        const now = Date.now();
        const keepMine = (fresh, prev) => {
          const held = new Map();
          prev.forEach((x) => { const ts = recentEdits.current.get(x.id); if (ts && now - ts < 6000) held.set(x.id, x); });
          return (fresh || []).map((x) => held.get(x.id) || x);
        };
        setItems((p) => keepMine(i, p));
        setTasks((p) => keepMine(k, p));
        setContacts((p) => keepMine(ct, p));
        setTrips((p) => keepMine(t, p).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")));
        setPhotos(ph || []);
        /* Pick up rooms/bags/packers added on the other phone, and keep the
           list self-healing against whatever's genuinely used on real items
           — same reconciliation as on connect, so this can't drift again. */
        const shared = (appSettings || [])[0];
        if (shared) {
          const usedRooms = [...new Set((i || []).map((x) => x.room_source).filter(Boolean))];
          const usedBags = [...new Set((i || []).map((x) => x.assigned_bag).filter(Boolean))];
          let r = shared.rooms?.length ? shared.rooms : DEFAULT_ROOMS;
          let b = shared.bags?.length ? shared.bags : DEFAULT_BAGS;
          const missingR = usedRooms.filter((x) => !r.includes(x));
          const missingB = usedBags.filter((x) => !b.includes(x));
          if (missingR.length || missingB.length) {
            r = missingR.length ? [...r, ...missingR] : r;
            b = missingB.length ? [...b, ...missingB] : b;
            try { await client.upsert("app_settings", { id: "shared", rooms: r, bags: b, packers: shared.packers || DEFAULT_PACKERS }); } catch {}
          }
          setRooms(r); setBags(b);
          if (shared.packers?.length) setPackers(shared.packers);
        }
      } catch { /* next tick will catch up */ }
    }, 4000);
    return () => clearInterval(tick);
  }, [client]);

  /* --- offline-safe writes ---
     Every write updates the screen immediately, then either goes straight
     to Supabase or, if that fails (no signal, tunnel, etc.), is dropped into
     a queue saved in localStorage. A background loop keeps trying that queue
     every few seconds until it's empty, so nothing typed on a train is ever
     silently lost — it just waits. */
  const setters = { items: setItems, tasks: setTasks, contacts: setContacts, trips: setTrips, photos: setPhotos };
  const [pendingCount, setPendingCount] = useState(0);
  const [syncState, setSyncState] = useState("idle"); // idle | pending | error
  const [syncError, setSyncError] = useState(null); // { message, table, kind, attempts, since }

  const setQueue = (q) => { writeQueue(q); setPendingCount(q.length); };
  const enqueue = (op) => setQueue([...readQueue(), { ...op, queuedAt: Date.now() }]);

  useEffect(() => { setPendingCount(readQueue().length); }, []);

  const runOp = async (op) => {
    if (op.kind === "update") await client.update(op.table, op.id, op.patch);
    else if (op.kind === "insert") await client.insert(op.table, op.rows);
    else if (op.kind === "delete") await client.remove(op.table, op.id);
    else if (op.kind === "upsert") await client.upsert(op.table, op.row);
  };

  const drainQueue = useCallback(async () => {
    if (!client) return;
    let q = readQueue();
    if (!q.length) { setSyncState("idle"); setSyncError(null); return; }
    setSyncState("pending");
    while (q.length) {
      try {
        await runOp(q[0]);
        q = q.slice(1);
        setQueue(q);
        setSyncError(null);
      } catch (e) {
        /* Keep the reason visible. A silent retry loop can hide a permanent
           failure — a bad column, a value too big for its type — for days. */
        const head = { ...q[0], attempts: (q[0].attempts || 0) + 1, lastError: String(e?.message || e).slice(0, 400) };
        q = [head, ...q.slice(1)];
        setQueue(q);
        setSyncState("error");
        setSyncError({
          message: head.lastError,
          table: head.table,
          kind: head.kind,
          attempts: head.attempts,
          since: head.queuedAt,
        });
        return; // stop here, retry from the same failed op next time
      }
    }
    setSyncState("idle");
    setSyncError(null);
  }, [client]);

  const discardStuckOp = () => {
    const q = readQueue();
    if (!q.length) return;
    setQueue(q.slice(1));
    setSyncError(null);
    setSyncState("idle");
    setTimeout(drainQueue, 100);
  };

  const discardWholeQueue = () => {
    setQueue([]);
    setSyncError(null);
    setSyncState("idle");
  };

  useEffect(() => {
    if (!client) return;
    drainQueue();
    const onOnline = () => drainQueue();
    window.addEventListener("online", onOnline);
    const retry = setInterval(drainQueue, 5000);
    return () => { window.removeEventListener("online", onOnline); clearInterval(retry); };
  }, [client, drainQueue]);

  const patch = async (table, id, p) => {
    recentEdits.current.set(id, Date.now());
    setters[table]((prev) => prev.map((r) => (r.id === id ? { ...r, ...p } : r)));
    if (!client) return;
    try { await client.update(table, id, p); }
    catch { enqueue({ kind: "update", table, id, patch: p }); drainQueue(); }
  };
  const drop = async (table, id) => {
    setters[table]((prev) => prev.filter((r) => r.id !== id));
    if (!client) return;
    try { await client.remove(table, id); }
    catch { enqueue({ kind: "delete", table, id }); drainQueue(); }
  };
  const add = async (table, rows, defaults = {}) => {
    const full = rows.map((r) => ({ id: uid(), trip_id: activeTripId, ...defaults, ...r }));
    setters[table]((prev) => [...prev, ...full]);
    if (!client) return full;
    try { await client.insert(table, full); }
    catch { enqueue({ kind: "insert", table, rows: full }); drainQueue(); }
    return full;
  };

  const addItems = async (rows, tripId = activeTripId) =>
    add("items", rows.map((r) => ({
      trip_id: tripId, is_packed: false, quantity: 1, notes_or_special_instructions: "",
      packer: "Either of us", is_flagged: false, flag_note: "", is_prescription: false,
      last_minute: false, room_source: rooms[0], assigned_bag: bags[0], ...r,
    })));

  const addTrip = async (t) => {
    const trip = { id: uid(), created_at: new Date().toISOString(), review: null, ...t };
    setTrips((p) => [trip, ...p]);
    setActiveTripId(trip.id);
    if (client) { try { await client.insert("trips", [trip]); } catch {} }
    return trip;
  };

  const renameEverywhere = async (field, from, to) => {
    const hits = items.filter((i) => i[field] === from);
    setItems((p) => p.map((i) => (i[field] === from ? { ...i, [field]: to } : i)));
    if (client) for (const i of hits) { try { await client.update("items", i.id, { [field]: to }); } catch {} }
    return hits.length;
  };
  const countUsing = (field, v) => items.filter((i) => i[field] === v).length;

  const bulkPacker = async (list, packer) => {
    const ids = new Set(list.map((i) => i.id));
    setItems((p) => p.map((i) => (ids.has(i.id) ? { ...i, packer } : i)));
    if (client) for (const i of list) { try { await client.update("items", i.id, { packer }); } catch {} }
  };

  const resetTicks = async () => {
    const hits = items.filter((i) => i.trip_id === activeTripId && i.is_packed);
    setItems((p) => p.map((i) => (i.trip_id === activeTripId ? { ...i, is_packed: false } : i)));
    if (client) for (const i of hits) { try { await client.update("items", i.id, { is_packed: false }); } catch {} }
  };

  const copyWholeTrip = async (srcId) => {
    const src = trips.find((t) => t.id === srcId);
    if (!src) return;
    const t = await addTrip({ name: `${src.name} (again)`, month: src.month, days: src.days, transport: src.transport, notes: src.notes });
    await addItems(items.filter((i) => i.trip_id === srcId).map((i) => ({
      name: i.name, room_source: i.room_source, assigned_bag: i.assigned_bag, quantity: i.quantity,
      notes_or_special_instructions: i.notes_or_special_instructions, packer: i.packer,
      is_prescription: i.is_prescription, last_minute: i.last_minute,
    })), t.id);
    const srcTasks = tasks.filter((x) => x.trip_id === srcId);
    if (srcTasks.length) {
      const rows = srcTasks.map((x) => ({ id: uid(), trip_id: t.id, kind: x.kind, title: x.title, notes: x.notes, done: false, packer: x.packer, position: x.position }));
      setTasks((p) => [...p, ...rows]);
      if (client) { try { await client.insert("tasks", rows); } catch {} }
    }
    const srcContacts = contacts.filter((c) => c.trip_id === srcId);
    if (srcContacts.length) {
      const rows = srcContacts.map((c) => ({ ...c, id: uid(), trip_id: t.id }));
      setContacts((p) => [...p, ...rows]);
      if (client) { try { await client.insert("contacts", rows); } catch {} }
    }
  };

  /* --- derived --- */
  const activeTrip = trips.find((t) => t.id === activeTripId) || null;
  const tripItems = useMemo(() => items.filter((i) => i.trip_id === activeTripId), [items, activeTripId]);
  const tripTasks = useMemo(() => tasks.filter((t) => t.trip_id === activeTripId), [tasks, activeTripId]);
  const tripContacts = useMemo(() => contacts.filter((c) => c.trip_id === activeTripId), [contacts, activeTripId]);
  const packedCount = tripItems.filter((i) => i.is_packed).length;
  const flagged = tripItems.filter((i) => i.is_flagged);

  const visible = useMemo(() => {
    let list = view === "manifest" ? tripItems.filter((i) => i.is_packed) : tripItems;
    if (filterPacker !== "all") list = list.filter((i) => i.packer === filterPacker || i.packer === "Either of us");
    if (hidePacked && view !== "manifest") list = list.filter((i) => !i.is_packed);
    const q = search.trim().toLowerCase();
    if (q) list = list.filter((i) => (i.name + " " + (i.notes_or_special_instructions || "")).toLowerCase().includes(q));
    return list;
  }, [tripItems, view, filterPacker, hidePacked, search]);

  const groups = useMemo(() => {
    const order = view === "gather" ? rooms : bags;
    const keyOf = (i) => (view === "gather" ? i.room_source || "Unsorted" : i.assigned_bag || "No bag yet");
    const map = new Map();
    visible.forEach((i) => { const k = keyOf(i); if (!map.has(k)) map.set(k, []); map.get(k).push(i); });
    return [...map.entries()]
      .sort((a, b) => {
        const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a[0].localeCompare(b[0]);
      })
      /* Packed items sink to the bottom of their group, so what's left to
         gather stays at the top. In the "In bags" view everything is packed,
         so ordering there stays alphabetical. */
      .map(([label, list]) => [
        label,
        [...list].sort((x, y) => {
          if (view !== "manifest" && !!x.is_packed !== !!y.is_packed) return x.is_packed ? 1 : -1;
          return (x.name || "").localeCompare(y.name || "");
        }),
      ]);
  }, [visible, view, rooms, bags]);

  const jobCounts = JOB_KINDS.map((k) => {
    const l = tripTasks.filter((t) => t.kind === k.id);
    return { ...k, done: l.filter((t) => t.done).length, total: l.length };
  });

  /* ------------------------------ render ---------------------------- */

  return (
    <div className="min-h-screen bg-slate-100 font-sans text-slate-900">
      <div className="mx-auto max-w-2xl pb-24">

        <header className="border-b-2 border-slate-900 bg-white px-4 pb-3 pt-4">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <p className="text-xs font-bold uppercase tracking-widest text-teal-700">Packing for</p>
              <h1 className="truncate text-xl font-bold tracking-tight">{activeTrip ? activeTrip.name : "No trip yet"}</h1>
              {activeTrip && <p className="text-xs text-slate-500">{activeTrip.month} · {activeTrip.days} days · {activeTrip.transport}</p>}
            </div>
            <div className="flex shrink-0 gap-2">
              <button onClick={() => setSheet("newtrip")} className="rounded-xl border-2 border-slate-300 p-2.5" aria-label="New trip"><Sparkles size={18} /></button>
              <button onClick={() => setSheet("past")} className="rounded-xl border-2 border-slate-300 p-2.5" aria-label="Trips"><History size={18} /></button>
              <button onClick={() => setSheet("settings")} className="rounded-xl border-2 border-slate-300 p-2.5" aria-label="Settings"><Settings size={18} /></button>
            </div>
          </div>
          <div className="mt-3"><Meter done={packedCount} total={tripItems.length} /></div>
          <div className="mt-2 flex items-center gap-2 text-xs font-semibold">
            {status === "live"
              ? <><Wifi size={13} className="text-teal-700" /><span className="text-teal-700">Synced</span></>
              : <><WifiOff size={13} className="text-amber-600" /><span className="text-amber-700">Demo mode — this device only</span></>}
            {status === "live" && pendingCount > 0 && (
              <span className="flex items-center gap-1 rounded-md bg-amber-100 px-2 py-0.5 text-amber-800">
                <CloudOff size={12} /> {pendingCount} waiting to sync
              </span>
            )}            {flagged.length > 0 && (
              <span className="ml-auto flex items-center gap-1 rounded-md bg-amber-100 px-2 py-0.5 text-amber-800">
                <Flag size={12} /> {flagged.length} flagged
              </span>
            )}
          </div>

          {syncError && syncError.attempts >= 3 && (
            <div className="mt-3 rounded-xl border-2 border-red-300 bg-red-50 p-3">
              <p className="flex items-center gap-2 text-sm font-bold text-red-800">
                <CloudOff size={15} /> Something won't save
              </p>
              <p className="mt-1 text-xs text-red-700">
                A change to <strong>{syncError.table}</strong> has failed {syncError.attempts} times and is holding up {pendingCount} change{pendingCount === 1 ? "" : "s"} behind it.
              </p>
              <p className="mt-2 break-words rounded-lg bg-white p-2 font-mono text-xs text-red-800">{syncError.message}</p>
              <div className="mt-2 flex gap-2">
                <button onClick={discardStuckOp} className={`${btn} flex-1 border-2 border-red-300 bg-white text-xs text-red-800`}>
                  Skip this one
                </button>
                <button onClick={discardWholeQueue} className={`${btn} flex-1 border-2 border-red-300 bg-white text-xs text-red-800`}>
                  Discard all {pendingCount}
                </button>
              </div>
              <p className="mt-2 text-xs text-red-600">
                Skipping loses that one change. Everything already saved is unaffected.
              </p>
            </div>
          )}
        </header>

        {tab === "list" && (
          <>
            <div className="sticky top-0 z-30 border-b-2 border-slate-900 bg-slate-100 px-3 pb-2 pt-2">
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: "gather", label: "Gather", sub: "by room", Icon: Home },
                  { id: "pack", label: "Pack", sub: "by bag", Icon: Luggage },
                  { id: "manifest", label: "In bags", sub: "packed only", Icon: PackageCheck },
                ].map(({ id, label, sub, Icon }) => (
                  <button key={id} onClick={() => setView(id)}
                    className={`rounded-lg border-2 px-2 py-2 text-center ${view === id ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                    <Icon size={15} className="mx-auto" />
                    <div className="text-xs font-bold leading-tight">{label}</div>
                    <div className="text-xs leading-tight opacity-70">{sub}</div>
                  </button>
                ))}
              </div>

              <div className="mt-2 flex items-center gap-2">
                <div className="relative flex-1">
                  <Search size={14} className="absolute left-2 top-2.5 text-slate-400" />
                  <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Find an item"
                    className="w-full rounded-lg border-2 border-slate-300 bg-white py-1.5 pl-7 pr-2 text-sm" />
                </div>
                <button onClick={() => setHidePacked(!hidePacked)}
                  className={`rounded-lg border-2 px-2 py-1.5 text-xs font-bold ${hidePacked ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                  {hidePacked ? "Showing to-do" : "Show all"}
                </button>
              </div>

              <div className="mt-2 flex gap-1 overflow-x-auto pb-1">
                {["all", ...packers].map((p) => (
                  <button key={p} onClick={() => setFilterPacker(p)}
                    className={`shrink-0 rounded-full border-2 px-3 py-1 text-xs font-bold ${filterPacker === p ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                    {p === "all" ? "Everyone" : p}
                  </button>
                ))}
              </div>
            </div>

            <main className="space-y-4 px-3 py-3">
              {!activeTrip && (
                <Empty title="Start with a trip." body="Tell the app when you're going and for how long, and it'll draft the list from what you packed before."
                  action={<button onClick={() => setSheet("newtrip")} className={`${btn} w-full bg-slate-900 text-white`}><Sparkles size={16} /> New trip</button>} />
              )}
              {activeTrip && groups.length === 0 && (
                <Empty title={view === "manifest" ? "Nothing packed yet." : search ? "Nothing matches." : "This list is empty."}
                  body={view === "manifest" ? "Tick items off and they'll appear here, sorted by bag." : "Add items yourself, or pull them in from a past trip."} />
              )}

              {groups.map(([label, list]) => (
                <Group
                  key={label} label={label} list={list} view={view}
                  collapsed={!!collapsed[view + label]}
                  toggle={() => setCollapsedPersisted({ ...collapsed, [view + label]: !collapsed[view + label] })}
                  onTick={(i) => patch("items", i.id, { is_packed: !i.is_packed })}
                  onOpen={setEditing}
                  onAssignGroup={() => setAssigning({ label, list })}
                  photo={view === "manifest" ? photos.find((p) => p.trip_id === activeTripId && p.bag === label) : null}
                  onPhoto={view === "manifest" ? () => setSheet({ kind: "photo", bag: label }) : null}
                />
              ))}
            </main>
          </>
        )}

        {tab === "jobs" && (
          <JobsScreen
            trip={activeTrip} tasks={tripTasks} packers={packers} counts={jobCounts}
            history={historyText(trips, items)}
            onToggle={(t) => patch("tasks", t.id, { done: !t.done })}
            onAdd={(kind, rows) => add("tasks", rows.map((r, n) => ({
              kind, done: false, packer: "Either of us",
              /* Position just needs to sort after everything already there.
                 Date.now() overflows a Postgres int, so count from the
                 existing tasks instead. */
              position: tripTasks.filter((t) => t.kind === kind).length + n,
              ...r,
            })))}
            onPatch={(id, p) => patch("tasks", id, p)}
            onDelete={(id) => drop("tasks", id)}
          />
        )}

        {tab === "info" && (
          <InfoScreen
            trip={activeTrip} contacts={tripContacts}
            onAdd={(rows) => add("contacts", rows)}
            onPatch={(id, p) => patch("contacts", id, p)}
            onDelete={(id) => drop("contacts", id)}
          />
        )}

        {tab === "after" && (
          <AfterScreen
            trip={activeTrip} items={tripItems} tripTasks={tripTasks}
            onSaveReview={(r) => patch("trips", activeTrip.id, { review: JSON.stringify(r) })}
            onPatchItem={(id, p) => patch("items", id, p)}
            onAddItem={(row) => addItems([{ ...row, is_prescription: true }])}
            onAddMissedItem={(row) => addItems([{ ...row, was_missed: true, is_packed: false }])}
            onAddMissedJob={({ title, kind }) => add("tasks", [{
              kind, title, notes: "", done: false, packer: "Either of us", was_missed: true,
              position: tripTasks.filter((t) => t.kind === kind).length,
            }])}
            onDeleteTask={(id) => drop("tasks", id)}
            rooms={rooms} bags={bags}
          />
        )}
      </div>

      {/* bottom navigation */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 border-t-2 border-slate-900 bg-white">
        <div className="mx-auto grid max-w-2xl grid-cols-6">
          {[
            { id: "list", label: "List", Icon: Luggage },
            { id: "jobs", label: "Jobs", Icon: ListChecks, badge: jobCounts.reduce((a, k) => a + (k.total - k.done), 0) },
            { id: "add", label: "Add", Icon: Plus },
            { id: "library", label: "Library", Icon: BookOpen },
            { id: "info", label: "Info", Icon: Phone },
            { id: "after", label: "After", Icon: ClipboardList },
          ].map(({ id, label, Icon, badge }) => (
            <button key={id}
              onClick={() => (id === "add" ? setSheet("add") : id === "library" ? setSheet("library") : setTab(id))}
              disabled={(id === "add" || id === "library") && !activeTrip}
              className={`relative flex flex-col items-center gap-0.5 py-2.5 text-xs font-bold ${tab === id ? "text-teal-700" : "text-slate-500"}`}>
              <Icon size={18} />
              {label}
              {badge > 0 && <span className="absolute right-2 top-1 rounded-full bg-amber-500 px-1.5 text-xs text-white">{badge}</span>}
            </button>
          ))}
        </div>
      </nav>

      {/* sheets */}
      <EditItemSheet item={editing} rooms={rooms} bags={bags} packers={packers}
        onAddRoom={(name) => savePlaces({ rooms: [...rooms, name] })}
        onAddBag={(name) => savePlaces({ bags: [...bags, name] })}
        onClose={() => setEditing(null)}
        onSave={(p) => { patch("items", editing.id, p); setEditing(null); }}
        onDelete={() => { drop("items", editing.id); setEditing(null); }} />

      <AddItemSheet open={sheet === "add"} rooms={rooms} bags={bags} packers={packers} items={items}
        onPasteList={() => setSheet("import")}
        onAddRoom={(name) => savePlaces({ rooms: [...rooms, name] })}
        onAddBag={(name) => savePlaces({ bags: [...bags, name] })}
        onGoToLibrary={(name) => { setLibraryOpenSearch(name); setSheet("library"); }}
        onClose={() => setSheet(null)} onAdd={(r) => { addItems([r]); setSheet(null); }} />

      <AssignSheet group={assigning} packers={packers} onClose={() => setAssigning(null)}
        onPick={(p) => { bulkPacker(assigning.list, p); setAssigning(null); }} />

      <PhotoSheet open={sheet?.kind === "photo"} bag={sheet?.bag}
        photo={photos.find((p) => p.trip_id === activeTripId && p.bag === sheet?.bag)}
        onClose={() => setSheet(null)}
        onSave={async (dataUrl, caption) => {
          const existing = photos.find((p) => p.trip_id === activeTripId && p.bag === sheet.bag);
          if (existing) await patch("photos", existing.id, { data_url: dataUrl, caption });
          else await add("photos", [{ bag: sheet.bag, data_url: dataUrl, caption }]);
          setSheet(null);
        }}
        onDelete={async () => {
          const existing = photos.find((p) => p.trip_id === activeTripId && p.bag === sheet.bag);
          if (existing) await drop("photos", existing.id);
          setSheet(null);
        }} />

      <NewTripSheet open={sheet === "newtrip"} trips={trips} items={items} tasks={tasks} rooms={rooms} bags={bags}
        onClose={() => setSheet(null)}
        onCreate={async (trip, generated, carryJobs, carryMissed) => {
          const t = await addTrip(trip);
          if (generated?.length) await addItems(generated, t.id);
          /* Things wished for last time arrive as ordinary items to pack —
             the missed flag belongs to the trip where they were missed, not
             this one, where they're simply on the list. */
          if (carryMissed?.length) {
            await addItems(carryMissed.map((i) => ({
              name: i.name, room_source: i.room_source, assigned_bag: i.assigned_bag,
              quantity: i.quantity || 1, notes_or_special_instructions: i.notes_or_special_instructions || "",
              is_prescription: !!i.is_prescription, last_minute: !!i.last_minute, was_missed: false,
            })), t.id);
          }
          /* Jobs repeat almost exactly trip to trip — insurance, the cat,
             assistance bookings — so carry the last trip's across, unticked. */
          if (carryJobs?.length) {
            const rows = carryJobs.map((x, n) => ({
              id: uid(), trip_id: t.id, kind: x.kind, title: x.title,
              notes: x.notes, done: false, packer: x.packer, position: n,
            }));
            setTasks((p) => [...p, ...rows]);
            if (client) { try { await client.insert("tasks", rows); } catch { enqueue({ kind: "insert", table: "tasks", rows }); } }
          }
          setSheet(null); setTab("list"); setView("gather");
        }} />

      <ImportSheet open={sheet === "import"} rooms={rooms} bags={bags} activeTrip={activeTrip}
        onClose={() => setSheet(null)}
        onImport={(rows) => { addItems(rows); setSheet(null); setTab("list"); }}
        onImportWithTrip={async (tripFields, rows) => {
          const t = await addTrip({ ...tripFields, notes: "" });
          await addItems(rows, t.id);
          setSheet(null); setTab("list"); setView("gather");
        }} />

      <LibrarySheet open={sheet === "library"} items={items} trips={trips} activeTripId={activeTripId}
        collapsedGroups={libraryCollapsed} setCollapsedGroups={setLibraryCollapsedPersisted}
        initialSearch={libraryOpenSearch}
        archivedLibraryItems={archivedLibraryItems} onArchive={archiveLibraryItem} onUnarchive={unarchiveLibraryItem}
        rooms={rooms} bags={bags} packers={packers}
        onClose={() => setSheet(null)}
        onAddToTrip={(rows) => addItems(rows)}
        onEditEverywhere={async (ids, patchFields) => {
          const idSet = new Set(ids);
          setItems((p) => p.map((i) => (idSet.has(i.id) ? { ...i, ...patchFields } : i)));
          for (const id of ids) {
            recentEdits.current.set(id, Date.now());
            if (client) {
              try { await client.update("items", id, patchFields); }
              catch { enqueue({ kind: "update", table: "items", id, patch: patchFields }); }
            }
          }
          if (client) drainQueue();
        }}
        onDeleteEverywhere={async (ids) => {
          const idSet = new Set(ids);
          setItems((p) => p.filter((i) => !idSet.has(i.id)));
          for (const id of ids) {
            if (client) {
              try { await client.remove("items", id); }
              catch { enqueue({ kind: "delete", table: "items", id }); }
            }
          }
          if (client) drainQueue();
        }} />

      <TripsSheet open={sheet === "past"} onNewTrip={() => setSheet("newtrip")} trips={trips} items={items} activeTripId={activeTripId}
        onClose={() => setSheet(null)}
        onSwitch={(id) => { setActiveTripId(id); setSheet(null); }}
        onCopyItems={(rows) => addItems(rows)}
        onCopyTrip={(id) => { copyWholeTrip(id); setSheet(null); }}
        onResetTicks={() => { resetTicks(); setSheet(null); }} />

      <ListsSheet open={sheet === "lists"} rooms={rooms} bags={bags} packers={packers} me={me}
        onClose={() => setSheet(null)} save={savePlaces}
        renameEverywhere={renameEverywhere} countUsing={countUsing} />

      <SettingsSheet open={sheet === "settings"} settings={settings} setSettings={setSettings}
        connect={connect} status={status} statusMsg={statusMsg} busy={busy === "connect"}
        onClose={() => setSheet(null)} onOpenLists={() => setSheet("lists")} />
    </div>
  );
}

const Empty = ({ title, body, action }) => (
  <div className="rounded-2xl border-2 border-dashed border-slate-300 p-6 text-center">
    <p className="font-bold">{title}</p>
    <p className="mt-1 text-sm text-slate-500">{body}</p>
    {action && <div className="mt-4">{action}</div>}
  </div>
);

/* --------------------------- list rendering ------------------------- */

function Group({ label, list, view, collapsed, toggle, onTick, onOpen, onAssignGroup, photo, onPhoto }) {
  const done = list.filter((i) => i.is_packed).length;
  const pct = list.length ? (done / list.length) * 100 : 0;
  const full = done === list.length;
  return (
    <section>
      <div className="sticky top-32 z-20 mb-1 overflow-hidden rounded-lg border-2 border-slate-900 bg-white">
        <div className={`absolute inset-y-0 left-0 transition-all duration-500 ${full ? "bg-teal-200" : "bg-teal-100"}`} style={{ width: `${pct}%` }} />
        <div className="relative flex items-center gap-2 px-2 py-2">
          <button onClick={toggle} className="flex min-w-0 flex-1 items-center gap-2 text-left">
            {collapsed ? <ChevronRight size={15} /> : <ChevronDown size={15} />}
            <span className="h-2 w-2 shrink-0 rounded-full border-2 border-slate-900 bg-slate-100" />
            <h3 className="truncate text-xs font-bold uppercase tracking-wider">{label}</h3>
            <span className="text-xs font-bold tabular-nums text-slate-600">{done}/{list.length}</span>
            {full && <Check size={13} strokeWidth={3} className="text-teal-700" />}
          </button>
          {onPhoto && (
            <button onClick={onPhoto} className="rounded-md border-2 border-slate-300 bg-white p-1.5 text-slate-600" aria-label="Photo of this bag">
              {photo ? <img src={photo.data_url} alt="" className="h-4 w-4 rounded object-cover" /> : <Camera size={14} />}
            </button>
          )}
          <button onClick={onAssignGroup} className="rounded-md border-2 border-slate-300 bg-white p-1.5 text-slate-600" aria-label="Assign this group">
            <UserRound size={14} />
          </button>
        </div>
      </div>

      {!collapsed && (
        <ul className="divide-y-2 divide-slate-100 overflow-hidden rounded-lg border-2 border-slate-300 bg-white">
          {list.map((item) => (
            <li key={item.id} className={`flex items-stretch ${item.is_flagged ? "border-l-4 border-amber-500" : ""}`}>
              <button onClick={() => onTick(item)}
                className={`flex w-12 shrink-0 items-center justify-center ${item.is_packed ? "bg-teal-600 text-white" : "bg-slate-50 text-slate-300"}`}
                aria-label={item.is_packed ? "Not packed" : "Packed"}>
                <Check size={20} strokeWidth={3} />
              </button>
              <button onClick={() => onOpen(item)} className="flex flex-1 items-center gap-2 px-2 py-2 text-left">
                <div className="min-w-0 flex-1">
                  <p className={`text-sm font-semibold leading-tight ${item.is_packed ? "text-slate-400 line-through" : ""}`}>
                    {item.name}
                    {item.quantity > 1 && <span className="ml-1 text-xs font-bold text-slate-500">×{item.quantity}</span>}
                    {item.is_prescription && <Pill size={12} className="ml-1 inline text-teal-700" />}
                    {item.last_minute && <Snowflake size={12} className="ml-1 inline text-sky-600" />}
                  </p>
                  <p className="truncate text-xs uppercase tracking-wide text-slate-400">
                    {view === "gather" ? item.assigned_bag || "No bag yet" : item.room_source || "Unsorted"}
                    {item.notes_or_special_instructions && <span className="ml-1 normal-case tracking-normal text-slate-500">· {item.notes_or_special_instructions}</span>}
                  </p>
                  {item.is_flagged && (
                    <p className="mt-0.5 flex items-center gap-1 text-xs font-semibold text-amber-700">
                      <Flag size={11} /> {item.flag_note || "Flagged"}
                    </p>
                  )}
                </div>
                <PackerDot name={item.packer} />
              </button>
            </li>
          ))}
        </ul>
      )}
    </section>
  );
}

/* ------------------------------- jobs ------------------------------- */

function JobsScreen({ trip, tasks, packers, counts, history, onToggle, onAdd, onPatch, onDelete }) {
  const [kind, setKind] = useState("sort");
  const [draftText, setDraftText] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [editing, setEditing] = useState(null);
  const [selectMode, setSelectMode] = useState(false);
  const [sel, setSel] = useState({});
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [suggested, setSuggested] = useState(null); // array while reviewing, null otherwise
  const [suggestedPicked, setSuggestedPicked] = useState({});

  useEffect(() => { setSelectMode(false); setSel({}); setConfirmDelete(false); setSuggested(null); }, [kind]);

  if (!trip) return <div className="p-4"><Empty title="No trip yet." body="Start a trip and the job lists live here." /></div>;

  /* Done jobs sink to the bottom so the list stays about what's left to do,
     while keeping their relative order within each half. */
  const list = tasks
    .filter((t) => t.kind === kind)
    .sort((a, b) => {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      return (a.position || 0) - (b.position || 0);
    });
  const meta = JOB_KINDS.find((k) => k.id === kind);
  const selectedIds = list.filter((t) => sel[t.id]).map((t) => t.id);

  const suggest = async () => {
    setLoading(true); setErr(""); setSuggested(null);
    try {
      const existingTitles = list.map((t) => t.title);
      const rows = await draftJobs({
        month: trip.month, days: trip.days, transport: trip.transport, needs: trip.notes,
        history, kind, existing: existingTitles,
      });
      const have = new Set(existingTitles.map((t) => t.toLowerCase().replace(/[^a-z0-9]/g, "")));
      const fresh = rows.filter((r) => !have.has(r.title.toLowerCase().replace(/[^a-z0-9]/g, "")));
      if (!fresh.length) {
        setErr("Nothing new to suggest — everything it thought of is already on your list.");
      } else {
        setSuggested(fresh);
        setSuggestedPicked(Object.fromEntries(fresh.map((_, i) => [i, true])));
      }
    } catch (e) { setErr(e.message); }
    setLoading(false);
  };

  const acceptSuggested = () => {
    const chosen = suggested.filter((_, i) => suggestedPicked[i]);
    if (chosen.length) onAdd(kind, chosen);
    setSuggested(null);
  };

  const doBulkDelete = () => {
    selectedIds.forEach((id) => onDelete(id));
    setSel({});
    setSelectMode(false);
    setConfirmDelete(false);
  };

  return (
    <div className="px-3 py-3">
      <div className="mb-3 grid grid-cols-3 gap-2">
        {counts.map((k) => (
          <button key={k.id} onClick={() => setKind(k.id)}
            className={`rounded-lg border-2 px-2 py-2 text-left ${kind === k.id ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white"}`}>
            <div className="text-xs font-bold leading-tight">{k.label}</div>
            <div className="text-xs opacity-70">{k.done}/{k.total} done</div>
          </button>
        ))}
      </div>
      <div className="mb-3 flex items-center justify-between gap-2">
        <p className="min-w-0 flex-1 text-xs text-slate-500">{meta.blurb}</p>
        {list.length > 0 && (
          <button onClick={() => { setSelectMode(!selectMode); setSel({}); setConfirmDelete(false); }}
            className="shrink-0 text-xs font-bold text-teal-700">
            {selectMode ? "Done" : "Select"}
          </button>
        )}
      </div>

      {selectMode && (
        <div className="mb-3 flex gap-2">
          <button onClick={() => setSel(Object.fromEntries(list.map((t) => [t.id, true])))}
            className={`${btn} flex-1 border-2 border-slate-300 bg-white text-xs`}>Select all {list.length}</button>
          <button onClick={() => setSel({})} className={`${btn} flex-1 border-2 border-slate-300 bg-white text-xs`}>Clear</button>
        </div>
      )}

      <ul className="mb-3 divide-y-2 divide-slate-100 overflow-hidden rounded-lg border-2 border-slate-300 bg-white">
        {list.map((t) => (
          <li key={t.id} className="flex items-stretch">
            {selectMode ? (
              <button onClick={() => setSel({ ...sel, [t.id]: !sel[t.id] })}
                className={`flex w-12 shrink-0 items-center justify-center ${sel[t.id] ? "bg-red-600 text-white" : "bg-slate-50 text-slate-300"}`}>
                <Check size={20} strokeWidth={3} />
              </button>
            ) : (
              <button onClick={() => onToggle(t)} className={`flex w-12 shrink-0 items-center justify-center ${t.done ? "bg-teal-600 text-white" : "bg-slate-50 text-slate-300"}`}>
                <Check size={20} strokeWidth={3} />
              </button>
            )}
            <button onClick={() => (selectMode ? setSel({ ...sel, [t.id]: !sel[t.id] }) : setEditing(t))} className="flex flex-1 items-center gap-2 px-2 py-2 text-left">
              <div className="min-w-0 flex-1">
                <p className={`text-sm font-semibold leading-tight ${!selectMode && t.done ? "text-slate-400 line-through" : ""}`}>{t.title}</p>
                {t.notes && <p className="truncate text-xs text-slate-500">{t.notes}</p>}
              </div>
              <PackerDot name={t.packer} />
            </button>
          </li>
        ))}
        {list.length === 0 && <li className="px-3 py-6 text-center text-sm text-slate-500">Nothing here yet.</li>}
      </ul>

      {selectMode && selectedIds.length > 0 && (
        <div className="mb-3">
          {!confirmDelete ? (
            <button onClick={() => setConfirmDelete(true)} className={`${btn} w-full border-2 border-red-300 bg-white text-red-700`}>
              <Trash2 size={16} /> Delete {selectedIds.length} job{selectedIds.length === 1 ? "" : "s"}
            </button>
          ) : (
            <div className="rounded-xl border-2 border-red-300 bg-red-50 p-3">
              <p className="mb-2 text-sm font-bold text-red-800">Delete {selectedIds.length} job{selectedIds.length === 1 ? "" : "s"}?</p>
              <p className="mb-2 text-xs text-red-700">This can't be undone.</p>
              <div className="flex gap-2">
                <button onClick={doBulkDelete} className={`${btn} flex-1 bg-red-700 text-white`}>Yes, delete</button>
                <button onClick={() => setConfirmDelete(false)} className={`${btn} flex-1 border-2 border-slate-300 bg-white`}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div className="flex gap-2">
        <input className={inputCls} placeholder="Add a job" value={draftText} onChange={(e) => setDraftText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && draftText.trim()) { onAdd(kind, [{ title: draftText.trim(), notes: "" }]); setDraftText(""); } }} />
        <button onClick={() => { if (draftText.trim()) { onAdd(kind, [{ title: draftText.trim(), notes: "" }]); setDraftText(""); } }}
          className={`${btn} shrink-0 bg-slate-900 px-5 text-white`}><Plus size={18} /></button>
      </div>

      {err && <p className="mt-3 rounded-xl border-2 border-red-200 bg-red-50 p-3 text-sm font-semibold text-red-700">{err}</p>}

      {!suggested ? (
        <button onClick={suggest} disabled={loading} className={`${btn} mt-3 w-full border-2 border-teal-700 bg-white text-teal-800 disabled:opacity-60`}>
          {loading ? <><Loader2 size={16} className="animate-spin" /> Thinking…</> : <><Sparkles size={16} /> Suggest jobs for this trip</>}
        </button>
      ) : (
        <div className="mt-3 rounded-xl border-2 border-teal-300 bg-teal-50 p-3">
          <p className="mb-2 text-sm font-bold text-teal-900">{suggested.length} suggestion{suggested.length === 1 ? "" : "s"} — tick what you want</p>
          <ul className="mb-3 space-y-1.5">
            {suggested.map((s, i) => (
              <li key={i}>
                <button onClick={() => setSuggestedPicked({ ...suggestedPicked, [i]: !suggestedPicked[i] })}
                  className={`flex w-full items-start gap-2 rounded-lg border-2 px-2 py-2 text-left ${suggestedPicked[i] ? "border-teal-600 bg-white" : "border-slate-200 bg-slate-100 opacity-60"}`}>
                  <span className={`mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded border-2 ${suggestedPicked[i] ? "border-teal-600 bg-teal-600 text-white" : "border-slate-300"}`}>
                    {suggestedPicked[i] && <Check size={12} strokeWidth={3} />}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-sm font-semibold">{s.title}</span>
                    {s.notes && <span className="block text-xs text-slate-500">{s.notes}</span>}
                  </span>
                </button>
              </li>
            ))}
          </ul>
          <div className="flex gap-2">
            <button onClick={acceptSuggested} disabled={!Object.values(suggestedPicked).some(Boolean)}
              className={`${btn} flex-1 bg-slate-900 text-white disabled:opacity-40`}>
              Add {Object.values(suggestedPicked).filter(Boolean).length} job{Object.values(suggestedPicked).filter(Boolean).length === 1 ? "" : "s"}
            </button>
            <button onClick={() => setSuggested(null)} className={`${btn} flex-1 border-2 border-slate-300 bg-white`}>Discard all</button>
          </div>
        </div>
      )}

      <Sheet open={!!editing} title="Edit job" onClose={() => setEditing(null)}>
        {editing && (
          <>
            <Field label="Job"><input className={inputCls} value={editing.title} onChange={(e) => setEditing({ ...editing, title: e.target.value })} /></Field>
            <Field label="Note"><textarea rows="2" className={inputCls} value={editing.notes || ""} onChange={(e) => setEditing({ ...editing, notes: e.target.value })} /></Field>
            <Field label="Who's doing it">
              <div className="flex flex-wrap gap-2">
                {packers.map((p) => (
                  <button key={p} onClick={() => setEditing({ ...editing, packer: p })}
                    className={`rounded-full border-2 px-3 py-2 text-sm font-bold ${editing.packer === p ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white"}`}>{p}</button>
                ))}
              </div>
            </Field>
            <button onClick={() => { onPatch(editing.id, { title: editing.title, notes: editing.notes, packer: editing.packer }); setEditing(null); }}
              className={`${btn} w-full bg-slate-900 text-white`}>Save changes</button>
            <button onClick={() => { onDelete(editing.id); setEditing(null); }} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}>
              <Trash2 size={16} /> Delete job
            </button>
          </>
        )}
      </Sheet>
    </div>
  );
}

/* ------------------------------- info ------------------------------- */

function InfoScreen({ trip, contacts, onAdd, onPatch, onDelete }) {
  const blank = { label: "", category: "Where we're staying", phone: "", reference: "", notes: "" };
  const [editing, setEditing] = useState(null);
  if (!trip) return <div className="p-4"><Empty title="No trip yet." body="Booking references and phone numbers live here." /></div>;

  const cats = [...new Set(contacts.map((c) => c.category || "Other"))];

  return (
    <div className="px-3 py-3">
      <p className="mb-3 text-xs text-slate-500">Everything you'd need to ring while standing on a platform holding two children.</p>

      {cats.map((cat) => (
        <section key={cat} className="mb-4">
          <h3 className="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">{cat}</h3>
          <ul className="space-y-2">
            {contacts.filter((c) => (c.category || "Other") === cat).map((c) => (
              <li key={c.id} className="rounded-lg border-2 border-slate-300 bg-white p-3">
                <div className="flex items-start gap-2">
                  <div className="min-w-0 flex-1">
                    <p className="text-sm font-bold">{c.label}</p>
                    {c.reference && <p className="text-xs text-slate-600">{c.reference}</p>}
                    {c.notes && <p className="mt-1 text-xs text-slate-500">{c.notes}</p>}
                  </div>
                  <button onClick={() => setEditing(c)} className="rounded-md border-2 border-slate-300 p-2 text-slate-500"><Pencil size={14} /></button>
                </div>
                {c.phone && (
                  <a href={`tel:${c.phone.replace(/\s/g, "")}`} className={`${btn} mt-2 w-full bg-slate-900 text-white`}>
                    <Phone size={15} /> {c.phone}
                  </a>
                )}
              </li>
            ))}
          </ul>
        </section>
      ))}

      {contacts.length === 0 && <Empty title="Nothing saved yet." body="Add the cottage, the taxi firm, the nearest A&E." />}

      <button onClick={() => setEditing({ ...blank, id: null })} className={`${btn} mt-2 w-full bg-slate-900 text-white`}>
        <Plus size={16} /> Add a contact or booking
      </button>

      <Sheet open={!!editing} title={editing?.id ? "Edit contact" : "Add contact"} onClose={() => setEditing(null)}>
        {editing && (
          <>
            <Field label="Name"><input className={inputCls} value={editing.label} onChange={(e) => setEditing({ ...editing, label: e.target.value })} placeholder="Seaview Cottages" /></Field>
            <Field label="Type">
              <input list="cats" className={inputCls} value={editing.category} onChange={(e) => setEditing({ ...editing, category: e.target.value })} />
              <datalist id="cats">
                {["Where we're staying", "Transport", "Medical", "Home", "Equipment hire", "Other"].map((c) => <option key={c} value={c} />)}
              </datalist>
            </Field>
            <Field label="Phone"><input type="tel" className={inputCls} value={editing.phone} onChange={(e) => setEditing({ ...editing, phone: e.target.value })} /></Field>
            <Field label="Booking reference or key detail"><input className={inputCls} value={editing.reference} onChange={(e) => setEditing({ ...editing, reference: e.target.value })} placeholder="Booking SVC-88214, arrive after 4pm" /></Field>
            <Field label="Notes"><textarea rows="3" className={inputCls} value={editing.notes} onChange={(e) => setEditing({ ...editing, notes: e.target.value })} placeholder="Key safe code, step-free access, parking" /></Field>
            <button
              onClick={() => {
                const { id, ...rest } = editing;
                if (id) onPatch(id, rest); else onAdd([rest]);
                setEditing(null);
              }}
              disabled={!editing.label.trim()}
              className={`${btn} w-full bg-slate-900 text-white disabled:opacity-40`}>Save</button>
            {editing.id && (
              <button onClick={() => { onDelete(editing.id); setEditing(null); }} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}>
                <Trash2 size={16} /> Delete
              </button>
            )}
          </>
        )}
      </Sheet>
    </div>
  );
}

/* ------------------------- after the trip --------------------------- */

/* Free-text reflections. The two actionable questions — what we wished we'd
   packed, and what we wished we'd done — are handled separately below, since
   those become real items and real jobs on the next trip rather than prose. */
const REVIEW_PROMPTS = [
  { key: "bags_used", label: "Which bags did we actually take?", hint: "List them. Next time's suggestions start from this." },
  { key: "unused", label: "What came home unused?", hint: "The stuff to leave behind next time." },
  { key: "what_worked", label: "What worked, for the kids especially?", hint: "Routines, seating, timings, which bag things lived in." },
  { key: "notes", label: "Anything else worth remembering?", hint: "Access, lead times, staff, journey notes — things that aren't an item or a job." },
];

function AfterScreen({ trip, items, tripTasks, onSaveReview, onPatchItem, onAddItem, onAddMissedItem, onAddMissedJob, onDeleteTask, rooms, bags }) {
  const [section, setSection] = useState("rx");
  const [review, setReview] = useState({});
  const [saveState, setSaveState] = useState("idle"); // idle | pending | saved
  const [newRx, setNewRx] = useState("");
  const saveTimer = useRef(null);

  useEffect(() => {
    if (!trip) return;
    try { setReview(trip.review ? JSON.parse(trip.review) : {}); } catch { setReview({}); }
    setSaveState("idle");
  }, [trip?.id]);

  const updateField = (key, value) => {
    const next = { ...review, [key]: value };
    setReview(next);
    setSaveState("pending");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      onSaveReview(next);
      setSaveState("saved");
    }, 700);
  };

  useEffect(() => () => { if (saveTimer.current) clearTimeout(saveTimer.current); }, []);

  if (!trip) return <div className="p-4"><Empty title="No trip yet." body="Reordering and trip notes live here." /></div>;

  const rx = items.filter((i) => i.is_prescription);

  return (
    <div className="px-3 py-3">
      <div className="mb-3 grid grid-cols-2 gap-2">
        <button onClick={() => setSection("rx")} className={`rounded-lg border-2 px-2 py-2 text-sm font-bold ${section === "rx" ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white"}`}>
          Reorder ({rx.filter((i) => !i.reordered).length})
        </button>
        <button onClick={() => setSection("review")} className={`rounded-lg border-2 px-2 py-2 text-sm font-bold ${section === "review" ? "border-slate-900 bg-slate-900 text-white" : "border-slate-300 bg-white"}`}>
          Trip notes
        </button>
      </div>

      {section === "rx" && (
        <>
          <p className="mb-3 text-xs text-slate-500">
            Everything marked as prescription on this trip. Tick it once it's requested, so nothing runs out in the week after you get home.
          </p>
          <ul className="mb-3 divide-y-2 divide-slate-100 overflow-hidden rounded-lg border-2 border-slate-300 bg-white">
            {rx.map((i) => (
              <li key={i.id} className="flex items-stretch">
                <button onClick={() => onPatchItem(i.id, { reordered: !i.reordered })}
                  className={`flex w-12 shrink-0 items-center justify-center ${i.reordered ? "bg-teal-600 text-white" : "bg-slate-50 text-slate-300"}`}>
                  <Check size={20} strokeWidth={3} />
                </button>
                <div className="flex-1 px-2 py-2">
                  <p className={`text-sm font-semibold ${i.reordered ? "text-slate-400 line-through" : ""}`}>
                    {i.name}{i.quantity > 1 && <span className="ml-1 text-xs text-slate-500">×{i.quantity}</span>}
                  </p>
                  {i.notes_or_special_instructions && <p className="text-xs text-slate-500">{i.notes_or_special_instructions}</p>}
                </div>
              </li>
            ))}
            {rx.length === 0 && <li className="px-3 py-6 text-center text-sm text-slate-500">Nothing marked as prescription. Open any item and switch it on.</li>}
          </ul>
          <div className="flex gap-2">
            <input className={inputCls} placeholder="Add something to reorder" value={newRx} onChange={(e) => setNewRx(e.target.value)} />
            <button onClick={() => { if (newRx.trim()) { onAddItem({ name: newRx.trim(), room_source: "Medicine Cabinet", assigned_bag: bags[0] }); setNewRx(""); } }}
              className={`${btn} shrink-0 bg-slate-900 px-5 text-white`}><Plus size={18} /></button>
          </div>
        </>
      )}

      {section === "review" && (
        <>
          <p className="mb-2 text-xs text-slate-500">
            Fill this in on the way home while it's fresh. Claude reads it when drafting your next list — this is what makes the third trip better than the first. Saves as you type.
          </p>
          <p className="mb-3 rounded-lg border-2 border-amber-200 bg-amber-50 p-2 text-xs font-semibold text-amber-800">
            Keep entries anonymised — use "Mum", "Dad", "Kid 1", "Kid 2" rather than names, since this repo is public.
          </p>

          <MissedItemsBox trip={trip} items={items} rooms={rooms} bags={bags}
            onAddMissedItem={onAddMissedItem} onPatchItem={onPatchItem} />

          <MissedJobsBox trip={trip} tasks={tripTasks} onAddMissedJob={onAddMissedJob} onDeleteTask={onDeleteTask} />

          {REVIEW_PROMPTS.map((p) => (
            <Field key={p.key} label={p.label}>
              <textarea rows="3" className={inputCls} value={review[p.key] || ""} placeholder={p.hint}
                onChange={(e) => updateField(p.key, e.target.value)} />
            </Field>
          ))}
          <div className="mb-4 rounded-lg border-2 border-slate-300 bg-white p-3">
            <p className="flex items-center gap-2 text-sm font-bold"><Camera size={15} /> Photos of the setup</p>
            <p className="mt-1 text-xs text-slate-500">
              Photograph each packed bag from the In bags tab — tap the camera on any bag heading. Those photos stay with the trip, so next time you can see exactly how it all fitted.
            </p>
          </div>
          <p className="text-center text-xs font-semibold text-slate-500">
            {saveState === "pending" ? "Saving…" : saveState === "saved" ? "Saved" : "\u00A0"}
          </p>
        </>
      )}
    </div>
  );
}

/* Things we wished we'd packed. These become real items on THIS trip, marked
   as missed — so the record stays true about what was actually needed — and
   they're offered as carry-overs when the next trip starts. */
function MissedItemsBox({ trip, items, rooms, bags, onAddMissedItem, onPatchItem }) {
  const [text, setText] = useState("");
  const [room, setRoom] = useState(rooms[0]);
  const [bag, setBag] = useState(bags[0]);
  const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

  const missed = items.filter((i) => i.was_missed);
  const libraryMatch = useMemo(() => {
    const q = norm(text);
    if (q.length < 3) return null;
    const found = (items || []).find((i) => norm(i.name) === q || norm(i.name).startsWith(q));
    return found || null;
  }, [text, items]);

  const add = () => {
    if (!text.trim()) return;
    onAddMissedItem({ name: text.trim(), room_source: room, assigned_bag: bag });
    setText("");
  };

  return (
    <div className="mb-5 rounded-xl border-2 border-slate-300 bg-white p-3">
      <p className="text-sm font-bold">What did we wish we'd packed?</p>
      <p className="mb-3 mt-1 text-xs text-slate-500">
        These get added to this trip marked as missed — so the record shows what was actually needed — and you'll be offered them when starting the next trip.
      </p>

      {missed.length > 0 && (
        <ul className="mb-3 space-y-1.5">
          {missed.map((i) => (
            <li key={i.id} className="flex items-center gap-2 rounded-lg border-2 border-amber-200 bg-amber-50 px-2 py-2">
              <span className="min-w-0 flex-1 text-sm font-semibold text-amber-900">{i.name}</span>
              <button onClick={() => onPatchItem(i.id, { was_missed: false })}
                className="shrink-0 text-xs font-bold text-amber-700">Remove</button>
            </li>
          ))}
        </ul>
      )}

      <input className={inputCls} value={text} onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && add()} placeholder="Waterproof walking shoes" />

      {libraryMatch && (
        <p className="mt-2 rounded-lg border-2 border-teal-200 bg-teal-50 p-2 text-xs text-teal-800">
          Already in your library as "<strong>{libraryMatch.name}</strong>" — adding will use that name.
        </p>
      )}

      {text.trim() && (
        <>
          <div className="mt-2 grid grid-cols-2 gap-2">
            <div>
              <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Room</span>
              <select className={inputCls} value={room} onChange={(e) => setRoom(e.target.value)}>
                {rooms.map((r) => <option key={r}>{r}</option>)}
              </select>
            </div>
            <div>
              <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Bag</span>
              <select className={inputCls} value={bag} onChange={(e) => setBag(e.target.value)}>
                {bags.map((b) => <option key={b}>{b}</option>)}
              </select>
            </div>
          </div>
          <button onClick={add} className={`${btn} mt-2 w-full bg-slate-900 text-white`}>
            <Plus size={16} /> Add "{text.trim()}"
          </button>
        </>
      )}
    </div>
  );
}

/* Things we wished we'd done, or done sooner. These become real jobs on this
   trip, so they carry over with the rest of the job list next time. */

  const [text, setText] = useState("");

  const missedJobs = (tasks || []).filter((t) => t.was_missed);

  const add = () => {
    if (!text.trim()) return;
    onAddMissedJob({ title: text.trim(), kind });
    setText("");
  };

  return (
    <div className="mb-5 rounded-xl border-2 border-slate-300 bg-white p-3">
      <p className="text-sm font-bold">What did we wish we'd done, or done sooner?</p>
      <p className="mb-3 mt-1 text-xs text-slate-500">
        Booking assistance earlier, ordering a prescription sooner. These become jobs, and carry over to the next trip's list.
      </p>

      {missedJobs.length > 0 && (
        <ul className="mb-3 space-y-1.5">
          {missedJobs.map((t) => (
            <li key={t.id} className="flex items-center gap-2 rounded-lg border-2 border-amber-200 bg-amber-50 px-2 py-2">
              <span className="min-w-0 flex-1">
                <span className="block text-sm font-semibold text-amber-900">{t.title}</span>
                <span className="block text-xs text-amber-700">{JOB_KINDS.find((k) => k.id === t.kind)?.label}</span>
              </span>

          ))}

      )}

      <input className={inputCls} value={text} onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && add()} placeholder="Book assisted travel a week earlier" />

      {text.trim() && (
        <>
          <span className="mb-1 mt-2 block text-xs font-bold uppercase tracking-wider text-slate-400">Which list does it belong on?</span>
          <div className="grid grid-cols-1 gap-1.5">
            {JOB_KINDS.map((k) => (
              <button key={k.id} onClick={() => setKind(k.id)}
                className={`flex items-center gap-2 rounded-lg border-2 px-2 py-2 text-left text-sm font-bold ${kind === k.id ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white text-slate-600"}`}>
                <span className={`flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-2 ${kind === k.id ? "border-white bg-white" : "border-slate-300"}`}>
                  {kind === k.id && <span className="h-2 w-2 rounded-full bg-teal-700" />}
                </span>
                {k.label}
              </button>
            ))}
          </div>
          <button onClick={add} className={`${btn} mt-2 w-full bg-slate-900 text-white`}>
            <Plus size={16} /> Add "{text.trim()}"
          </button>
        </>
      )}
    </div>
  );
}

/* ------------------------------ sheets ------------------------------ */

function EditItemSheet({ item, rooms, bags, packers, onAddRoom, onAddBag, onClose, onSave, onDelete }) {
  const [d, setD] = useState(item);
  useEffect(() => setD(item), [item]);
  if (!item || !d) return null;
  const set = (k) => (e) => setD({ ...d, [k]: e.target.value });
  const Toggle = ({ on, onClick, Icon, label, tone }) => (
    <button onClick={onClick} className={`flex flex-1 items-center justify-center gap-1.5 rounded-xl border-2 px-2 py-3 text-xs font-bold ${on ? tone : "border-slate-300 bg-white text-slate-500"}`}>
      <Icon size={15} /> {label}
    </button>
  );
  return (
    <Sheet open title="Edit item" onClose={onClose}>
      <Field label="Item"><input className={inputCls} value={d.name} onChange={set("name")} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="From which room">
          <PickOrAdd value={d.room_source} options={rooms} placeholder="New room name"
            onChange={(v) => { setD({ ...d, room_source: v }); if (!rooms.includes(v)) onAddRoom(v); }} />

          <PickOrAdd value={d.assigned_bag} options={bags} placeholder="New bag name"

        </Field>
      </div>
      <Field label="How many">
        <QuantityInput value={d.quantity} onChange={(n) => setD({ ...d, quantity: n })} />
      </Field>
      <Field label="Who packs it">
        <div className="flex flex-wrap gap-2">
          {packers.map((p) => (
            <button key={p} onClick={() => setD({ ...d, packer: p })}
              className={`rounded-full border-2 px-3 py-2 text-sm font-bold ${d.packer === p ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white"}`}>{p}</button>
          ))}
        </div>
      </Field>
      <Field label="Note"><textarea rows="2" className={inputCls} value={d.notes_or_special_instructions || ""} onChange={set("notes_or_special_instructions")} /></Field>

        <Toggle on={d.is_flagged} onClick={() => setD({ ...d, is_flagged: !d.is_flagged })} Icon={Flag} label="Flag" tone="border-amber-500 bg-amber-100 text-amber-800" />
        <Toggle on={d.is_prescription} onClick={() => setD({ ...d, is_prescription: !d.is_prescription })} Icon={Pill} label="Prescription" tone="border-teal-700 bg-teal-100 text-teal-800" />
        <Toggle on={d.last_minute} onClick={() => setD({ ...d, last_minute: !d.last_minute })} Icon={Snowflake} label="Last minute" tone="border-sky-600 bg-sky-100 text-sky-800" />
      </div>
      {d.is_flagged && (
        <Field label="What's the problem?">
          <input className={inputCls} value={d.flag_note || ""} onChange={set("flag_note")} placeholder="Can't find it — check under the bunk" />
        </Field>
      )}
      <p className="mb-4 text-xs text-slate-500">
        Flag: something's wrong with this one and the other of you needs to know. Prescription: shows up in Reorder after the trip. Last minute: fridge, freezer, or still in use this morning.
      </p>

      <button onClick={() => onSave({
        name: d.name, room_source: d.room_source, assigned_bag: d.assigned_bag, quantity: d.quantity,
        notes_or_special_instructions: d.notes_or_special_instructions, packer: d.packer,
        is_flagged: d.is_flagged, flag_note: d.flag_note, is_prescription: d.is_prescription, last_minute: d.last_minute,
      })} className={`${btn} w-full bg-slate-900 py-4 text-white`}>Save changes</button>
      <button onClick={onDelete} className={`${btn} mt-3 w-full border-2 border-red-200 bg-white text-red-700`}><Trash2 size={16} /> Remove from list</button>
    </Sheet>
  );
}

function AddItemSheet({ open, rooms, bags, packers, items, onAddRoom, onAddBag, onClose, onAdd, onPasteList, onGoToLibrary }) {
  const blank = { name: "", room_source: rooms[0], assigned_bag: bags[0], quantity: 1, notes_or_special_instructions: "", packer: "Either of us", is_prescription: false, last_minute: false, is_flagged: false, flag_note: "" };
  const [d, setD] = useState(blank);
  const [keepOpen, setKeepOpen] = useState(true);
  const [localRooms, setLocalRooms] = useState(rooms);
  const [localBags, setLocalBags] = useState(bags);
  useEffect(() => { if (open) { setD(blank); setLocalRooms(rooms); setLocalBags(bags); } }, [open]);
  const submit = () => {
    if (!d.name.trim()) return;
    onAdd(d);
    if (keepOpen) setD({ ...blank, room_source: d.room_source, assigned_bag: d.assigned_bag, packer: d.packer });
    else onClose();
  };

  /* Live nudge as they type: is something close to this already in the
     library? Same normalising as the library's own dedup, plus a looser
     "starts with" check so "wipe" still surfaces "Wipes" while typing. */
  const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const libraryMatch = useMemo(() => {
    const q = norm(d.name);
    if (q.length < 3) return null;
    const seen = new Map();
    (items || []).forEach((i) => {
      const key = norm(i.name);
      if (!key) return;
      if (key === q || key.startsWith(q) || q.startsWith(key)) {
        if (!seen.has(key)) seen.set(key, { name: i.name, count: 0, key });
        seen.get(key).count++;
      }
    });
    const matches = [...seen.values()];
    // exact match first, otherwise the most-used near-match
    return matches.find((m) => m.key === q) || matches.sort((a, b) => b.count - a.count)[0] || null;
  }, [d.name, items]);

  return (
    <Sheet open={open} title="Add an item" onClose={onClose}>
      {onPasteList && (
        <button onClick={onPasteList} className={`${btn} mb-5 w-full border-2 border-slate-900 bg-white py-3`}>
          <ClipboardList size={16} /> Paste in a whole list instead
        </button>
      )}
      <Field label="Item"><input autoFocus className={inputCls} value={d.name} onChange={(e) => setD({ ...d, name: e.target.value })} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Ear defenders" /></Field>

      {libraryMatch && (
        <button
          onClick={() => onGoToLibrary(libraryMatch.name)}
          className="mb-4 -mt-2 flex w-full items-start gap-2 rounded-lg border-2 border-teal-300 bg-teal-50 p-3 text-left"
        >
          <BookOpen size={16} className="mt-0.5 shrink-0 text-teal-700" />
          <span className="text-sm text-teal-900">
            Want to add "<span className="font-bold underline">{libraryMatch.name}</span>" from the library?
            {libraryMatch.count > 1 && <span className="text-teal-700"> Used on {libraryMatch.count} trip{libraryMatch.count === 1 ? "" : "s"} already.</span>}
          </span>
        </button>
      )}

      <div className="grid grid-cols-2 gap-3">
        <Field label="From which room">
          <PickOrAdd value={d.room_source} options={localRooms} placeholder="New room name"
            onChange={(v) => { setD({ ...d, room_source: v }); if (!localRooms.includes(v)) { setLocalRooms([...localRooms, v]); onAddRoom(v); } }} />
        </Field>
        <Field label="Into which bag">
          <PickOrAdd value={d.assigned_bag} options={localBags} placeholder="New bag name"
            onChange={(v) => { setD({ ...d, assigned_bag: v }); if (!localBags.includes(v)) { setLocalBags([...localBags, v]); onAddBag(v); } }} />
        </Field>
      </div>
      <Field label="How many">
        <QuantityInput value={d.quantity} onChange={(n) => setD({ ...d, quantity: n })} />
      </Field>
      <Field label="Who packs it">
        <div className="flex flex-wrap gap-2">
          {packers.map((p) => (
            <button key={p} onClick={() => setD({ ...d, packer: p })}
              className={`rounded-full border-2 px-3 py-2 text-sm font-bold ${d.packer === p ? "border-teal-700 bg-teal-700 text-white" : "border-slate-300 bg-white"}`}>{p}</button>
          ))}
        </div>
      </Field>
      <div className="mb-4 flex gap-2">
        <button onClick={() => setD({ ...d, is_flagged: !d.is_flagged, flag_note: d.is_flagged ? "" : d.flag_note })}
          className={`flex flex-1 items-center justify-center gap-1.5 rounded-xl border-2 px-2 py-3 text-xs font-bold ${d.is_flagged ? "border-amber-500 bg-amber-100 text-amber-800" : "border-slate-300 bg-white text-slate-500"}`}>
          <Flag size={15} /> Flag
        </button>
        <button onClick={() => setD({ ...d, is_prescription: !d.is_prescription })}
          className={`flex flex-1 items-center justify-center gap-1.5 rounded-xl border-2 px-2 py-3 text-xs font-bold ${d.is_prescription ? "border-teal-700 bg-teal-100 text-teal-800" : "border-slate-300 bg-white text-slate-500"}`}>
          <Pill size={15} /> Prescription
        </button>
        <button onClick={() => setD({ ...d, last_minute: !d.last_minute })}
          className={`flex flex-1 items-center justify-center gap-1.5 rounded-xl border-2 px-2 py-3 text-xs font-bold ${d.last_minute ? "border-sky-600 bg-sky-100 text-sky-800" : "border-slate-300 bg-white text-slate-500"}`}>
          <Snowflake size={15} /> Last minute
        </button>
      </div>
      {d.is_flagged && (
        <Field label="What's the problem?">
          <input className={inputCls} value={d.flag_note} onChange={(e) => setD({ ...d, flag_note: e.target.value })} placeholder="Can't find it — check under the bunk" />

        <input type="checkbox" checked={keepOpen} onChange={(e) => setKeepOpen(e.target.checked)} className="h-5 w-5" />

      <button disabled={!d.name.trim()} onClick={submit} className={`${btn} w-full bg-slate-900 py-4 text-white disabled:opacity-40`}>Add to list</button>
    </Sheet>

}
