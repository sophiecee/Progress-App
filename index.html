  var d = document.createElement('div');
  d.setAttribute('style',
    'position:fixed;inset:0;z-index:99999;overflow:auto;background:#fff;color:#7f1d1d;' +

  d.textContent = title + '\n\n' + detail;

}
window.addEventListener('error', function (e) {
  showFailure('Something failed to load:',

/* Icons are drawn from lucide, loaded from a CDN. If it fails to load the app
   still works, the little pictures just go blank. */
function LucideIcon({ name, size = 16, className = "", strokeWidth = 2, ...rest }) {
  /* lucide stores each icon as ["svg", {attrs}, [ [tag, attrs], ... ] ] */
  let parts = [];
  try {
    const icon = window.lucide && window.lucide.icons && window.lucide.icons[name];
    if (Array.isArray(icon) && Array.isArray(icon[2])) parts = icon[2];
  } catch (e) { parts = []; }

  const children = parts.map(function (part, i) {
    if (!Array.isArray(part) || typeof part[0] !== "string") return null;
    const attrs = part[1] && typeof part[1] === "object" ? part[1] : {};
    return React.createElement(part[0], { key: i, ...attrs });
  }).filter(Boolean);

  return React.createElement(
    "svg",
    { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
      strokeWidth, strokeLinecap: "round", strokeLinejoin: "round", className, ...rest },
    children
  );
}

/* ------------------- pasting in an old packing list ------------------
   Handles the shape Google Tasks lists come out in: headings that may or
   may not end in a colon, quantities written as "x3" / "X2" / "7 bottles"
   (sometimes glued straight onto the name), and parenthetical asides that
   are really notes rather than part of the item name. */
const HEADING_WORDS = [
  "downstairs", "upstairs", "kitchen", "meds", "medicine", "medication",
  "bathroom", "bedroom", "living room", "hallway", "utility", "garage",
  "shed", "fridge", "freezer", "nursery", "car", "loft", "conservatory",
  "bag", "suitcase", "rucksack", "backpack", "box",
];

function looksLikeHeading(line) {
  let t = line.trim();
  if (!t) return false;
  // strip a leading checkbox before judging, e.g. "[ ] **BUGGIES:**"
  t = t.replace(/^\[[ xX]?\]\s*/, "").trim();
  if (!t) return false;
  // **BOLD:** or *italic:* wrapped headings — markdown emphasis around a colon-ended line
  if (/^\*{1,2}[^*]+\*{1,2}:?\s*$/.test(t)) return true;
  if (t.endsWith(":")) return true;
  const low = t.toLowerCase().replace(/:$/, "").replace(/\*/g, "");
  if (t.split(/\s+/).length <= 4 && HEADING_WORDS.some((h) => low.includes(h))) {
    if (!/[xX]\s*\d+\s*$/.test(t) && !/\(/.test(t)) return true;
  }
  return false;
}

function parseListItem(raw) {
  let line = raw.trim()
    .replace(/^[-–—*•\u2022]\s*/, "")
    .replace(/^\[[ xX]?\]\s*/, "")      // "[ ]", "[x]" checkbox syntax
    .replace(/^[-–—]\s*\[[ xX]?\]\s*/, "") // "- [ ]" nested checkbox syntax
    .replace(/^\*\*|\*\*$/g, "")        // **bold** markers left over from markdown
    .trim();
  let quantity = 1;
  let notes = "";
  const paren = line.match(/\(([^)]*)\)/);
  if (paren) { notes = paren[1].trim(); line = line.replace(paren[0], "").trim(); }
  const trailing = line.match(/[xX]\s*(\d+)\s*$/);
  if (trailing) { quantity = parseInt(trailing[1], 10); line = line.slice(0, trailing.index).trim(); }
  const leading = line.match(/^(\d+)\s+(.*)$/);
  if (leading && quantity === 1) { quantity = parseInt(leading[1], 10); line = leading[2].trim(); }
  line = line.replace(/[,\-–]\s*$/, "").trim();
  return { name: line, quantity, notes };
}

function parsePastedList(text) {
  const groups = [];
  let current = { heading: "Unsorted", items: [] };
  text.split(/\r?\n/).forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    if (looksLikeHeading(line)) {
      if (current.items.length) groups.push(current);
      const cleanHeading = line
        .replace(/^\[[ xX]?\]\s*/, "")
        .replace(/\*{1,2}/g, "")
        .replace(/:$/, "")
        .trim();
      current = { heading: cleanHeading || "Unsorted", items: [] };
    } else {
      const parsed = parseListItem(line);
      if (parsed.name) current.items.push(parsed);
    }
  });
  if (current.items.length) groups.push(current);
  return groups;
}

/* Recognise a trip title as the very first non-empty line, so it becomes
   the trip's own name/month/transport rather than an item to pack.
   Titles in these lists read like: "Efteling christmas 25, driving" or
   "Iona summer 2026, 9 days train and ferry" — free text, comma-loose,
   never itself something you'd pack. */
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
const MONTH_ALIASES = { christmas: "December", xmas: "December", easter: "April", halloween: "October", newyear: "January" };
const TRANSPORTS = [
  { match: /\bplane|flying|flight\b/i, value: "Plane" },
  { match: /\btrain\b/i, value: "Train" },
  { match: /\bferry\b/i, value: "Ferry" },
  { match: /\bcoach\b/i, value: "Coach" },
  { match: /\bcar|driving|drive\b/i, value: "Car" },
];

function extractTripTitle(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return null;
  const first = lines[0];
  if (looksLikeHeading(first)) return null; // it's a real group heading, leave it alone

  const low = first.toLowerCase();
  const monthWordFound = MONTHS.find((m) => low.includes(m));
  const monthAliasFound = Object.keys(MONTH_ALIASES).find((a) => low.includes(a));
  const monthFound = monthWordFound ? monthWordFound[0].toUpperCase() + monthWordFound.slice(1) : (monthAliasFound ? MONTH_ALIASES[monthAliasFound] : null);
  const daysFound = first.match(/(\d+)\s*day/i);
  const transportFound = TRANSPORTS.find((t) => t.match.test(first));
  const internationalFound = /international|flying|flight|passport/i.test(first);

  // Only treat it as a title if it has at least one recognisable trip signal —
  // otherwise a genuine "no heading" list would lose its first real item.
  if (!monthFound && !daysFound && !transportFound) return null;

  const namePart = first.split(/[,.]/)[0].trim();

  return {
    consumedLine: first,
    name: namePart || "Imported trip",
    month: monthFound,
    days: daysFound ? parseInt(daysFound[1], 10) : null,
    transport: transportFound ? transportFound.value : null,
    international: internationalFound,
  };
}

/* Best-effort room guessing for a group heading. Real matches only — if
   nothing fits, say so rather than silently picking whatever's first in
   the list, which looks like a confident guess but isn't one. */
const UPSTAIRS_HINTS = ["bedroom", "bathroom", "landing", "loft", "utility cupboard", "utility"];
const DOWNSTAIRS_HINTS = ["kitchen", "living room", "hallway", "garage", "shed", "conservatory", "downstairs"];

function guessRoom(heading, rooms) {
  const low = heading.toLowerCase();
  const isNegated = (word) => new RegExp(`\\b(non|not|no)\\s+${word}`).test(low);

  const direct = rooms.find((r) => {
    const name = r.toLowerCase();
    const firstWord = name.split(" ")[0];
    return !isNegated(firstWord) && (low.includes(name) || low.includes(firstWord));
  });
  if (direct) return direct;

  if (low.includes("upstairs")) {
    const match = rooms.find((r) => UPSTAIRS_HINTS.some((h) => r.toLowerCase().includes(h) && !isNegated(h.split(" ")[0])));
    if (match) return match;
  }
  if (low.includes("downstairs")) {
    const match = rooms.find((r) => DOWNSTAIRS_HINTS.some((h) => r.toLowerCase().includes(h) && !isNegated(h.split(" ")[0])));
    if (match) return match;
  }
  return null; // no confident guess
}

function guessBag(heading, bags) {
  const low = heading.toLowerCase();
  const direct = bags.find((b) => low.includes(b.toLowerCase()) || low.includes(b.toLowerCase().split(" ")[0]));
  if (direct) return direct;
  return null;
}

/* --------------------------- supabase REST -------------------------- */

function makeClient(url, key) {
  const base = url.replace(/\/$/, "");
  const h = { apikey: key, Authorization: `Bearer ${key}`, "Content-Type": "application/json" };
  const go = async (path, opts = {}) => {
    const res = await fetch(`${base}/rest/v1/${path}`, { ...opts, headers: { ...h, ...(opts.headers || {}) } });
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  };
  return {
    all: (table) => go(`${table}?select=*`),
    insert: (table, rows) => go(table, { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(rows) }),
    update: (table, id, patch) => go(`${table}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) }),
    remove: (table, id) => go(`${table}?id=eq.${id}`, { method: "DELETE" }),
    /* Insert-or-update in one call, for the single shared settings row —
       simpler than checking existence first from a phone on a flaky connection. */
    upsert: (table, row) => go(table, { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=representation" }, body: JSON.stringify(row) }),
  };
}

/* ------------------------------- AI -------------------------------- */

async function callClaude(prompt, maxTokens = 1000, onStatus) {
  const apiKey = (await store.get("anthropic-key")) || "";
  if (!apiKey) throw new Error("Add your Anthropic API key in Settings first — the AI features need it.");

  /* "Failed to fetch" is the browser's single generic message for several very
     different problems, so retry a couple of times (transient drops are the
     most common cause by far) and then report something specific. */
  const attempt = async () => {
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens, messages: [{ role: "user", content: prompt }] }),
    });
  };

  let res, lastNetworkError;
  for (let tryNum = 1; tryNum <= 3; tryNum++) {
    try {
      if (onStatus && tryNum > 1) onStatus(`Connection failed — retrying (${tryNum} of 3)…`);
      res = await attempt();
      lastNetworkError = null;
      break;
    } catch (e) {
      lastNetworkError = e;
      if (tryNum < 3) await new Promise((r) => setTimeout(r, tryNum * 1500));
    }
  }

  if (lastNetworkError) {
    const online = typeof navigator !== "undefined" && navigator.onLine === false ? false : true;
    if (!online) {
      throw new Error("Your phone reports no internet connection. The AI features need one — everything else in the app works offline.");
    }
    throw new Error(
      "Couldn't reach Anthropic's servers after three tries, even though your phone thinks it's online.\n\n" +
      "This is usually one of:\n" +
      "• the wifi network or router blocking api.anthropic.com\n" +
      "• a DNS filter or parental-control service on the network\n" +
      "• a temporary outage at Anthropic's end\n\n" +
      "Worth trying mobile data, or a different network, to tell which. Everything else in the app is unaffected."
    );
  }

  if (res.status === 401) throw new Error("That Anthropic API key was rejected. Check it in Settings — it may have been revoked or mistyped.");
  if (res.status === 429) throw new Error("Rate limited by Anthropic — too many requests too quickly. Wait a minute and try again.");
  if (res.status === 400) {
    let detail = "";
    try { const j = await res.json(); detail = j?.error?.message || ""; } catch {}
    throw new Error("Anthropic rejected the request" + (detail ? `: ${detail}` : ". Check your API key has credit available."));
  }
  if (res.status === 402 || res.status === 403) {
    throw new Error("Anthropic refused the request — usually this means the API key has no credit left, or lacks permission. Check console.anthropic.com.");
  }
  if (res.status >= 500) throw new Error(`Anthropic's servers returned an error (${res.status}). Usually temporary — try again shortly.`);
  if (!res.ok) throw new Error(`The AI request failed with status ${res.status}. Try again in a moment.`);

  const data = await res.json();
  const text = (data.content || []).map((c) => c.text || "").join("");
  const s = text.indexOf("[");
  if (s === -1) throw new Error("The AI reply couldn't be read. Try again.");

  let end = text.lastIndexOf("]");
  let slice = end > s ? text.slice(s, end + 1) : text.slice(s);
  try {
    return JSON.parse(slice);
  } catch (e) {
    /* Reply likely got cut off mid-object. Drop back to the last complete
       item — the last "}," or "}" before the break — and close the array. */
    let cut = slice.lastIndexOf("},");
    if (cut === -1) cut = slice.lastIndexOf("}");
    if (cut === -1) throw new Error("The AI reply couldn't be read. Try again.");
    const repaired = slice.slice(0, cut + 1) + "]";
    try {
      return JSON.parse(repaired);
    } catch (e2) {
      throw new Error("The AI reply couldn't be read. Try again.");
    }
  }
}

const historyText = (trips, items) =>
  trips.slice(0, 8).map((t) => {
    const names = items.filter((i) => i.trip_id === t.id).map((i) => i.name).join(", ");
    const when = t.created_at ? String(t.created_at).slice(0, 10) : "date unknown";
    const bits = [
      `${t.month}`, `${t.days} days`, `by ${t.transport}`,
      t.accommodation ? t.accommodation : null,
      t.international ? "international" : "domestic",
      t.nights_en_route ? `${t.nights_en_route} night(s) in temporary accommodation en route` : null,
    ].filter(Boolean).join(", ");
    let line = `- "${t.name}" [logged ${when}] (${bits}): ${names || "no items"}`;
    const missedNames = items.filter((i) => i.trip_id === t.id && i.was_missed).map((i) => i.name);
    if (missedNames.length) {
      line += `\n  WISHED THEY'D PACKED (forgotten on this trip — include these unless clearly irrelevant now): ${missedNames.join(", ")}`;
    }
    if (t.review) {
      try {
        const r = JSON.parse(t.review);
        line += `\n  AFTERWARDS: bags used: ${r.bags_used || "?"}. Not used: ${r.unused || "none"}. Worked well: ${r.what_worked || ""}. ${r.notes || ""}`;
      } catch {}
    }
    return line;
  }).join("\n");

/* The draft used to be one huge request for 45 items, which regularly ran out
   of response room and got truncated. It's now five smaller focused requests
   run in sequence: each one completes reliably, each can be more thorough about
   its own area, and if one fails the others still land. */
const DRAFT_SECTIONS = [
  {
    id: "medical",
    label: "medication and medical kit",

    max: 18,
  },
  {
    id: "documents",
    label: "documents and logistics",
    brief: "Travel documents, wallets, phones, chargers, adaptors, and anything needed to physically get there and get assistance. Include blue badge, medical letters and equipment-related paperwork if the past trips mention them.",
    max: 12,
  },
  {
    id: "food",
    label: "food and feeding",
    brief: "Safe foods, smoothies, snacks, pouches, thermoses, cups, spoons, bibs, cool bag and ice blocks, food prep equipment. Weight ACCOMMODATION heavily — self-catering needs prep kit a hotel does not. Mark anything from the fridge or freezer, or still in use that morning, with l:true.",
    max: 14,
  },
  {
    id: "clothing",
    label: "clothing and sleep",
    brief: "Clothing, footwear, weather gear, nightwear, blankets, comforters, sleep equipment such as bed barriers and night lights. Weight SEASON above all — a trip in a similar month is far more informative than a recent one in a different season. Scale outfit counts to the trip length assuming some hand washing.",
    max: 16,
  },
  {
    id: "other",
    label: "sensory, entertainment and everything else",
    brief: "Sensory and regulation items, ear defenders, chewies, entertainment for the journey and for downtime, toiletries, nappies and changing supplies, buggies and mobility equipment, and anything else not already covered by medication, documents, food, or clothing.",

];

function draftContext({ month, days, transport, needs, history, accommodation, international, nightsEnRoute }) {
  return `THIS TRIP:
- ${month}, ${days} days, travelling by ${transport}
- Accommodation: ${accommodation || "not specified"}
- ${international ? "INTERNATIONAL — passports, birth certificates, travel insurance, international breakdown cover, EU plug adaptors all matter" : "Domestic"}
- ${nightsEnRoute ? `${nightsEnRoute} night(s) in temporary accommodation on the way out — that much needs to be reachable in the overnight grab bag, not buried` : "No overnight stops en route"}

CHILDREN'S NEEDS: ${needs || "not specified"}

PAST TRIPS (most recently logged first), with what they said afterwards:
${history || "No past trips recorded yet."}

GENERAL RULES:
- ALWAYS include swimming things for everyone, on every trip regardless of season or destination — pools, hotel spas and unexpected warm days all happen, and it's the single most commonly forgotten category.
${["May", "June", "July", "August", "September"].includes(month) ? "- This is a SUMMER trip (" + month + "). Always include insect repellent, sun cream, sun hats and sunglasses. Whether it's a midge-heavy Scottish August or a hot Mediterranean one, all of these matter.\n" : ""}${["November", "December", "January", "February"].includes(month) ? "- This is a WINTER trip (" + month + "). Include thermal layers, gloves, hats, waterproofs and warm outerwear for everyone.\n" : ""}- Consumables (nappies, wipes, feeds, medication doses) scale linearly with ${days} days; equipment does not.
- If a past trip's notes say something came home unused, don't suggest it again unless season or transport makes it newly relevant.
- If a past trip's notes say they wished they'd had something, include it.
- Anything needed before the main luggage is opened belongs in the overnight grab bag. Anything needed during the journey belongs in the cabin/close-by bag.`;
}

async function draftItemsSectioned(params, onProgress) {
  const { rooms, bags } = params;
  const context = draftContext(params);
  const collected = [];
  const failures = [];
  const seen = new Set();
  const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

  for (let idx = 0; idx < DRAFT_SECTIONS.length; idx++) {
    const section = DRAFT_SECTIONS[idx];
    if (onProgress) onProgress(`Working through ${section.label}… (${idx + 1} of ${DRAFT_SECTIONS.length})`);

    const already = collected.length
      ? `\n\nALREADY SUGGESTED by earlier sections — do NOT repeat any of these:\n${collected.map((i) => i.name).join(", ")}`
      : "";

    const prompt = `You help a family pack for holidays. Two adults, two children with complex needs and medical requirements.

${context}

YOUR SECTION THIS TIME: ${section.label}
${section.brief}${already}

Cover this section thoroughly. Return ONLY a JSON array, no prose, no fences. Up to ${section.max} objects. Compact keys:
n = item name (short)
r = source room, ONLY from: ${rooms.join(", ")}
b = target bag, ONLY from: ${bags.join(", ")}
q = quantity (number)
p = true only if it is prescription medication
l = true only if it can't be packed until the morning (fridge, freezer, charging, in daily use)
x = short note, only where it genuinely helps. Empty string otherwise.`;

    try {
      const raw = await callClaude(prompt, 1400, onProgress);
      raw.forEach((o) => {
        const name = String(o.n || "").slice(0, 80);
        if (!name) return;
        const key = norm(name);
        if (seen.has(key)) return; // section overlap, keep the first
        seen.add(key);
        collected.push({
          name,
          room_source: o.r || rooms[0],
          assigned_bag: o.b || bags[0],
          quantity: Number(o.q) || 1,
          is_prescription: !!o.p,
          last_minute: !!o.l,
          notes_or_special_instructions: o.x || "",
        });
      });
    } catch (e) {
      failures.push(section.label);
    }
  }

  if (!collected.length) {
    throw new Error(
      failures.length
        ? `Couldn't draft any sections. ${failures.length === DRAFT_SECTIONS.length ? "All of them failed" : "Failed on: " + failures.join(", ")}. Check your connection and API key, then try again.`
        : "The AI returned nothing usable. Try again."
    );
  }

  return { items: collected, failures };
}


async function draftJobs({ month, days, transport, needs, history, kind, existing }) {
  const kindBrief = {
    sort: "admin and arrangements to sort in the weeks before leaving — bookings, assistance, equipment fixings, insurance, medical letters, pet care, prescriptions",
    buy: "things to buy or reorder before leaving",
    leaving: "the final checks in the last ten minutes before leaving the house, in the order you'd do them",
  }[kind];
  const existingList = existing?.length ? existing.map((t) => `- ${t}`).join("\n") : "none yet";
  const raw = await callClaude(`A family with two adults and two children with special needs is going away: ${month}, ${days} days, by ${transport}.
CHILDREN'S NEEDS: ${needs || "not specified"}
PAST TRIPS AND WHAT THEY LEARNED:
${history || "none"}

ALREADY ON THIS TRIP'S LIST — do not suggest any of these again, including close rewordings of them:
${existingList}

List ${kindBrief}.
Return ONLY a JSON array, max 14 objects, keys: t = short task title, x = short note or empty string. No prose, no fences.`, 700);
  return raw.map((o) => ({ title: String(o.t || "").slice(0, 90), notes: o.x || "" })).filter((t) => t.title);
}

const inputCls = "w-full rounded-xl border-2 border-slate-300 bg-white px-3 py-3 text-base text-slate-900 focus:border-teal-600 focus:outline-none";
const btn = "flex items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-bold transition active:scale-95";

const Field = ({ label, children }) => (
  <label className="mb-4 block">
    <span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500">{label}</span>
    {children}
  </label>
);

/* A real dropdown of existing names, plus a one-tap way to add a brand new
   one — datalist inputs don't show their options until you start typing,
   which is why this exists instead. */
function PickOrAdd({ value, options, onChange, placeholder }) {
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState("");
  if (adding) {
    return (
      <div className="flex gap-2">
        <input
          autoFocus
          className={inputCls}
          placeholder={placeholder || "New name"}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter" && draft.trim()) { onChange(draft.trim()); setAdding(false); setDraft(""); }
            if (e.key === "Escape") { setAdding(false); setDraft(""); }
          }}
        />
        <button
          onClick={() => { if (draft.trim()) { onChange(draft.trim()); setAdding(false); setDraft(""); } }}
          className={`${btn} shrink-0 bg-slate-900 px-4 text-white`}
        >
          <Check size={16} strokeWidth={3} />
        </button>
        <button onClick={() => { setAdding(false); setDraft(""); }} className={`${btn} shrink-0 border-2 border-slate-300 bg-white px-4`}>
          <X size={16} />
        </button>
      </div>
    );
  }
  return (
    <select
      className={inputCls}
      value={options.includes(value) ? value : ""}
      onChange={(e) => { if (e.target.value === "__add__") setAdding(true); else onChange(e.target.value); }}
    >
      {!options.includes(value) && value && <option value="">{value} (not in list)</option>}
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
      <option value="__add__">+ Add new…</option>
    </select>
  );
}

/* A quantity stepper that never fights the person typing — the box can sit
   empty while editing, and only snaps back to 1 once they look away. */
function QuantityInput({ value, onChange }) {
  const [text, setText] = useState(String(value));
  useEffect(() => { setText(String(value)); }, [value]);
  const step = (delta) => onChange(Math.max(1, (Number(value) || 1) + delta));
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => step(-1)} className="rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-lg font-bold" aria-label="Decrease">−</button>
      <input
        type="number"
        min="1"
        className={`${inputCls} text-center`}
        value={text}
        onChange={(e) => setText(e.target.value)}
        onBlur={() => { const n = parseInt(text, 10); onChange(n > 0 ? n : 1); setText(String(n > 0 ? n : 1)); }}
      />
      <button onClick={() => step(1)} className="rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-lg font-bold" aria-label="Increase">+</button>
    </div>
  );
}

function Sheet({ open, title, onClose, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex flex-col justify-end bg-slate-900 bg-opacity-50">
      <div className="max-h-full w-full overflow-y-auto rounded-t-3xl border-t-4 border-slate-900 bg-slate-50 pb-12">
        <div className="sticky top-0 z-10 flex items-center justify-between border-b-2 border-slate-200 bg-slate-50 px-4 py-3">
          <h2 className="text-base font-bold">{title}</h2>
          <button onClick={onClose} className="rounded-full border-2 border-slate-300 p-2 text-slate-600" aria-label="Close"><X size={18} /></button>
        </div>
        <div className="px-4 py-4">{children}</div>
      </div>
    </div>
  );
}

function Meter({ done, total }) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return (
    <div className="flex items-center gap-3">
      <div className="h-2 flex-1 overflow-hidden rounded-full bg-slate-200">
        <div className="h-full rounded-full bg-teal-600 transition-all duration-500" style={{ width: `${pct}%` }} />
      </div>
      <span className="w-14 text-right text-xs font-bold tabular-nums text-slate-500">{done}/{total}</span>
    </div>
  );
}

const initials = (n) => (n || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();

function PackerDot({ name, onClick }) {
  if (!name) return null;
  const tone = { 0: "bg-slate-900", 1: "bg-teal-700", 2: "bg-slate-400", 3: "bg-amber-600", 4: "bg-slate-600" };
  const idx = Math.abs([...name].reduce((a, c) => a + c.charCodeAt(0), 0)) % 5;
  return (
    <button onClick={onClick} title={name}
      className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold text-white ${tone[idx]}`}>
      {initials(name)}
    </button>
  );
}
